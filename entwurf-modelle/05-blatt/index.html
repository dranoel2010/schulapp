const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const state={route:'home',day:1,done:[false,false,true],studied:false,materials:[],answer:false};
try{const saved=JSON.parse(localStorage.getItem('05-blatt-v1'));if(saved){if(Array.isArray(saved.done)&&saved.done.length===3)state.done=saved.done;if(typeof saved.studied==='boolean')state.studied=saved.studied;if(Array.isArray(saved.materials))state.materials=saved.materials.filter(x=>typeof x.title==='string'&&typeof x.subject==='string')}}catch{}
const save=()=>{try{localStorage.setItem('05-blatt-v1',JSON.stringify({done:state.done,studied:state.studied,materials:state.materials}))}catch{}};
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tasks=[['S. 84, Nr. 3–5','Mathematik'],['Gedichtanalyse beenden','Deutsch'],['Vokabeln Unit 3','Englisch']];
let H=app.clientHeight,snaps=[H-193,Math.round(H*.39),54],level=2,y=snaps[2],target=y,velocity=0,frame=0,lastFrame=0,drag=null,toastTimer,undoAction=null,viewAnimation=null,keyboard=false;
function paint(){sheet.style.transform=`translate3d(0,${y}px,0)`}
function updateViewport(){view.style.height=`${Math.max(0,H-target-96-83)}px`;sheet.classList.toggle('compact',level===0);view.inert=level===0;handle.setAttribute('aria-expanded',String(level!==0));handle.setAttribute('aria-label',`Blatt ${['kompakt','halbhoch','groß'][level]}. Tippen zum Vergrößern, Pfeiltasten zum Ändern.`);$$('[data-level]').forEach(b=>b.style.opacity=+b.dataset.level===level?'1':'.35');if($('.height-toggle'))$('.height-toggle').setAttribute('aria-label',`Blatt ${['kompakt','halbhoch','groß'][level]}. Zur nächsten Höhe wechseln.`)}
// A critically damped spring with response 0.3 s; release velocity carries into it.
function tick(t){const dt=Math.min((t-lastFrame)/1000||1/60,1/32);lastFrame=t;const omega=2*Math.PI/.3;velocity+=((target-y)*omega*omega-2*omega*velocity)*dt;y+=velocity*dt;paint();if(Math.abs(y-target)<.3&&Math.abs(velocity)<2){y=target;velocity=0;frame=0;paint();return}frame=requestAnimationFrame(tick)}
function setHeight(next,instant=false){level=Math.max(0,Math.min(2,next));target=snaps[level];updateViewport();if(reduced.matches||instant||keyboard){cancelAnimationFrame(frame);frame=0;y=target;velocity=0;paint()}else if(!frame){lastFrame=performance.now();frame=requestAnimationFrame(tick)}}
function heights(){return `<button class="height-toggle" data-cycle aria-label="Blatthöhe ändern">${[0,1,2].map(i=>`<i data-level="${i}" aria-hidden="true"></i>`).join('')}</button>`}
function title(t,sub,back,cam=false){head.innerHTML=`${back?`<button class="icon-button back" data-route="${back}" aria-label="Zurück">${icon('back')}</button>`:''}<div class="sheet-heading"><h2 tabindex="-1">${t}</h2><p>${sub}</p></div>${cam?`<button class="icon-button camera-shortcut" data-route="camera" aria-label="Blatt aufnehmen">${icon('camera')}</button>`:heights()}`}
function taskRow(i){return `<div class="task-row ${state.done[i]?'done':''}" data-task-row="${i}"><button class="task-check" data-task="${i}" role="checkbox" aria-checked="${state.done[i]}" aria-label="${tasks[i][1]}: ${tasks[i][0]}"><span class="check-circle">${icon('check')}</span></button><div class="task-copy"><strong>${tasks[i][0]}</strong><small>${tasks[i][1]}${i===2?' · gestern':''}</small></div></div>`}
function home(){title('Heute','Montag, 12. Oktober · zu Hause',null,true);return `<div class="section-head" style="margin-top:0"><h3>Hausaufgaben für morgen</h3><button class="text-button" data-route="tasks">Alle</button></div>${taskRow(0)}${taskRow(1)}<div class="section-head"><h3>Heute lernen</h3><button class="text-button" data-route="exam">Lernplan</button></div><button class="home-next" style="margin-bottom:0" data-route="study"><div class="time-block">25<small>Minuten</small></div><div class="next-info"><strong>Scheitelpunktform</strong><p>${state.studied?'Lernblock erledigt':'Mathe · Klausur am Freitag'}</p></div>${icon('chevron','chevron')}</button><button class="plain-row" data-route="quiz">${icon('book')}Wissen abrufen${icon('chevron','chevron')}</button><div class="section-head"><h3>Blätter</h3><button class="text-button" data-route="material">Ablage öffnen</button></div><button class="plain-row" data-route="camera">${icon('camera')}Blatt aufnehmen${icon('chevron','chevron')}</button>${state.materials.length?`<button class="material-row" data-material="${state.materials.length-1}"><span class="mini-paper">${icon('paper')}</span><span><strong>${escapeHTML(state.materials.at(-1).title)}</strong><p>Zuletzt abgelegt · ${escapeHTML(state.materials.at(-1).subject)}</p></span>${icon('chevron','chevron')}</button>`:''}<div class="section-head"><h3>Nachschlagen</h3></div><button class="plain-row" data-route="week">${icon('calendar')}Stundenplan ansehen${icon('chevron','chevron')}</button><button class="plain-row" data-route="subject">${icon('book')}Fächer & Noten${icon('chevron','chevron')}</button>`}
function taskScreen(){title('Hausaufgaben','Für Dienstag, 13. Oktober',null);const remaining=state.done.slice(0,2).filter(x=>!x).length;return `<div class="count-line">${icon(remaining?'checklist':'check')}<span id="remaining-count">${remaining?`${remaining} Aufgaben noch offen`:'Alles für morgen erledigt'}</span></div>${taskRow(0)}${taskRow(1)}<div class="date-divider">Von gestern</div>${taskRow(2)}<p class="muted" style="font-size:12px;margin-top:23px">Ein Häkchen lässt sich jederzeit zurücknehmen.</p>`}
function week(){title('Stundenplan','Zum Nachsehen · 12. bis 16. Oktober','home');const ds=['Mo','Di','Mi','Do','Fr'];const days=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];let body='';if(state.day===0)body=`<div class="timeline"><div class="lesson-row"><div class="lesson-time">08:00<small>09:30</small></div><div class="lesson-detail"><strong>Deutsch</strong><p>Raum 104 · vorbei</p></div></div><div class="lesson-row"><div class="lesson-time">09:50<small>11:20</small></div><div class="lesson-detail"><strong>Mathematik</strong><p>Raum 208 · vorbei</p></div></div><div class="lesson-row"><div class="lesson-time">11:40<small>13:10</small></div><div class="lesson-detail"><strong>Biologie</strong><p>Bio 1 · vorbei</p></div></div></div><div class="count-line">${icon('sun')}Ab 13:10 frei</div><button class="learn-row" data-route="study"><span class="learn-symbol">${icon('book')}</span><span class="learn-copy"><strong>Scheitelpunktform</strong><p>25 Minuten · ohne feste Uhrzeit</p></span>${icon('chevron','chevron')}</button>`;else if(state.day===1)body=`<div class="section-head"><h3>Hausaufgaben fällig</h3></div>${taskRow(0)}${taskRow(1)}`;else if(state.day===4)body=`<button class="learn-row" data-route="exam"><span class="learn-symbol">${icon('calendar')}</span><span class="learn-copy"><strong>Mathematik-Klausur</strong><p>Quadratische Funktionen</p></span>${icon('chevron','chevron')}</button>`;else body=`<button class="learn-row" data-route="exam"><span class="learn-symbol">${icon('book')}</span><span class="learn-copy"><strong>${state.day===2?'Wiederholung':'Probeklausur'}</strong><p>Mathematik · ohne feste Uhrzeit</p></span>${icon('chevron','chevron')}</button>`;return `<div class="day-tabs" role="tablist" aria-label="Wochentag">${ds.map((d,i)=>`<button role="tab" aria-selected="${state.day===i}" data-day="${i}">${d}<b>${12+i}</b></button>`).join('')}</div><h3 style="font-size:17px;margin-bottom:25px">${days[state.day]}, ${12+state.day}. Oktober</h3>${body}${state.day?'<p class="muted" style="font-size:13px;margin-top:26px">Keine Unterrichtsstunden eingetragen.</p>':''}`}
function exam(){title('Mathematik','Klausur','home');return `<div class="exam-hero"><h3>Quadratische<br>Funktionen</h3><div class="exam-date">${icon('calendar')}Freitag, 16. Oktober · in 4 Tagen</div></div><div class="section-head"><h3>Dein Lernplan</h3></div><div class="study-line"><div class="study-date">Heute<b>12</b></div><div class="study-info"><strong>Scheitelpunktform</strong><p>25 Minuten · ${state.studied?'erledigt':'Zeit frei einteilen'}</p><button class="small-action" data-route="study">${state.studied?'Noch einmal ansehen':'Lernblock öffnen'}${icon('arrow')}</button></div></div><div class="study-line"><div class="study-date">Mi<b>14</b></div><div class="study-info"><strong>Wiederholung</strong><p>Quadratische Funktionen</p></div></div><div class="study-line"><div class="study-date">Do<b>15</b></div><div class="study-info"><strong>Probeklausur</strong><p>Vorbereitung für Freitag</p></div></div><button class="plain-row" data-route="quiz">${icon('book')}Wissen abrufen${icon('chevron','chevron')}</button><button class="plain-row" data-route="subject">Deine Noten in Mathe${icon('chevron','chevron')}</button>`}
function study(){title('Lernblock','Heute · Mathematik','exam');return `<div class="exam-hero"><h3>Scheitelpunktform</h3><div class="count-line" style="margin:17px 0 0">${icon('clock')}25 Minuten · ohne feste Uhrzeit</div></div><div class="study-note"><h3>Das übst du heute</h3><p>Den Scheitelpunkt ablesen und eine quadratische Funktion in die Scheitelpunktform umformen.</p></div><div class="formula">f(x) = a(x − d)² + e</div><p class="detail-intro" style="font-size:14px">Der Scheitelpunkt ist S(d | e). Der Faktor a bestimmt Öffnung und Streckung der Parabel.</p><button class="secondary" data-route="quiz">Wissen abrufen</button><button class="primary" data-study>${icon(state.studied?'check':'checklist')}${state.studied?'Erledigt · Zurücknehmen':'Lernblock abhaken'}</button>`}
const paper=()=>`<div class="paper"><h3>Quadratische<br>Funktionen</h3><div class="paper-rule"></div><p>Die Scheitelpunktform</p><div class="paper-math">f(x) = a(x − d)² + e</div><p>1. Lies den Scheitelpunkt ab.<br>2. Zeichne die Parabel.<br>3. Beschreibe ihre Öffnung.</p><div class="paper-rule"></div><p>S ( d | e )</p></div>`;
function camera(){title('Blatt aufnehmen','Mathematik','material');return `<div class="camera-view"><span class="camera-label">Kamera-Vorschau · Demo</span>${paper()}<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div><p class="camera-hint">Das ganze Blatt in den Rahmen halten.</p><button class="shutter" data-route="review" aria-label="Foto aufnehmen"><span>${icon('camera')}</span></button>`}
function review(){title('Aufnahme prüfen','1 Seite','camera');return `<div class="review-paper">${paper()}</div><label class="field">Titel<input id="material-title" maxlength="100" value="Quadratische Funktionen" autocomplete="off"></label><label class="field">Fach<select id="material-subject"><option>Mathematik</option><option>Deutsch</option><option>Biologie</option><option>Englisch</option></select></label><p id="field-error" role="alert" style="font-size:13px;color:#aa452c;margin-top:10px"></p><button class="primary" data-save>${icon('folder')}In Ablage speichern</button><button class="secondary" data-route="camera">Neu aufnehmen</button>`}
function material(){title('Ablage',state.materials.length?`${state.materials.length} ${state.materials.length===1?'Blatt':'Blätter'} gespeichert`:'Deine Arbeitsblätter',null,true);return `${state.materials.length?state.materials.map((m,i)=>`<button class="material-row" data-material="${i}"><span class="mini-paper">${icon('paper')}</span><span><strong>${escapeHTML(m.title)}</strong><p>${escapeHTML(m.subject)} · 12. Oktober</p></span>${icon('chevron','chevron')}</button>`).join(''):`<div class="empty">${icon('folder')}<h3>Noch keine Blätter</h3><p>Fotografiere ein Arbeitsblatt.<br>Hier findest du es wieder.</p></div>`}<button class="primary" data-route="camera">${icon('camera')}Blatt aufnehmen</button>`}
function materialDetail(){const m=state.materials[state.materialIndex];title('Arbeitsblatt',escapeHTML(m.subject),'material');return `<div class="review-paper" style="height:260px">${paper()}</div><div class="section-head"><h3>${escapeHTML(m.title)}</h3></div><p class="muted" style="font-size:13px">Aufgenommen am 12. Oktober · 1 Seite</p><div class="section-head"><h3>Abschrift</h3></div><p class="detail-intro" style="font-size:14px">Quadratische Funktionen. Die Scheitelpunktform: f(x) = a(x − d)² + e. Lies den Scheitelpunkt ab, zeichne die Parabel und beschreibe ihre Öffnung.</p>`}
function subject(){title('Mathematik','Fach & Noten','home');return `<p class="detail-intro">Deine bisherigen Noten</p><div class="grades"><span class="grade">2</span><span class="grade">3+</span><span class="grade">2−</span></div><p class="muted" style="font-size:13px;margin:5px 0 27px">3 eingetragene Noten</p><button class="plain-row" data-route="exam">${icon('calendar')}Klausur am 16. Oktober${icon('chevron','chevron')}</button><button class="plain-row" data-route="tasks">${icon('checklist')}Hausaufgaben${icon('chevron','chevron')}</button><button class="plain-row" data-route="material">${icon('folder')}Arbeitsblätter${icon('chevron','chevron')}</button>`}
function quiz(){title('Wissen abrufen','Mathematik · Beispielkarte','study');return `<p class="flash-question">Wo liegt der Scheitelpunkt von<br>f(x) = (x − 3)² + 2?</p>${state.answer?'<div class="answer" tabindex="-1">S(3 | 2)<p style="font-size:14px;margin-top:12px">In der Scheitelpunktform f(x) = a(x − d)² + e liest du S(d | e) ab.</p></div><button class="primary" data-route="study">Zurück zum Lernblock</button>':'<button class="primary" data-answer>Antwort zeigen</button>'}`}
const screens={home,tasks:taskScreen,week,exam,study,camera,review,material,subject,quiz,materialDetail};
function render(){view.innerHTML=screens[state.route]();const active=['camera','review','materialDetail'].includes(state.route)?'material':['exam','study','subject','quiz'].includes(state.route)?'home':state.route;$$('.nav-button').forEach(b=>{if(b.dataset.route===active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#map-task-count').textContent=state.done.slice(0,2).filter(v=>!v).length;updateViewport()}
function navigate(route){const old=state.route;state.route=route;if(route==='quiz')state.answer=false;render();view.scrollTop=0;setHeight(2);if(viewAnimation)viewAnimation.cancel();if(!reduced.matches&&!keyboard&&old!==route)viewAnimation=view.animate([{opacity:0,transform:`translateX(${route==='home'?-10:12}px)`},{opacity:1,transform:'translateX(0)'}],{duration:200,easing:'cubic-bezier(.23,1,.32,1)'});head.querySelector('h2').focus({preventScroll:true})}
function hideToast(){const toast=$('#toast');if(toast.contains(document.activeElement))head.querySelector('h2').focus({preventScroll:true});toast.inert=true;toast.classList.remove('show')}
function notify(text,undo){$('#toast').inert=false;clearTimeout(toastTimer);undoAction=undo||null;$('#toast').innerHTML=`${icon('check')}<span>${text}</span>${undo?'<button data-undo>Rückgängig</button>':''}`;$('#toast').classList.add('show');toastTimer=setTimeout(hideToast,4200)}
function toggleTask(i){state.done[i]=!state.done[i];save();$$(`[data-task-row="${i}"]`).forEach(row=>{row.classList.toggle('done',state.done[i]);row.querySelector('button').setAttribute('aria-checked',String(state.done[i]))});$('#map-task-count').textContent=state.done.slice(0,2).filter(v=>!v).length;const n=state.done.slice(0,2).filter(v=>!v).length;if($('#remaining-count'))$('#remaining-count').textContent=n?`${n} Aufgaben noch offen`:'Alles für morgen erledigt';if(state.done[i]){if(!reduced.matches&&!keyboard)$(`[data-task="${i}"] .check-circle`).animate([{transform:'scale(.88)'},{transform:'scale(1.1)',offset:.55},{transform:'scale(1)'}],{duration:220,easing:'cubic-bezier(.23,1,.32,1)'});notify('Aufgabe erledigt',()=>{state.done[i]=false;save();render()})}}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.route)navigate(b.dataset.route);else if(b.hasAttribute('data-task'))toggleTask(+b.dataset.task);else if(b.hasAttribute('data-cycle'))setHeight((level+1)%3);else if(b.hasAttribute('data-day')){state.day=+b.dataset.day;render();$(`[data-day="${state.day}"]`).focus({preventScroll:true})}else if(b.hasAttribute('data-study')){state.studied=!state.studied;save();render();$('[data-study]').focus({preventScroll:true});notify(state.studied?'Lernblock erledigt':'Lernblock wieder offen')}else if(b.hasAttribute('data-answer')){state.answer=true;render();$('.answer').focus({preventScroll:true})}else if(b.hasAttribute('data-save')){const title=$('#material-title').value.trim();if(!title){$('#field-error').textContent='Gib dem Blatt einen Titel.';$('#material-title').focus();return}state.materials.push({title,subject:$('#material-subject').value});save();navigate('material');notify('Blatt in Ablage gespeichert')}else if(b.hasAttribute('data-material')){state.materialIndex=+b.dataset.material;navigate('materialDetail')}else if(b.hasAttribute('data-undo')){if(undoAction)undoAction();hideToast();head.querySelector('h2').focus({preventScroll:true});undoAction=null}});
document.addEventListener('keydown',e=>{keyboard=true;if(e.key==='Escape'){if(state.route!=='home')navigate('home');else setHeight(Math.max(0,level-1))}if(e.target===handle&&['ArrowUp','ArrowDown','Home','End'].includes(e.key)){e.preventDefault();setHeight(e.key==='Home'?2:e.key==='End'?0:level+(e.key==='ArrowUp'?1:-1),true)}if(e.target.matches('[data-day]')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();state.day=(state.day+(e.key==='ArrowRight'?1:4))%5;render();$(`[data-day="${state.day}"]`).focus()}});
document.addEventListener('pointerdown',()=>keyboard=false,{passive:true});
let suppressClick=false;
function startDrag(e){if(e.button!==0||!e.isPrimary||e.target.closest('button')!==handle&&e.target.closest('button'))return;cancelAnimationFrame(frame);frame=0;const el=e.currentTarget;el.setPointerCapture(e.pointerId);drag={pointer:e.pointerId,start:e.clientY,origin:y,history:[{p:e.clientY,t:e.timeStamp}],el};velocity=0}
function moveDrag(e){if(!drag||e.pointerId!==drag.pointer)return;const delta=e.clientY-drag.start;let next=drag.origin+delta;const min=snaps[2],max=snaps[0];if(next<min)next=min+(next-min)*.18;if(next>max)next=max+(next-max)*.18;y=next;paint();drag.history.push({p:e.clientY,t:e.timeStamp});drag.history=drag.history.filter(p=>e.timeStamp-p.t<100);if(Math.abs(delta)>6)suppressClick=true}
function endDrag(e){if(!drag||e.pointerId!==drag.pointer)return;const first=drag.history[0],last=drag.history.at(-1);velocity=e.type==='pointercancel'||e.timeStamp-last.t>100?0:(last.p-first.p)/Math.max(last.t-first.t,1)*1000;const projected=y+velocity*.18;const nearest=snaps.reduce((a,b,i)=>Math.abs(b-projected)<Math.abs(snaps[a]-projected)?i:a,0);drag=null;setHeight(nearest);setTimeout(()=>suppressClick=false,0)}
[handle,head].forEach(el=>{el.addEventListener('pointerdown',startDrag);el.addEventListener('pointermove',moveDrag);el.addEventListener('pointerup',endDrag);el.addEventListener('pointercancel',endDrag)});
handle.addEventListener('click',()=>{if(!suppressClick)setHeight((level+1)%3)});
new ResizeObserver(()=>{H=app.clientHeight;snaps=[H-193,Math.round(H*.39),Math.max(54,parseFloat(getComputedStyle($('.status')).height))];setHeight(level,true)}).observe(app);
render();paint();
</script>
