<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F1F0EB">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151514">
<meta name="color-scheme" content="light dark">
<title>Schulapp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..800;1,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..600,0..1,0&display=block">
<style>
:root{
  --bg:#F1F0EB; --raise:#E6E4DD; --raise-2:#DAD8D0; --sheet:#F9F8F5;
  --line:rgba(26,25,23,.12); --line-strong:rgba(26,25,23,.22);
  --ink:#1A1917; --ink-2:#55534D; --ink-3:#6E6B64;
  --accent:#2A44C0; --on-accent:#FFFFFF;
  --dock:#1A1917; --dock-edge:transparent; --dock-text:#F1F0EB; --dock-muted:#B5B2AA; --dock-line:#46433C; --toast:#2B2925;
  --mark:#FFDD4A; --error:#B3261E; --scrim:rgba(20,19,17,.18); --camera:#0B0B0C;
  --menu-shadow:0 -1px 0 rgba(20,19,17,.06),0 24px 60px -12px rgba(20,19,17,.28);
  --table:#2439A6; --t-on:#F4F6FF; --t-fill:rgba(244,246,255,.10); --t-fill-2:rgba(244,246,255,.18);
  --card:#F9F8F5; --card-ink:#12183A; --card-ink-2:#5A6185; --known:#F9F8F5; --known-ink:#12183A;
  --paper:#F9F8F5;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --ease-io:cubic-bezier(0.77,0,0.175,1);
  --ease-grow:cubic-bezier(0.6,0,0.2,1);
  --ease-flip:cubic-bezier(0.2,0.8,0.2,1);
  --pad:22px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:max(16px,env(safe-area-inset-bottom,0px));
  --top:calc(var(--safe-t) + 8px);
  --head:calc(var(--top) + 36px + 44px);
  --foot-space:calc(52px + var(--safe-b) + 24px);
  --sans:"Schibsted Grotesk",system-ui,sans-serif;
  --serif:"Newsreader",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151514; --raise:#222220; --raise-2:#2C2C29; --sheet:#1C1C1A;
    --line:rgba(236,232,222,.12); --line-strong:rgba(236,232,222,.22);
    --ink:#ECE8DE; --ink-2:#BDB7AA; --ink-3:#9A9488;
    --accent:#7F9BE8; --on-accent:#0E1120;
    --dock:#0D0D0C; --dock-edge:rgba(236,232,222,.14); --dock-text:#ECE8DE; --dock-muted:#8E897E; --dock-line:#34342F; --toast:#2B2B28;
    --error:#F2B8B5; --scrim:rgba(0,0,0,.5); --menu-shadow:0 0 0 1px rgba(236,232,222,.08),0 24px 60px -12px rgba(0,0,0,.6);
    --table:#121A4E; --card:#1A1F3D; --card-ink:#F4F6FF; --card-ink-2:#AAB1C9; --known:#EEF0F7; --known-ink:#12183A;
    --paper:#ECE9E0;
  }
}
:root[data-theme="dark"]{
  --bg:#151514; --raise:#222220; --raise-2:#2C2C29; --sheet:#1C1C1A;
  --line:rgba(236,232,222,.12); --line-strong:rgba(236,232,222,.22);
  --ink:#ECE8DE; --ink-2:#BDB7AA; --ink-3:#9A9488;
  --accent:#7F9BE8; --on-accent:#0E1120;
  --dock:#0D0D0C; --dock-edge:rgba(236,232,222,.14); --dock-text:#ECE8DE; --dock-muted:#8E897E; --dock-line:#34342F; --toast:#2B2B28;
  --error:#F2B8B5; --scrim:rgba(0,0,0,.5); --menu-shadow:0 0 0 1px rgba(236,232,222,.08),0 24px 60px -12px rgba(0,0,0,.6);
  --table:#121A4E; --card:#1A1F3D; --card-ink:#F4F6FF; --card-ink-2:#AAB1C9; --known:#EEF0F7; --known-ink:#12183A;
  --paper:#ECE9E0;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--bg)}
body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;font-weight:450;
  font-synthesis:none;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;
  text-transform:none;white-space:nowrap;display:inline-block;direction:ltr;flex:none;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";user-select:none}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
.c{font-variant-numeric:proportional-nums}
time,.t-clock,.lbbtn,.t-count,.grade-row b,.grades b,.dpill,.day > span,.pstack .n,.ppause,.tn{font-variant-numeric:tabular-nums}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Hülle: über 600px bleibt die Spalte 390px breit */
#app{position:fixed;inset:0;margin:0 auto;max-width:100%;overflow:hidden;isolation:isolate;background:var(--bg)}
@media (min-width:600px){#app{max-width:390px;box-shadow:0 0 0 1px var(--line)}}
.pre .enter{opacity:0}

/* ---------- Ablauf ---------- */
.flow{position:absolute;inset:0;background:var(--bg);transform-origin:50% 40%}
.plate{position:absolute;z-index:5;left:0;right:0;top:0;height:var(--head);background:var(--bg);pointer-events:none}
.kopf{position:absolute;z-index:6;left:var(--pad);right:var(--pad);top:var(--top);height:36px;display:flex;align-items:center;gap:6px;
  font-size:15px;line-height:1.3;font-weight:520;color:var(--ink)}
.kopf .ms{font-size:18px;color:var(--ink-3);margin-left:-2px}
.kopf:active{opacity:.6}
.band{position:absolute;z-index:6;left:var(--pad);right:var(--pad);top:calc(var(--top) + 36px);height:44px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.seg{display:flex;flex-direction:column;justify-content:flex-start;padding-top:8px;min-height:44px}
.seg-track{display:block;height:2px;border-radius:1px;background:var(--line);overflow:hidden}
.seg-fill{display:block;height:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform 300ms var(--ease-out)}
.seg-label{display:block;margin-top:8px;font-size:13px;line-height:1.2;font-weight:560;color:var(--ink-3);transition:opacity 200ms ease}
.seg.cur .seg-fill{transform:scaleX(1);background:var(--accent)}
.seg.cur .seg-label{color:var(--ink)}
.seg.done .seg-fill{transform:scaleX(1)}
.seg.done .seg-label{color:var(--ink-2)}
.seg.skip .seg-track{background:var(--line);opacity:.6}
.seg.skip .seg-label{color:var(--ink-3);opacity:.6}
.band-line{position:absolute;left:0;right:0;top:8px;height:2px;border-radius:1px;background:var(--accent);opacity:0;transform:scaleX(.98);
  transition:opacity 260ms ease,transform 300ms var(--ease-out);pointer-events:none}
.band.merged .band-line{opacity:1;transform:none;transition-delay:120ms}
.band.merged .seg-label{opacity:0}

.steps{position:absolute;inset:0}
.step{position:absolute;inset:0;background:var(--bg);visibility:hidden;will-change:transform}
.step.vis{visibility:visible}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;
  padding:calc(var(--head) + 18px) var(--pad) var(--foot-space)}
.scroll::-webkit-scrollbar{display:none}
h1.q{font-family:var(--serif);font-size:38px;line-height:1.04;font-weight:500;font-variation-settings:"opsz" 72;letter-spacing:-.018em;text-wrap:balance;margin-bottom:20px}
.label{font-size:14px;line-height:1.3;font-weight:620;color:var(--ink-2);margin:20px 0 6px}
.group{margin-top:28px}
.group:first-of-type{margin-top:0}
.group > .label{margin-top:0}
.empty{font-size:17px;color:var(--ink-2);padding:12px 0}

/* Fuß am Ende des Inhalts */
.foot{display:flex;gap:10px;align-items:center;margin-top:28px}
.btn{height:52px;border-radius:999px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:17px;line-height:1;font-weight:620;letter-spacing:-.005em;white-space:nowrap;transition:transform 140ms var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn.primary{flex:1;background:var(--ink);color:var(--bg);justify-content:space-between;padding:0 18px 0 20px}
.btn.primary .ms{font-size:20px}
.btn.quiet{background:var(--raise);color:var(--ink)}
.btn.quiet:active{background:var(--raise-2)}
.round{width:52px;height:52px;border-radius:999px;display:grid;place-items:center;flex:none;background:var(--raise);transition:transform 140ms var(--ease-out)}
.round:active{transform:scale(.92)}
.btn-label{display:inline-block;transition:opacity 160ms ease,transform 200ms var(--ease-out)}
.btn-label.swap{opacity:0;transform:translateY(6px)}
.textbtn{height:44px;padding:0 4px;font-size:16px;font-weight:560;color:var(--ink-2);display:inline-flex;align-items:center;transition:transform 140ms var(--ease-out)}
.textbtn:active{transform:scale(.96)}

/* Neu */
.subj{border-bottom:1px solid var(--line)}
.subj:last-child{border-bottom:0}
.subj-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:8px;min-height:72px;padding:6px 0}
.subj-name{min-width:0}
.subj-name b{display:block;font-size:18px;line-height:1.3;font-weight:620;letter-spacing:-.005em}
.subj-name span{display:block;font-size:14px;line-height:1.4;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subj-pills{display:flex;gap:0;margin-right:-10px}
.pill{height:44px;border-radius:999px;padding:0 10px 0 6px;display:inline-flex;align-items:center;gap:2px;background:transparent;color:var(--ink-2);
  font-size:15px;font-weight:560;transition:transform 140ms var(--ease-out)}
.pill .ms{font-size:20px;color:var(--ink-2)}
.pill:active{transform:scale(.96);background:var(--raise)}
.pill.icon{width:44px;padding:0;justify-content:center}
.pill.icon .ms{color:var(--ink)}
.items:empty{display:none}
.items{padding-bottom:10px}
.item{display:grid;grid-template-columns:36px 1fr;column-gap:8px;align-items:center;padding:8px 0;position:relative;isolation:isolate}
.item::before{content:"";position:absolute;inset:0 -10px;border-radius:12px;background:var(--mark);opacity:0;z-index:-1;pointer-events:none}
.item .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);justify-self:center}
.item p{font-size:17px;line-height:1.4}
.item p span{display:block;font-size:14px;color:var(--ink-2)}
.item.sheet-item{grid-template-columns:76px 1fr;column-gap:14px;align-items:start}
.thumb{width:76px;aspect-ratio:1/1.414;display:block;position:relative}
.thumb .pg{position:absolute;inset:0;border-radius:3px;background:#FBF9F4 center/cover no-repeat;transform:rotate(-2.2deg);
  box-shadow:0 1px 0 rgba(20,18,14,.06),0 8px 18px -10px rgba(20,18,14,.45)}
.thumb .pg.under{transform:rotate(3deg) translate(4px,-3px);background:#E6E2D7}
.sheet-st{padding-top:6px;min-width:0}
.st-t{font-size:17px;line-height:1.35;font-weight:560}
.st-s{font-size:14px;color:var(--ink-2);margin-top:2px}
.st-s.err{color:var(--error)}
.st-lead{font-size:14px;line-height:1.4;font-weight:450;color:var(--ink-2);margin-bottom:2px}
.retry{height:44px;display:inline-flex;align-items:center;padding:0;font-size:15px;font-weight:620;color:var(--error);transition:transform 140ms var(--ease-out)}
.retry:active{transform:scale(.96)}
.refile{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent)}
.refile.at-end{-webkit-mask-image:none;mask-image:none}
.refile::-webkit-scrollbar{display:none}
.fp{flex:none;height:44px;padding:0 14px;border-radius:999px;background:var(--raise);font-size:15px;font-weight:560;
  transition:transform 140ms var(--ease-out)}
.fp:active{transform:scale(.96)}
.fp[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Aufgabenzeile */
.task{position:relative;overflow:hidden;margin:0 -10px;isolation:isolate}
.group > .label{position:relative;z-index:4}
.task + .task::after{content:"";position:absolute;left:10px;right:10px;top:0;height:1px;background:var(--line);z-index:3}
.t-under{position:absolute;inset:0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;padding-left:22px;opacity:0;transition:opacity 200ms ease}
.t-under .ms{font-size:26px;transform:scale(.6);transition:transform 200ms var(--ease-out)}
.task.drag-r .t-under{opacity:1}
.task.past .t-under .ms{transform:scale(1)}
.t-acts{position:absolute;top:0;bottom:0;right:0;display:flex;opacity:0}
.task.drag-l .t-acts,.task.open-l .t-acts{opacity:1}
.t-acts button{width:88px;display:grid;place-items:center;font-size:15px;font-weight:620}
.t-acts .edit{background:var(--raise-2);color:var(--ink)}
.t-acts .del{background:var(--error);color:#fff}
.t-front{position:relative;z-index:2;display:grid;grid-template-columns:37px 1fr auto;column-gap:8px;align-items:center;min-height:60px;
  padding:6px 10px 6px 10px;background:var(--bg);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.t-front::before{content:"";position:absolute;inset:0;background:var(--mark);opacity:0;pointer-events:none;z-index:-1}
.check{width:48px;height:48px;display:grid;place-items:center;margin-left:-11px;position:relative}
.ring{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;position:relative;
  transition:transform 160ms var(--ease-out)}
.check:active .ring{transform:scale(.88)}
.cfill{position:absolute;inset:-2px;border-radius:50%;background:var(--accent);transform:scale(.4);opacity:0;display:grid;place-items:center;
  transition:transform 240ms var(--ease-out),opacity 140ms ease}
.cfill .ms{font-size:19px;color:var(--on-accent);font-variation-settings:"FILL" 1,"wght" 600,"GRAD" 0,"opsz" 24;opacity:0;transform:scale(.5) rotate(-12deg);
  transition:opacity 140ms ease 80ms,transform 240ms var(--ease-out) 80ms}
.task.done .ring{border-color:transparent}
.task.done .cfill{transform:none;opacity:1}
.task.done .cfill .ms{opacity:1;transform:none}
.t-text{min-width:0;padding:6px 0;position:relative}
.t-title{font-size:17px;line-height:1.4;font-weight:450;position:relative}
.t-title b{font-weight:680;margin-right:.4em}
.task.done .t-title{color:var(--ink-3)}
.t-sub{font-size:14px;color:var(--ink-2);margin-top:1px}
.strike{position:absolute;height:1.5px;background:currentColor;transform-origin:left center;pointer-events:none;color:var(--ink-3)}

/* Lernen */
.exam{border-left:1px solid var(--line-strong);padding-left:16px}
.exam-t{font-size:22px;line-height:1.2;font-weight:720;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:2px;min-height:44px}
.exam-t .ms{color:var(--ink-2);font-size:22px}
.exam-when{font-size:15px;color:var(--ink-2)}
.exam-topic{font-size:17px;margin-top:2px}
.plan{margin-top:16px;position:relative}
.prow{display:grid;grid-template-columns:52px 1fr;column-gap:12px;padding:7px 0;position:relative}
.prow + .prow{margin-top:14px}
.plan::before{content:"";position:absolute;left:25.25px;top:20px;bottom:20px;width:1.5px;background:var(--line-strong)}
.dpill{width:44px;height:26px;border-radius:13px;display:grid;place-items:center;font-size:13px;font-weight:620;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line-strong);justify-self:center;background:var(--bg)}
.prow.today .dpill{background:var(--accent);color:var(--on-accent);box-shadow:none}
.prow.exday .dpill{background:var(--ink);color:var(--bg);box-shadow:none}
.pbody b{display:block;font-size:17px;line-height:1.3;font-weight:560;padding-top:2px}
.pbody > span{display:block;font-size:14px;color:var(--ink-2)}
.pact{margin-top:10px;display:grid}
.pact > *{grid-area:1/1;justify-self:start}
.lbbtn{height:44px;border-radius:999px;padding:0 18px 0 14px;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;gap:6px;
  font-size:16px;font-weight:620;transition:transform 140ms var(--ease-out)}
.lbbtn:active{transform:scale(.96)}
.lbbtn .ms{font-size:20px}
.lbbtn .lbt{margin-left:4px;font-weight:560;opacity:.9}
.pdone{display:inline-flex;align-items:center;gap:6px;height:44px;font-size:16px;font-weight:620;color:var(--ink);visibility:hidden}
.pdone .ms{color:var(--accent)}
.prow.erledigt .lbbtn{visibility:hidden}
.prow.erledigt .pdone{visibility:visible}
.ppause{font-size:14px;color:var(--ink-2);margin-top:6px}
.ppause:empty{display:none}
.rowbtn{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;width:100%;min-height:56px;padding:8px 0;
  transition:opacity 140ms ease}
.rowbtn:active{opacity:.6}
.rowbtn .ms{color:var(--ink-3)}
.grades{font-size:17px}
.grades span{color:var(--ink-2)}
.grades{display:flex !important;align-items:center;justify-content:space-between}
.grades .gl{flex:1;color:var(--ink)}
.grades .gn{display:inline-flex;gap:14px;font-weight:620;margin-right:4px}
.cards-row{grid-template-columns:44px 1fr auto}
.ministack{position:relative;width:28px;height:36px;justify-self:start;margin-left:2px}
.ministack i{position:absolute;inset:0;border-radius:4px;background:var(--sheet);box-shadow:0 0 0 1px var(--line-strong);display:grid;place-items:center;
  font-style:normal;font-size:16px;line-height:1;font-weight:560;color:var(--ink-2)}
.ministack i:nth-child(1){transform:translate(6px,-4px) rotate(6deg);background:var(--raise-2)}
.ministack i:nth-child(2){transform:translate(3px,-2px) rotate(3deg);background:var(--raise)}
.cards-row p{font-size:17px;line-height:1.35;font-weight:560}
.cards-row p span{display:block;font-size:14px;font-weight:450;color:var(--ink-2)}
.after-exams{margin-top:22px}
.skip-row{margin-top:18px}

/* Fertig */
#fertigBody h1.q{font-size:44px;line-height:1.02;margin-top:30px;margin-bottom:22px}
.fz{list-style:none;margin-top:4px}
.fz li{font-size:20px;line-height:1.5;margin-bottom:2px}
.morgen{margin-top:40px}
.morgen-btn{display:inline-flex;align-items:center;gap:2px;min-height:44px;font-size:17px;font-weight:620}
.morgen-btn .ms{color:var(--ink-2)}
.morgen-f{font-size:17px;color:var(--ink-2);margin-bottom:6px}

/* ---------- Nachschlagen ---------- */
.page{position:absolute;inset:0;background:var(--bg);z-index:10;will-change:transform;touch-action:pan-y}
.page .scroll{padding-top:calc(var(--top) + 60px)}
.p-top{position:absolute;z-index:3;left:2px;right:var(--pad);top:var(--top);height:52px;display:flex;align-items:center;gap:8px}
.pback{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--ink);transition:transform 140ms var(--ease-out),opacity 140ms ease}
.pback .ms{font-size:24px}
.pback:active{transform:scale(.92);opacity:.6}
.p-top > span:not(.ms){font-size:15px;font-weight:520;color:var(--ink-2)}
.p-title{font-size:26px;line-height:1.15;font-weight:650;letter-spacing:-.015em;margin-bottom:6px}
.p-sub{font-size:15px;color:var(--ink-2);margin-bottom:8px}
.days{position:relative;display:grid;grid-template-columns:repeat(5,1fr);margin-top:14px;border-bottom:1px solid var(--line)}
.day{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);transition:none}
.day b{font-size:15px;font-weight:620}
.day span{font-size:13px}
.day[aria-pressed="true"]{color:var(--ink)}
.day-ind{position:absolute;left:0;bottom:-1px;width:20%;height:2px;background:var(--ink);transition:transform 300ms var(--ease-io)}
.lessons{margin-top:4px}
.lesson{display:grid;grid-template-columns:58px 1fr;column-gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.lesson:last-child,.lesson:has(+ :not(.lesson)){border-bottom:0}
.lesson time{font-size:15px;font-weight:560;line-height:1.35}
.lesson time .end{display:block;color:var(--ink-3);font-weight:450}
.lesson b{display:block;font-size:17px;font-weight:620;line-height:1.3}
.lesson em{display:block;font-style:normal;font-size:14px;color:var(--ink-2);margin-top:2px}
.lesson .tag{display:block;font-size:14px;font-weight:620;color:var(--accent);margin-top:4px}
.free{font-size:15px;color:var(--ink-2);padding:14px 0}
.seg2{display:inline-grid;grid-auto-flow:column;gap:4px;background:var(--raise);border-radius:999px;padding:4px;margin:6px 0 16px}
.seg2 button{height:40px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:560;color:var(--ink-2);transition:none}
.seg2 button[aria-pressed="true"]{background:var(--sheet);color:var(--ink)}
.abschrift{font-size:17px;line-height:1.55}
.abschrift p + p{margin-top:12px}
.abschrift h3{font-size:17px;font-weight:680;margin:18px 0 6px}
.formel,.f-in{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
.formel{font-family:var(--serif);font-style:italic;font-size:23px;line-height:1.3;font-weight:400;font-variation-settings:"opsz" 24;display:block;margin:10px 0}
.f-in{font-family:var(--serif);font-style:italic;font-weight:400;font-variation-settings:"opsz" 24;font-size:1.08em;white-space:nowrap}
.original{border-radius:3px;background:#FBF9F4 center/cover no-repeat;aspect-ratio:1/1.414;width:100%;box-shadow:0 1px 0 rgba(20,18,14,.06),0 8px 18px -10px rgba(20,18,14,.45)}
.lrow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;column-gap:12px;width:100%;min-height:64px;padding:10px 0;border-bottom:1px solid var(--line);transition:opacity 140ms ease}
.lrow:last-child,.lrow:has(+ :not(.lrow)){border-bottom:0}
.lrow:active{opacity:.6}
.lrow .mini{width:34px;aspect-ratio:1/1.414;border-radius:3px;background:#FBF9F4 center/cover no-repeat;transform:rotate(-1.5deg);box-shadow:0 1px 0 rgba(20,18,14,.06),0 6px 12px -8px rgba(20,18,14,.5);justify-self:start}
.lrow b{display:block;font-size:17px;font-weight:560;line-height:1.3}
.lrow span.s{display:block;font-size:14px;color:var(--ink-2)}
.lrow .ms{color:var(--ink-3)}
.grade-row{display:grid;grid-template-columns:56px 1fr;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.grade-row b{font-size:22px;font-weight:620}
.grade-row span{font-size:15px;color:var(--ink-2)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;border-bottom:1px solid var(--line);font-size:17px}

/* ---------- Zeile ---------- */
.zeile{position:fixed;z-index:40;left:0;right:0;bottom:var(--safe-b);margin:0 auto;max-width:100%;pointer-events:none}
/* deckende Fläche unter der Zeile: Inhalt endet an einer Kante 10px darüber, darunter ist nichts antippbar */
.zeile::before{content:"";position:absolute;left:0;right:0;bottom:calc(-1 * var(--safe-b));height:calc(52px + var(--safe-b) + 10px);background:var(--bg);pointer-events:auto}
.zeile.hide::before,.zeile.menu-on::before{visibility:hidden}
@media (min-width:600px){.zeile{max-width:390px}}
.dock{pointer-events:auto;position:relative;z-index:3;margin:0 16px;height:52px;border-radius:26px;background:var(--dock);color:var(--dock-text);
  display:flex;align-items:center;padding:4px;box-shadow:0 0 0 1px var(--dock-edge),0 1px 2px rgba(20,18,14,.06),0 10px 26px -14px rgba(20,18,14,.28)}
.dock .lupe{width:40px;display:grid;place-items:center;color:var(--dock-muted);flex:none}
.dock.ctx .lupe{color:var(--dock-text)}
.dock input{flex:1;min-width:0;height:44px;border:0;outline:none;background:transparent;color:var(--dock-text);font-size:17px;line-height:1.3;font-weight:450;caret-color:var(--dock-text)}
.dock input::placeholder{color:var(--dock-muted)}
.send{position:relative;height:36px;border-radius:18px;padding:0 14px;display:inline-flex;align-items:center;background:var(--dock-line);color:var(--dock-text);
  font-size:15px;line-height:1;font-weight:620;flex:none;margin-right:8px;white-space:nowrap;
  opacity:0;transform:scale(.9);pointer-events:none;transition:opacity 160ms ease,transform 200ms var(--ease-out)}
.send::before{content:"";position:absolute;inset:-4px -4px}
.send.on{opacity:1;transform:none;pointer-events:auto}
.send:active{transform:scale(.96)}
.dsep{width:1px;height:28px;background:var(--dock-line);flex:none}
.camb{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--dock-text);flex:none;transition:transform 140ms var(--ease-out)}
.camb:active{transform:scale(.92)}
.zeile.hide .dock{visibility:hidden}

.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity 200ms ease}
.scrim.on{opacity:1;pointer-events:auto}

/* das Menü reicht bis an den unteren Rand: unter der Zeile schaut kein Inhalt hervor */
.menu{pointer-events:auto;position:absolute;z-index:2;left:0;right:0;bottom:calc(-1 * var(--safe-b));border-radius:24px 24px 0 0;background:var(--sheet);color:var(--ink);
  box-shadow:var(--menu-shadow);display:flex;flex-direction:column;padding:0 0 calc(52px + var(--safe-b) + 8px);visibility:hidden}
.menu.open{visibility:visible}
.m-grab{height:22px;display:grid;place-items:center;touch-action:none;flex:none;cursor:grab}
.m-grab i{display:none}
.m-scroll{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:6px 6px 0}
.m-scroll::-webkit-scrollbar{display:none}
.m-scroll{display:flex;flex-direction:column}
.m-layer:not(.off){margin-top:auto}
.mcheck.on .ring{border-color:transparent}
.mcheck.on .cfill{transform:none;opacity:1}
.mcheck.on .cfill .ms{opacity:1;transform:none}
.m-layer{transition:opacity 180ms var(--ease-out),transform 180ms var(--ease-out)}
.m-layer.off{position:absolute;left:6px;right:6px;bottom:0;opacity:0;transform:translateY(6px);pointer-events:none;visibility:hidden}
.m-hits{display:flex;flex-direction:column-reverse}
.m-group{padding-bottom:4px}
.m-gl{font-size:14px;font-weight:620;color:var(--ink-2);padding:12px 10px 4px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center;min-height:52px;padding:6px 10px;border-radius:12px;cursor:pointer;
  transition:none}
.opt.has-ic{grid-template-columns:30px minmax(0,1fr) auto}
.opt > div{min-width:0}
.opt .mini{width:22px;height:31px;border-radius:2px;background:#FBF9F4 center/cover no-repeat;box-shadow:0 0 0 1px var(--line-strong);justify-self:center;transform:rotate(-1.5deg)}
.opt .mcheck{width:44px;height:44px;margin:-7px;display:grid;place-items:center}
.opt .mcheck .ring{width:22px;height:22px}
.opt:not(.first) .o1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 0 6px}
.opt.cell{min-height:44px;padding:0 10px}
.opt.cell .o1{font-size:16px;font-weight:560}
.opt[aria-selected="true"]{background:var(--line)}
.opt > .ms{color:var(--ink-2);justify-self:center}
.o1{font-size:16px;line-height:1.3;font-weight:560;color:var(--ink)}
.o2{font-size:14px;line-height:1.35;color:var(--ink-2);margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.opt .hl{color:var(--ink);font-weight:620}
.opt .dim{color:var(--ink-2)}
.opt.first .o1{font-weight:620}
.o-end{display:flex;align-items:center}
.ans{padding:2px 10px 6px}
.menu .t-front{background:var(--sheet)}
.ans .lesson{padding:10px 0;grid-template-columns:52px 1fr}
.ans .lesson time{font-size:14px}
.ans .lesson b{font-size:16px}
.ans .grade-row{padding:8px 0}
.kuerzel{font-size:14px;color:var(--ink-2);padding:10px 10px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-fach{display:flex;flex-wrap:wrap;gap:8px;padding:6px 14px 2px;flex:none}
.m-fach .fp{height:40px;position:relative}
.m-fach .fp::after{content:"";position:absolute;inset:-2px 0}
.m-fach::-webkit-scrollbar{display:none}
.m-fach:empty{display:none}
.m-tokens{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:8px 14px 0;min-height:42px;flex:none;align-items:center;
  -webkit-mask-image:linear-gradient(to left,transparent,#000 24px);mask-image:linear-gradient(to left,transparent,#000 24px)}
.m-tokens::-webkit-scrollbar{display:none}
.m-tokens:empty{min-height:8px;padding:0}
.tok{flex:none;height:32px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;font-size:13.5px;line-height:1;font-weight:560;
  background:var(--line);color:var(--ink);transition:transform 140ms var(--ease-out)}
.tok .ms{font-size:18px}
.tok.int{background:var(--ink);color:var(--bg)}
.tok.int.suchen{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.tok.want{background:transparent;color:var(--ink-2);border:1.5px dashed var(--line-strong)}
.tok:active{transform:scale(.96)}

.toast{position:fixed;z-index:66;left:calc(50% - min(50vw,195px) + 16px);bottom:80px;max-width:calc(min(100vw,390px) - 32px);height:44px;border-radius:22px;
  background:var(--toast);color:var(--dock-text);display:flex;align-items:center;justify-content:flex-start;gap:2px;padding:0 4px 0 18px;
  font-size:15px;font-weight:560;opacity:0;transform:translateY(14px);pointer-events:none;transition:transform 260ms var(--ease-out),opacity 200ms var(--ease-out)}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{flex:none;height:44px;padding:0 14px 0 8px;border-radius:999px;font-weight:620;color:var(--dock-text);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px;transition:transform 140ms var(--ease-out)}
body.toast-on .flow .scroll,body.toast-on .page .scroll{padding-bottom:calc(var(--foot-space) + 52px)}
.toast button:active{transform:scale(.96)}

/* ---------- Sheet (Material) ---------- */
.sheet{position:fixed;z-index:72;left:0;right:0;bottom:0;margin:0 auto;max-width:390px;max-height:86dvh;display:flex;flex-direction:column;
  background:var(--sheet);color:var(--ink);border-radius:28px 28px 0 0;transform:translateY(105%);visibility:hidden}
.sheet.open{visibility:visible}
.sheet .grab{height:28px;display:grid;place-items:center;touch-action:none;flex:none;cursor:grab}
.sheet .grab i{width:38px;height:5px;border-radius:3px;background:var(--line-strong)}
.sheet .sh-body{overflow-y:auto;overscroll-behavior:contain;padding:4px var(--pad) calc(var(--safe-b) + 16px)}
.sheet-scrim{z-index:71}

/* ---------- Kamera ---------- */
.cam{position:fixed;inset:0;z-index:60;margin:0 auto;max-width:390px;background:var(--camera);color:#F2F0EA;display:none;flex-direction:column}
.cam.open{display:flex}
.cam-top{height:calc(var(--top) + 52px);padding:var(--top) 12px 0;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;flex:none;position:relative;z-index:3}
.cbtn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,.12);transition:transform 140ms var(--ease-out)}
.cbtn:active{transform:scale(.92)}
.cam-chip{justify-self:center;height:44px;padding:0 10px 0 16px;border-radius:999px;background:rgba(255,255,255,.12);display:inline-flex;align-items:center;gap:2px;
  font-size:15px;font-weight:560;transition:transform 140ms var(--ease-out)}
.cam-chip:active{transform:scale(.96)}
.cam-chip .ms{font-size:20px;transition:transform 200ms var(--ease-out)}
.cam-chip[aria-expanded="true"] .ms{transform:rotate(180deg)}
.cam-menu{position:absolute;z-index:4;top:calc(var(--top) + 58px);left:50%;width:232px;margin-left:-116px;max-height:60dvh;overflow-y:auto;background:#1F1E1B;border-radius:18px;padding:6px;
  transform-origin:50% 0;opacity:0;transform:scale(.96) translateY(-4px);pointer-events:none;transition:opacity 160ms ease,transform 200ms var(--ease-out)}
.cam-menu.open{opacity:1;transform:none;pointer-events:auto}
.cam-menu button{display:flex;width:100%;height:44px;align-items:center;justify-content:space-between;padding:0 12px;border-radius:12px;font-size:16px}
.cam-menu button:active{background:rgba(255,255,255,.08)}
.cam-menu button .ms{font-size:20px;opacity:0}
.cam-menu button[aria-selected="true"] .ms{opacity:1}
.finder{position:relative;flex:1;min-height:0;margin:8px 23px 0;border-radius:3px;overflow:hidden;background:#151513}
.finder video,.finder canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.finder canvas{visibility:hidden}
.finder.frozen canvas{visibility:visible}
.f-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;font-size:16px;color:#C9C5BB;padding:24px}
.f-msg .btn{background:#F2F0EA;color:#0B0B0C;height:48px;font-size:16px}
.corner{position:absolute;width:23px;height:23px;border:0 solid #FBF9F4;pointer-events:none}
.corner.tl{left:0;top:0;border-top-width:2px;border-left-width:2px}
.corner.tr{right:0;top:0;border-top-width:2px;border-right-width:2px}
.corner.bl{left:0;bottom:0;border-bottom-width:2px;border-left-width:2px}
.corner.br{right:0;bottom:0;border-bottom-width:2px;border-right-width:2px}
.cflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam-bottom{flex:none;height:132px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px}
.shutter{width:78px;height:78px;border-radius:50%;border:2px solid #F2F0EA;display:grid;place-items:center}
.shutter i{width:64px;height:64px;border-radius:50%;background:#F2F0EA;transition:transform 140ms var(--ease-out)}
.shutter:active i{transform:scale(.92)}
.shutter:disabled{opacity:.35}
.pstack{justify-self:start;position:relative;width:48px;height:64px;visibility:hidden;transition:transform 140ms var(--ease-out)}
.pstack:active{transform:scale(.94)}
.shutter.off{opacity:.35}
.cam-sheet{position:absolute;z-index:6;left:0;right:0;bottom:0;max-height:80%;overflow-y:auto;background:#1F1E1B;border-radius:28px 28px 0 0;padding:8px 16px calc(var(--safe-b) + 12px);
  transform:translateY(105%);visibility:hidden}
.cam-sheet.open{visibility:visible}
.cs-head{display:flex;align-items:center;justify-content:space-between;min-height:52px;font-size:17px;font-weight:620}
.cs-head button{height:44px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.12);font-size:16px;font-weight:620}
.cs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.cs-grid figure{display:flex;flex-direction:column;align-items:center;gap:4px}
.cs-grid .pg{width:100%;aspect-ratio:1/1.414;border-radius:3px;background:#E6E2D7 center/cover no-repeat}
.cs-grid button{height:44px;font-size:15px;font-weight:560;color:#F2B8B5}
.pstack.on{visibility:visible}
.pstack .pg{position:absolute;inset:0;border-radius:3px;background:#E6E2D7 center/cover no-repeat}
.pstack .pg.u{transform:translate(5px,-5px) rotate(5deg);background:#C9C4B8;opacity:0}
.pstack.multi .pg.u{opacity:1}
.pstack .n{position:absolute;right:-10px;top:-10px;min-width:24px;height:24px;border-radius:12px;padding:0 6px;background:#F2F0EA;color:#0B0B0C;font-size:13px;font-weight:620;line-height:24px;text-align:center}
.ablegen{justify-self:end;height:48px;padding:0 18px;border-radius:999px;background:#F2F0EA;color:#0B0B0C;font-size:16px;font-weight:620;visibility:hidden;transition:transform 140ms var(--ease-out)}
.ablegen.on{visibility:visible}
.ablegen:active{transform:scale(.96)}
.fotos{flex:none;align-self:center;height:44px;padding:0 14px;margin-bottom:calc(var(--safe-b) + 4px);font-size:15px;font-weight:560;color:#C9C5BB}
.fly-t{position:fixed;z-index:80;pointer-events:none;transform-origin:0 0}
.fly{position:fixed;z-index:80;pointer-events:none;border-radius:3px;background:#FBF9F4 center/cover no-repeat;transform-origin:0 0;box-shadow:0 8px 18px -10px rgba(20,18,14,.45)}

/* ---------- Lerntisch ---------- */
.tisch{position:fixed;inset:0;z-index:65;margin:0 auto;max-width:390px;display:none;color:var(--t-on);--rest:1}
.tisch.open{display:block}
.t-surface{position:absolute;inset:0;background:var(--table);transform-origin:0 0}
.t-body{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-bottom:calc(var(--safe-b) + 4px)}
.t-top{width:100%;height:calc(var(--top) + 52px);padding:var(--top) 12px 0;display:flex;align-items:center;justify-content:space-between;flex:none}
.tbtn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--t-fill);transition:transform 140ms var(--ease-out)}
.tbtn:active{transform:scale(.92)}
.t-clock{height:44px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:15px;line-height:1;font-weight:560;background:var(--t-fill)}
.t-clock .ms{font-size:18px}
.t-clock.paused{opacity:.7}
.t-rest{position:absolute;left:0;right:0;top:var(--safe-t);height:2px;background:var(--t-fill);overflow:hidden}
.t-rest i{display:block;height:100%;background:var(--t-on);transform-origin:left;transform:scaleX(1)}
.t-ticks{width:calc(100% - 44px);display:flex;gap:4px;margin-top:14px;flex:none}
.tick{flex:1;height:3px;border-radius:2px;background:var(--t-fill-2);overflow:hidden}
.tick i{display:block;height:100%;background:var(--t-on);transform:scaleX(0);transform-origin:left;transition:transform 300ms var(--ease-out)}
.tick.past i{transform:scaleX(1)}
.t-count{width:calc(100% - 44px);font-size:14px;font-weight:560;color:var(--t-on);opacity:.8;margin-top:8px;flex:none}
.t-stack{position:relative;margin-top:auto;flex:none;width:min(336px,calc(100vw - 40px),(100dvh - 300px) * .75);aspect-ratio:3/4;container-type:inline-size}
.sc{position:absolute;inset:0;z-index:3;transform-origin:50% 100%;touch-action:none;will-change:transform;
  transition:transform 320ms var(--ease-out),opacity 200ms ease}
.sc[data-pos="out"]{z-index:5;pointer-events:none}
.sc[data-pos="1"]{z-index:2;transform:translateY(14px) scale(.95);pointer-events:none}
.sc[data-pos="2"]{z-index:1;transform:translateY(28px) scale(.9);opacity:.7;pointer-events:none}
.sc[data-pos="3"]{z-index:0;transform:translateY(36px) scale(.86);opacity:0;pointer-events:none}
.sc[data-pos="2"] .face > *,.sc[data-pos="3"] .face > *{opacity:0}
.sc-lift{position:absolute;inset:0;perspective:1400px}
.sc-flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 320ms var(--ease-flip)}
.sc.flipped .sc-flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;background:var(--card);color:var(--card-ink);padding:22px 22px 18px;display:flex;flex-direction:column;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 40px -12px rgba(0,0,0,.42)}
.face.back{transform:rotateY(180deg)}
.c-head{display:flex;justify-content:space-between;font-size:13px;line-height:1;font-weight:600;color:var(--card-ink-2)}
.c-q{margin:auto 0;overflow-wrap:break-word;font-family:var(--serif);font-size:min(27px,9.6cqi);line-height:1.2;font-weight:500;font-variation-settings:"opsz" 72;letter-spacing:-.01em;text-wrap:balance}
@container (max-width: 300px){ .c-q{hyphens:auto;-webkit-hyphens:auto} }
.c-a{margin-top:auto;font-size:25px;line-height:1.25;font-weight:620;letter-spacing:-.015em;text-wrap:balance}
.c-a .f-in{font-size:27px;font-weight:400}
.c-note{margin:12px 0 auto;font-size:16px;line-height:1.4;color:var(--card-ink-2);text-wrap:pretty}
.stamp{position:absolute;top:20px;z-index:2;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none}
.stamp.l{right:18px;background:var(--card-ink);color:var(--card)}
.stamp.r{left:18px;background:var(--table);color:#F4F6FF}
.t-hint{font-size:14px;font-weight:560;margin-top:38px;height:20px;opacity:0;transition:opacity 200ms ease;flex:none}
.t-hint.on{opacity:1}
.t-foot{position:relative;width:calc(100% - 32px);height:64px;margin-top:6px;flex:none}
.t-foot > div{position:absolute;inset:0;display:flex;gap:10px}

<script>
'use strict';
(() => {
/* ================= Werkzeuge ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const RMQ = matchMedia('(prefers-reduced-motion: reduce)');
const reduce = () => RMQ.matches;
const E = {
  out: 'cubic-bezier(0.23,1,0.32,1)', drawer: 'cubic-bezier(0.32,0.72,0,1)', io: 'cubic-bezier(0.77,0,0.175,1)',
  grow: 'cubic-bezier(0.6,0,0.2,1)', flip: 'cubic-bezier(0.2,0.8,0.2,1)'
};
/* Feder spring(520, 42) als linear()-Kurve, in 1/120-Sekunden-Schritten vorberechnet */
function spring(k, c) {
  let x = 0, v = 0; const dt = 1 / 120, pts = [];
  for (let i = 0; i < 360; i++) {
    const f = -k * (x - 1) - c * v; v += f * dt; x += v * dt; pts.push(x);
    if (i > 10 && Math.abs(1 - x) < 0.002 && Math.abs(v) < 0.02) break;
  }
  pts[pts.length - 1] = 1;
  return { easing: `linear(0, ${pts.map(p => p.toFixed(4)).join(', ')})`, duration: Math.round(pts.length * dt * 1000) };
}
const SPRING = spring(520, 42);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
/* Ziffern gleich breit, ":" und "." proportional */
const tn = s => esc(s).replace(/[:.]/g, m => `<span class="c">${m}</span>`);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'html') el.innerHTML = v;
    else if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
function norm(s) {
  return String(s).toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .normalize('NFD').replace(/\p{M}/gu, '');
}
const ZAHL = ['null', 'eins', 'zwei', 'drei', 'vier', 'fünf', 'sechs', 'sieben', 'acht', 'neun', 'zehn', 'elf', 'zwölf'];
function zahl(n, g) { /* g: 'f' eine, 'n' ein */
  if (n === 1) return g === 'n' ? 'ein' : 'eine';
  return n <= 12 ? ZAHL[n] : String(n);
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) { } };
const raf2 = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ================= Zeit (Uhr des Servers) =================
   Im Entwurf steht die Uhr des Servers auf dem Beispiel, Montag 12.10.2026, 16:40, und läuft von dort weiter.
   ?jetzt=2026-10-16T16:40 stellt sie auf einen anderen Zeitpunkt. */
const QS = new URLSearchParams(location.search);
/* Der Stand des Servers liegt im Entwurf außerhalb des UI-Codes in sessionStorage['server'].
   Die UI liest ihn nur beim Start, so wie sie im Bau die Antwort des Servers liest. ?reset leert ihn. */
const STORE = 'server';
if (QS.has('reset')) { try { sessionStorage.removeItem(STORE); } catch (e) { } }
const JP = (() => { const p = QS.get('jetzt'); return p && !isNaN(Date.parse(p)) ? p : null; })();
let SAVED = null;
try { SAVED = JSON.parse(sessionStorage.getItem(STORE) || 'null'); } catch (e) { }
if (SAVED && (SAVED.jp || null) !== JP) SAVED = null;
const START = SAVED ? SAVED.serverNow + Math.max(0, Date.now() - SAVED.realNow) : (JP ? new Date(JP) : new Date(2026, 9, 12, 16, 40)).getTime();
const T0 = Date.now();
const jetzt = () => new Date(START + (Date.now() - T0));
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const D = s => new Date(s + 'T12:00:00');
const heute = () => iso(jetzt());
const addDays = (s, n) => { const d = D(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const TAG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const TK = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const wd = s => D(s).getDay();
const dm = s => { const d = D(s); return `${d.getDate()}.${d.getMonth() + 1}.`; };
const kurz = s => `${TK[wd(s)]} ${dm(s)}`;
const lang = s => `${TAG[wd(s)]}, ${dm(s)}`;

/* ================= Daten, wie sie der Server liefert ================= */
const FAECHER = [
  { id: 'de', name: 'Deutsch', kurz: 'Deutsch', alias: ['deutsch'], k2: 'de' },
  { id: 'ma', name: 'Mathematik', kurz: 'Mathe', alias: ['mathe', 'mathematik'], k2: 'ma' },
  { id: 'bi', name: 'Biologie', kurz: 'Bio', alias: ['bio', 'biologie'], k2: 'bi' },
  { id: 'en', name: 'Englisch', kurz: 'Englisch', alias: ['englisch', 'english'], k2: 'en' },
  { id: 'ge', name: 'Geschichte', kurz: 'Geschichte', alias: ['geschichte'], k2: 'ge' },
  { id: 'ph', name: 'Physik', kurz: 'Physik', alias: ['physik'], k2: 'ph' },
  { id: 'ch', name: 'Chemie', kurz: 'Chemie', alias: ['chemie'], k2: 'ch' },
  { id: 'ku', name: 'Kunst', kurz: 'Kunst', alias: ['kunst'] },
];
const F = id => FAECHER.find(f => f.id === id);
/* Stundenplan je Wochentag (1 = Montag) */
const PLAN = {
  1: [['08:00', '09:30', 'de', 'R. 104'], ['09:50', '11:20', 'ma', 'R. 208'], ['11:40', '13:10', 'bi', 'Bio 1']],
  2: [['08:00', '09:30', 'de', 'R. 104'], ['09:50', '11:20', 'ma', 'R. 208'], ['11:40', '13:10', 'en', 'R. 112']],
  3: [['08:00', '09:30', 'en', 'R. 112'], ['09:50', '11:20', 'ge', 'R. 015'], ['11:40', '13:10', 'ph', 'Ph 2']],
  4: [['08:00', '09:30', 'bi', 'Bio 1'], ['09:50', '11:20', 'ge', 'R. 015'], ['11:40', '13:10', 'ku', 'R. 301']],
  5: [['08:00', '09:30', 'ma', 'R. 208'], ['09:50', '11:20', 'de', 'R. 104'], ['11:40', '13:10', 'ph', 'Ph 2']],
};
const FERIEN = [{ von: '2026-10-26', bis: '2026-10-30' }];
const inFerien = s => FERIEN.find(f => s >= f.von && s <= f.bis) || null;
const isSchool = s => wd(s) >= 1 && wd(s) <= 5 && !inFerien(s);
const lessonsOn = s => isSchool(s) ? PLAN[wd(s)] : [];
function nextSchool(s) { let d = s; for (let i = 0; i < 60; i++) { d = addDays(d, 1); if (isSchool(d)) return d; } return addDays(s, 1); }
function nthSchool(s, n) { let d = s; for (let i = 0; i < n; i++) d = nextSchool(d); return d; }
function nextLesson(fid, s) {
  let d = s;
  for (let i = 0; i < 60; i++) { d = addDays(d, 1); if (lessonsOn(d).some(l => l[2] === fid)) return d; }
  return null;
}
/* "Morgen, Dienstag" nur wenn es wirklich morgen ist, sonst "Montag, 19.10." */
const dayHead = s => s === addDays(heute(), 1) ? `Morgen, ${TAG[wd(s)]}` : lang(s);
const weekdayOrDate = s => diffDays(heute(), s) <= 6 ? TAG[wd(s)] : lang(s);

const db = {
  aufgaben: [
    { id: 'a1', fach: 'ma', text: 'S. 84, Nr. 3–5', due: '2026-10-13', done: null },
    { id: 'a2', fach: 'de', text: 'Gedichtanalyse beenden', due: '2026-10-13', done: null },
    { id: 'a3', fach: 'en', text: 'Vokabeln Unit 3', due: '2026-10-12', done: new Date(2026, 9, 11, 19, 12).getTime() },
  ],
  klausuren: [{
    id: 'k1', fach: 'ma', datum: '2026-10-16', thema: 'Quadratische Funktionen', plan: [
      { tag: '2026-10-12', art: 'Lernblock', thema: 'Scheitelpunktform', min: 25, blatt: 'b1' },
      { tag: '2026-10-14', art: 'Wiederholung', thema: 'Alles bis Scheitelpunktform' },
      { tag: '2026-10-15', art: 'Probeklausur', thema: '45 Minuten, ohne Hilfsmittel' },
    ]
  }],
  noten: { ma: [['2', 'Klausur', '17.9.'], ['3+', 'Test', '29.9.'], ['2−', 'mündlich', '7.10.']] },
  karten: [
    { id: 'c1', fach: 'ma', q: 'Wie lautet die Scheitelpunktform einer quadratischen Funktion?', a: '<span class="f-in">f(x) = a(x − d)² + e</span>', n: 'Der Scheitelpunkt ist S(d | e).' },
    { id: 'c2', fach: 'ma', q: 'Wo liegt der Scheitelpunkt von <span class="f-in">f(x) = 2(x − 3)² + 1</span>?', a: '<span class="f-in">S(3 | 1)</span>', n: 'd und e lassen sich direkt ablesen.' },
    { id: 'c3', fach: 'ma', q: 'Was bedeutet ein negatives a für die Parabel?', a: 'Sie ist nach unten geöffnet.', n: 'Der Scheitelpunkt ist dann der höchste Punkt.' },
    { id: 'c4', fach: 'ma', q: 'Bring <span class="f-in">f(x) = x² − 6x + 5</span> in Scheitelpunktform.', a: '<span class="f-in">f(x) = (x − 3)² − 4</span>', n: 'Quadratische Ergänzung mit 9.' },

  if (from == null || opts.instant) {
    SCHRITTE.forEach(s => {
      const el = stepEl(s); el.getAnimations().forEach(a => a.cancel());
      const i = sIdx(s), t = sIdx(to);
      el.style.transform = i === t ? 'none' : `translateX(${i < t ? -.24 * W : W}px)`;
      el.style.opacity = i < t ? '.4' : '1';
      el.classList.toggle('vis', s === to);

  }
  const outEl = stepEl(from);

/* Wisch: folgt dem Finger, Achse nach 10px, Start erst ab 24px vom linken Rand */
(() => {
  let st = null;
  const ACT = 176;
  document.addEventListener('pointerdown', e => {
    const front = e.target.closest('.task[data-mode="faellig"] .t-front');
    if (!front || e.button > 0 || st) return;
    const row = front.parentElement;
    if (openRow && openRow !== row) closeActions(openRow);
    const appLeft = app.getBoundingClientRect().left;
    const m = new DOMMatrixReadOnly(getComputedStyle(front).transform);
    st = { row, front, id: e.pointerId, x0: e.clientX, y0: e.clientY, base: m.m41, drag: false, edge: e.clientX - appLeft < 24, hist: [[e.timeStamp, m.m41]], x: m.m41 };
  });
  document.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return;
    const mx = e.clientX - st.x0, my = e.clientY - st.y0;
    if (!st.drag) {
      if (Math.abs(my) > 10 && Math.abs(my) > Math.abs(mx)) { st = null; return; }
      if (Math.abs(mx) < 10) return;
      if (st.edge && mx > 0 && st.base >= 0) { st = null; return; }
      st.drag = true; st.x0 = e.clientX - Math.sign(mx) * 10 + 0; /* kein Sprung nach der Schwelle */
      st.x0 = e.clientX - mx;
      st.front.getAnimations().forEach(a => a.cancel());
      try { st.front.setPointerCapture(e.pointerId); } catch (err) { }
    }
    const raw = st.base + (e.clientX - st.x0);
    const W = st.row.offsetWidth;
    const a = task(st.row.dataset.id);
    let x;
    if (raw >= 0) x = a && a.done ? (raw * 40) / (40 + raw) : raw;
    else if (raw > -ACT) x = raw;
    else { const o = -raw - ACT; x = -ACT - (o * 40) / (40 + o); }
    st.x = x;
    st.front.style.transform = `translateX(${x}px)`;
    st.row.classList.toggle('drag-r', x > 0);
    st.row.classList.toggle('drag-l', x < 0);
    st.row.classList.toggle('past', x > W * .3);
    st.hist.push([e.timeStamp, x]); if (st.hist.length > 5) st.hist.shift();
  });
  const end = e => {
    if (!st || e.pointerId !== st.id) return;
    const s = st; st = null;
    if (!s.drag) return;
    swallowClick = true; setTimeout(() => swallowClick = false, 60);
    const [ta, xa] = s.hist[0], [tb, xb] = s.hist[s.hist.length - 1];
    const v = (xb - xa) / Math.max(1, tb - ta);
    const W = s.row.offsetWidth;
    const a = task(s.row.dataset.id);
    const commit = a && !a.done && s.x > 0 && (s.x > W * .3 || v > .6) && e.type !== 'pointercancel';
    const openL = s.x < 0 && (s.x < -ACT / 2 || v < -.6) && e.type !== 'pointercancel';
    const target = openL ? -ACT : 0;
    const anim = moveTo(s.front, { transform: `translateX(${target}px)` }, reduce() ? { duration: 0 } : SPRING);
    s.row.classList.remove('drag-r', 'past');
    if (openL) { s.row.classList.add('open-l'); openRow = s.row; }
    else anim.finished.then(() => { s.row.classList.remove('drag-l', 'open-l'); }, () => { });
    s.row.classList.remove('drag-l');
    if (openL) s.row.classList.add('open-l');
    if (commit) setDone(a.id, true);
  };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
})();

function grab(src, w, hgt) {

}

  ['bio test', 'suchen', 'Bedienungsprüfung'], ['mathe hilfe bei aufgabe 3', 'eintragen', 'Bedienungsprüfung, Soll strittig'],
  ['Kunst Plakat skizzieren', 'eintragen', 'Fach fehlt in den Beispieldaten'],
  ['Musik referat gliederung', 'eintragen', 'Fach fehlt in den Beispieldaten'],
];
function parserTest() {
  const rows = PARSER_SAETZE.map(([s, soll, quelle]) => {
    const p = parse(s);
    const erste = p.intent === 'suchen' ? (suche(p).top.l1 || '').replace(/<[^>]+>/g, '') : `${p.eFach ? p.eFach.name : 'Fach fehlt'} eintragen, ${p.due ? `bis ${kurz(p.due)}` : 'bis wann?'}: ${p.taskText}`;
    return { s, soll, ist: p.intent, ok: soll === p.intent, erste, quelle };
  });
  const echt = rows.filter(r => r.quelle.startsWith('echt'));
  const ok = rows.filter(r => r.ok).length;
  const page = h('section', { class: 'page', role: 'region', 'aria-label': 'Parser-Messung', style: 'z-index:90' },
    h('div', { class: 'scroll', style: 'padding-top:calc(var(--top) + 16px)' },
      h('h2', { class: 'p-title' }, `${ok}/${rows.length} richtig`),
      h('p', { class: 'p-sub' }, `Echte Sätze des Nutzers: ${echt.length} von 40 (davon ${echt.filter(r => r.ok).length} richtig). Kriterium 9 ist damit nicht belegt.`),
      ...rows.map(r => h('div', { class: 'lrow', style: 'grid-template-columns:1fr auto;cursor:default' },
        h('span', null, h('b', null, r.s), h('span', { class: 's' }, `${r.erste}`), h('span', { class: 's' }, r.quelle)),
        h('span', { style: `font-size:14px;font-weight:620;color:${r.ok ? 'var(--ink-2)' : 'var(--error)'}` }, `${r.soll === 'suchen' ? 'S' : 'E'} / ${r.ist === 'suchen' ? 'S' : 'E'}`)))));
  pagesBox.append(page); zeile.classList.add('hide');
}

/* ================= Tastatur und Start ================= */
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (ui.menu) closeMenu(); else if (!ui.cam && !ui.tisch) openZeile(null);
    return;
  }
  if (e.key !== 'Escape') return;
  if ($('#camMenu').classList.contains('open')) camMenu(false);
  else if (ui.sheet) closeSheet();
  else if (T.confirm) hideConfirm();
  else if (ui.tisch) closeTisch();
  else if (ui.cam) closeCam();
  else if (ui.menu) closeMenu();
  else if (ui.pages.length) popPage();
});
addEventListener('resize', () => $$('.task.done').forEach(r => drawStrikes(r, false)));
try { const d = localStorage.getItem('darstellung'); if (d === 'light' || d === 'dark') document.documentElement.dataset.theme = d; } catch (e) { }
themeColor('paper');
renderNeu(); renderFaellig(); renderLernen(); updateGroups(); updateKopf();
/* Blätter, deren Verarbeitung beim Neuladen noch lief, laufen weiter */
db.blaetter.filter(b => ['hochladen', 'einordnen', 'haengt', 'abschrift_laeuft'].includes(b.status)).forEach(b => serverBlatt(b, b.status === 'abschrift_laeuft' ? 'abschrift' : undefined));
goStep(startSchritt(), { instant: true });
if (QS.has('parsertest')) parserTest();
if (db.block.state === 'run') ensureClock();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  const els = [$('#kopf'), $('#band'), ...$$('.enter', stepEl(ui.step)), zeile];
  if (!reduce()) els.forEach((el, i) => el.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 220, delay: 40 + Math.min(i, 3) * 25, easing: E.out, fill: 'backwards' }));
  document.body.classList.remove('pre');
  if (ui.step === 'fertig') staggerFertig();
  $$('.task.done').forEach(r => drawStrikes(r, false));
});
})();
</script>
