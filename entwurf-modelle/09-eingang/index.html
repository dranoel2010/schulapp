function nav(to,back=false){const old=screen;screen=to;closeModal(true);render();view.scrollTop=0;if(old!==to)animate(view,[{opacity:.3,transform:`translateX(${back?-12:18}px)`},{opacity:1,transform:'translateX(0)'}],220);}
function button(action,label,ic,cls='icon-btn',extra=''){return `<button class="${cls}" data-action="${action}" aria-label="${label}" ${extra}>${icon(ic)}</button>`;}
function row(i,archive=false){const type=i.type==='task'?'Hausaufgabe':i.type==='study'?'Lernblock':'Blatt';return `<div class="row-shell" data-id="${esc(i.id)}"><div class="row-actions" aria-hidden="true"><span class="left">${icon('check')} Erledigt</span><span class="right">${icon('clock')} Einplanen / Ablegen</span></div><button class="row ${i.id===selected&&!archive?'selected':''} ${i.status==='done'?'done':''}" data-action="${archive?'open-archived':'select'}" data-id="${esc(i.id)}" aria-label="${esc(i.subject+' · '+i.title+(archive?' öffnen':' auswählen'))}" ${!archive?`aria-pressed="${i.id===selected}"`:''}><span class="row-icon">${icon(i.status==='done'?'check':i.type==='task'?'circle':i.type==='study'?'clock':'sheet')}</span><span class="row-copy"><span class="row-meta"><span>${esc(i.subject)}</span><span class="kind">${i.status==='planned'?esc(i.day):type}</span></span><span class="row-title">${esc(i.title)}</span></span><span class="row-tail">${esc(i.due)}</span></button></div>`;}
function renderHome(){
 const list=getList();if(!list.some(i=>i.id===selected))selected=list[0]?.id||null;
 const group=(type,title,action='')=>{const entries=list.filter(i=>i.type===type);return `<section><div class="inbox-heading"><h2>${title}</h2>${action}</div>${entries.length?entries.map(i=>row(i)).join(''):`<p class="group-empty">${type==='task'?'Hausaufgaben erledigt.':type==='study'?'Kein offener Lernblock im Eingang.':'Keine neuen Blätter.'}</p>`}</section>`;};
 return `<header class="page-head"><div><h1>Heute</h1><p>Mo, 12. Oktober · Zu Hause</p></div><div class="head-tools">${button('search','Suchen','search')}${button('help','Bedienung und Tastenkürzel','more')}</div></header><nav class="tabs" aria-label="Eingang filtern"><button class="${filter==='inbox'?'active':''}" data-filter="inbox">Eingang <span class="count">${items.filter(i=>i.status==='inbox').length}</span></button><button class="${filter==='tasks'?'active':''}" data-filter="tasks">Hausaufgaben</button><button class="${filter==='planned'?'active':''}" data-filter="planned">Geplant</button></nav><div id="rows">${filter==='inbox'?group('task','Für morgen',button('new-task','Hausaufgabe eintragen','plus'))+group('study','Heute lernen',`<button class="text-action" data-action="exam">Lernplan ${icon('chevron')}</button>`)+group('sheet','Blätter',button('camera','Blatt aufnehmen','camera')):filter==='tasks'?group('task','Für Dienstag',button('new-task','Hausaufgabe eintragen','plus')):`<div class="inbox-heading"><h2>Für später eingeplant</h2></div>${list.length?list.map(i=>row(i)).join(''):'<p class="group-empty">Wähle eine Zeile im Eingang und tippe auf Einplanen.</p>'}`}</div><button class="exam-link" data-action="exam">${icon('calendar')}<span><strong>Mathematik-Klausur</strong><p>Quadratische Funktionen</p></span><span class="exam-date">Fr, 16.10.</span>${icon('chevron')}</button>`;
}
function renderBottom(){const home=screen==='home',main=['home','week','archive'].includes(screen);bottom.hidden=!main;if(!main)return;const disabled=!active()?'disabled':'';bottom.innerHTML=`${home?`<div class="commandbar" aria-label="Aktionen für ausgewählte Zeile"><button data-action="complete" ${disabled}>${icon(active()?.type==='sheet'?'archive':'check')}${active()?.type==='sheet'?'Abschließen':'Erledigen'}</button><button data-action="plan" ${disabled}>${icon('clock')}Einplanen</button><button data-action="archive-item" ${disabled}>${icon('archive')}Ablegen</button></div>`:''}<nav class="nav" aria-label="Hauptnavigation"><button class="nav-item ${home?'active':''}" data-action="home" ${home?'aria-current="page"':''}>${icon('inbox')}Heute</button><button class="nav-item ${screen==='week'?'active':''}" data-action="week">${icon('calendar')}Woche</button><button class="nav-item ${screen==='archive'?'active':''}" data-action="archive">${icon('archive')}Ablage</button><button class="capture-nav" data-action="camera" aria-label="Blatt aufnehmen">${icon('camera')}</button></nav><div class="home-indicator" aria-hidden="true"></div>`;}
function subhead(title,back='home'){return `<header class="subhead">${button(back,'Zurück','back','icon-btn back')}<h1>${title}</h1></header>`;}
function renderWeek(){const days=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];const planned=items.filter(i=>i.status==='planned'&&i.day===['Heute','Morgen','Mittwoch','Donnerstag','Freitag'][day]);return `<header class="page-head"><div><h1>Woche</h1><p>Stundenplan zum Nachsehen · 12. bis 16.10.</p></div>${button('help','Bedienung','more')}</header><div class="weekdays">${['Mo','Di','Mi','Do','Fr'].map((d,n)=>`<button class="day ${day===n?'current':''}" data-day="${n}" aria-label="${days[n]}, ${12+n}. Oktober" aria-pressed="${day===n}">${d}<strong>${12+n}</strong></button>`).join('')}</div><div class="day-label">${days[day]}<span>${day===0?'3 Doppelstunden':day===4?'1 Klausur':''}</span></div>${day===0?`<div class="lesson past"><div class="lesson-time mono">08:00<span>09:30</span></div><div class="lesson-info"><h3>Deutsch</h3><p>R. 104</p></div></div><div class="lesson past"><div class="lesson-time mono">09:50<span>11:20</span></div><div class="lesson-info"><h3>Mathematik</h3><p>R. 208</p></div></div><div class="lesson past"><div class="lesson-time mono">11:40<span>13:10</span></div><div class="lesson-info"><h3>Biologie</h3><p>Bio 1</p></div></div><p class="free">Unterricht heute um 13:10 beendet.</p>`:`<div class="content"><p class="small muted">Für diesen Tag ist im Entwurf kein Stundenplan hinterlegt.</p></div>`}<div class="content"><h2 class="section-heading">${day===0?'Heute ohne feste Uhrzeit':day===1?'Für Dienstag':day===4?'Klausur':'Lernplan'}</h2></div>${day===0?row(items.find(i=>i.id==='lernen')):day===1?items.filter(i=>i.type==='task'&&i.id!=='englisch').map(i=>row(i)).join(''):day===4?`<button class="exam-link" data-action="exam">${icon('calendar')}<span><strong>Mathematik</strong><p>Quadratische Funktionen</p></span>${icon('chevron')}</button>`:`<button class="exam-link" data-action="exam">${icon('clock')}<span><strong>${day===2?'Wiederholung':'Probeklausur'}</strong><p>Quadratische Funktionen</p></span>${icon('chevron')}</button>`}${planned.length?`<div class="content"><h2 class="section-heading">Eingeplant</h2></div>${planned.map(i=>row(i)).join('')}`:''}`;}
function renderExam(){const done=items.find(i=>i.id==='lernen').status==='done';return `${subhead('Mathematik',previous)}<div class="content"><div class="date-line">${icon('calendar')}Freitag, 16. Oktober</div><h2 class="topic">Quadratische Funktionen</h2><div class="facts"><span>Bisherige Noten</span><div class="grades"><span>2</span><span>3+</span><span>2−</span></div></div><h2 class="section-heading">Dein Lernplan</h2><div class="plan-row today"><span class="plan-dot">${icon(done?'check':'clock')}</span><div><span class="daytext">Heute</span><h3>Scheitelpunktform</h3><p>25 Minuten · ohne feste Uhrzeit</p><button class="primary start" data-action="${done?'reopen-study':'study'}">${icon(done?'undo':'play')}${done?'Wieder öffnen':'Lernblock starten'}</button></div></div><div class="plan-row"><span class="plan-dot"></span><div><span class="daytext">Mittwoch, 14.10.</span><h3>Wiederholung</h3><p>Quadratische Funktionen</p></div></div><div class="plan-row"><span class="plan-dot"></span><div><span class="daytext">Donnerstag, 15.10.</span><h3>Probeklausur</h3><p>Aufgaben ohne Hilfe lösen</p></div></div><p class="bottom-note">Die Lernblöcke haben keine Uhrzeit. Du entscheidest, wann du anfängst.</p></div>`;}
const paper=()=>`<div class="paper"><div class="paper-meta">Mathematik · Quadratische Funktionen</div><h3>Die Scheitelpunktform</h3><p>Den Scheitelpunkt einer Parabel direkt ablesen.</p><div class="formula">f(x) = a(x − d)² + e</div><p>1. Bestimme den Scheitelpunkt.<br>2. Zeichne die Parabel.</p><div class="paper-lines"></div></div>`;
function renderCamera(preview=false){return `${subhead(preview?'Aufnahme prüfen':'Blatt aufnehmen',preview?'camera':previous)}<div class="camera-stage ${preview?'capture-preview':''}">${paper()}</div>${preview?`<div class="content"><div class="form-field"><label for="sheet-name">Titel</label><input id="sheet-name" value="Scheitelpunktform" maxlength="90"></div><div class="form-field"><label for="sheet-subject">Fach</label><select id="sheet-subject"><option>Mathematik</option><option>Deutsch</option><option>Biologie</option><option>Englisch</option></select></div><button class="primary full" data-action="save-capture">${icon('inbox')}In den Eingang</button></div>`:`<p class="camera-caption">Blatt innerhalb des Rahmens platzieren.<br>Kamera-Vorschau mit Beispielblatt.</p><button class="shutter" data-action="take-photo" aria-label="Beispielblatt aufnehmen"></button><p class="small muted" style="text-align:center">Nach der Aufnahme Fach und Titel prüfen.</p>`}`;}
function renderArchive(){const list=items.filter(i=>i.status===archiveFilter);return `<header class="page-head"><div><h1>Ablage</h1><p>Bearbeitet und wieder auffindbar.</p></div>${button('search','Suchen','search')}</header><nav class="tabs archive-tabs"><button data-archive-filter="done" class="${archiveFilter==='done'?'active':''}">Erledigt <span class="count">${items.filter(i=>i.status==='done').length}</span></button><button data-archive-filter="archived" class="${archiveFilter==='archived'?'active':''}">Abgelegt <span class="count">${items.filter(i=>i.status==='archived').length}</span></button></nav><div class="list-label"><span>${archiveFilter==='done'?'Abgeschlossene Aufgaben und Lernblöcke':'Aufgaben und Material'}</span></div>${list.length?list.map(i=>row(i,true)).join(''):`<div class="empty">${icon('archive')}<h2>Noch nichts abgelegt.</h2><p>Lege eine Zeile aus dem Eingang hier ab.<br>Du kannst sie jederzeit zurückholen.</p></div>`}`;}
function renderDetail(){const i=items.find(x=>x.id===detailId);if(!i)return '';return `${subhead(i.type==='sheet'?'Blatt':i.type==='study'?'Lernblock':'Hausaufgabe',previous)}<div class="content"><p class="detail-type">${esc(i.subject)}</p><h2 class="detail-title">${esc(i.title)}</h2><p class="small muted">${i.type==='task'?(i.id==='englisch'?'Gestern erledigt':'Fällig am Dienstag, 13. Oktober'):i.type==='study'?'25 Minuten · Heute':'Aufgenommen am 12. Oktober · 1 Seite'}</p>${i.type==='sheet'?`<div class="document-text"><h3>Abschrift</h3><p class="small muted">Beispieltext für diesen Entwurf</p><p>${i.id==='blatt'?'Gedichtanalyse: Untersuche Form, Sprache und die Wirkung des Gedichts. Belege deine Aussagen mit Textstellen.':'Die Scheitelpunktform<br>f(x) = a(x − d)² + e<br>Der Scheitelpunkt ist S(d | e).<br>Bestimme den Scheitelpunkt und zeichne die Parabel.'}</p></div>`:''}<div class="detail-actions">${['done','archived'].includes(i.status)?`<button class="primary" data-action="restore" data-id="${esc(i.id)}">${icon('undo')}Zurück in den Eingang</button>`:`<button class="primary" data-action="detail-complete">${icon('check')}Erledigen</button><button class="secondary" data-action="plan">Einplanen</button>`}</div>${i.type==='study'?'<button class="secondary full" style="margin-top:12px" data-action="exam">Lernplan ansehen</button>':''}</div>`;}
function renderStudy(){return `${subhead('Scheitelpunktform','exam')}<div class="content"><p class="small muted">Mathematik · Lernblock für heute</p><div class="timer" id="timer">${formatTime()}</div><p class="timer-caption" id="timer-caption">${running?'Deine Lernzeit läuft.':'Bereit, wenn du es bist.'}</p><button class="primary full" data-action="toggle-timer" id="timer-button">${icon(running?'pause':'play')}${running?'Pause':'25 Minuten starten'}</button><div class="study-content" style="margin-top:28px"><h3>Den Scheitelpunkt ablesen</h3><div class="math">f(x) = a(x − d)² + e</div><p>Der Scheitelpunkt liegt bei S(d | e).<br>Bei f(x) = 2(x − 3)² + 1 ist er S(3 | 1).</p></div><button class="secondary full" data-action="recall">Wissen abrufen</button><button class="secondary full" style="margin-top:10px" data-action="finish-study">${icon('check').replace('<svg','<svg style="vertical-align:middle;margin-right:8px"')}Lernblock erledigt</button></div>`;}
function render(){view.innerHTML=screen==='home'?renderHome():screen==='week'?renderWeek():screen==='exam'?renderExam():screen==='camera'?renderCamera():screen==='preview'?renderCamera(true):screen==='archive'?renderArchive():screen==='detail'?renderDetail():screen==='study'?renderStudy():`${subhead('Suchen',previous)}<div class="search-wrap"><input id="search-input" placeholder="Fach, Aufgabe oder Blatt" aria-label="Eingang und Ablage durchsuchen" value="${esc(search)}" type="search"></div><div class="search-results" id="search-results"></div>`;renderBottom();bindGestures();if(screen==='search'){renderSearch();setTimeout(()=>document.querySelector('#search-input')?.focus(),0);}}
function renderSearch(){const results=items.filter(i=>(i.title+' '+i.subject).toLowerCase().includes(search.toLowerCase()));document.querySelector('#search-results').innerHTML=results.map(i=>row(i,true)).join('')||'<div class="empty"><h2>Nichts gefunden.</h2><p>Versuche es mit einem Fach oder einem anderen Wort.</p></div>';}
function notify(message,undo=false){const t=document.querySelector('#toast');clearTimeout(toastTimer);t.innerHTML=`<span>${esc(message)}</span>${undo?'<button data-action="undo">Rückgängig</button>':''}`;t.classList.add('show');toastTimer=setTimeout(()=>t.classList.remove('show'),5500);}
function changeItem(id,status,dayValue){const i=items.find(x=>x.id===id);if(!i)return;undoSnapshot=structuredClone(items);i.status=status;if(dayValue)i.day=dayValue;save();const before=new Map([...view.querySelectorAll('.row-shell')].map(el=>[el.dataset.id,el.getBoundingClientRect().top]));render();for(const el of view.querySelectorAll('.row-shell')){const y=before.get(el.dataset.id);if(y!==undefined)animate(el,[{transform:`translateY(${y-el.getBoundingClientRect().top}px)`},{transform:'translateY(0)'}],240);}notify(status==='done'?'Erledigt.':status==='archived'?'In der Ablage.':status==='planned'?`Für ${dayValue==='Heute'?'heute':dayValue==='Morgen'?'morgen':dayValue} eingeplant.`:'Zurück im Eingang.',true);}
function complete(id=selected){const i=items.find(x=>x.id===id);if(!i)return;if(i.type==='sheet'){changeItem(id,'archived');return;}changeItem(id,'done');}
function openModal(content){returnFocus=document.activeElement;sheet.innerHTML=`<div class="sheet-handle"></div>${content}`;modal.classList.add('open');view.inert=true;bottom.inert=true;sheet.querySelector('button,input')?.focus();}
function closeModal(immediate=false){if(!modal.classList.contains('open'))return;modal.classList.remove('open');view.inert=false;bottom.inert=false;if(!immediate&&returnFocus?.isConnected)returnFocus.focus();}
function plan(){if(!active())return;openModal(`<div class="sheet-title"><h2 id="sheet-title">Einplanen</h2>${button('close-modal','Schließen','close')}</div><p class="sheet-sub">${esc(active().title)}<br>Ohne feste Uhrzeit.</p>${[['Heute','Zu Hause','sun'],['Morgen','Dienstag, 13.10.','calendar'],['Mittwoch','14.10.','calendar']].map(([d,t,ic])=>`<button class="choice" data-plan="${d}">${icon(ic)}<span>${d}</span><small>${t}</small></button>`).join('')}<button class="choice" data-action="archive-item">${icon('archive')}<span>Stattdessen ablegen</span></button>`);}
function help(){openModal(`<div class="sheet-title"><h2 id="sheet-title">Ein Eingang. Drei Wege.</h2>${button('close-modal','Schließen','close')}</div><p class="sheet-sub">Eine Zeile antippen, dann unten bearbeiten.<br>Erneut antippen öffnet die Details.</p><div class="help-row"><strong>Nach rechts wischen</strong><span>Erledigen</span></div><div class="help-row"><strong>Nach links wischen</strong><span>Einplanen</span></div><div class="help-row"><strong>Weit nach links</strong><span>Ablegen</span></div><div class="help-row"><strong>Am Laptop</strong><span><kbd>J</kbd> <kbd>K</kbd> Zeile wählen</span></div><div class="help-row"><strong>Direkt bearbeiten</strong><span><kbd>E</kbd> fertig <kbd>P</kbd> planen <kbd>A</kbd> ablegen</span></div><p class="bottom-note">Jede Aktion lässt sich rückgängig machen. Der Entwurf speichert Änderungen nur in diesem Browser.</p><button class="secondary full" data-action="reset-demo">Beispieldaten zurücksetzen</button>`);}
function formatTime(){return `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`;}
setInterval(()=>{if(!running)return;seconds=Math.max(0,Math.ceil((timerEnds-Date.now())/1000));const el=document.querySelector('#timer');if(el)el.textContent=formatTime();if(!seconds){running=false;notify('25 Minuten geschafft. Lernblock abschließen?');if(screen==='study')render();}},300);
function openDetail(id){detailId=id;selected=id;previous=screen;nav('detail');}
app.addEventListener('input',e=>{if(e.target.id==='search-input'){search=e.target.value;renderSearch();}});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.filter){filter=b.dataset.filter;selected=null;render();return;}if(b.dataset.archiveFilter){archiveFilter=b.dataset.archiveFilter;render();return;}if(b.dataset.day!==undefined){day=Number(b.dataset.day);render();return;}if(b.dataset.plan){closeModal(true);changeItem(selected,'planned',b.dataset.plan);if(screen==='detail')nav('home',true);return;}const a=b.dataset.action;switch(a){case 'new-task':openModal(`<div class="sheet-title"><h2 id="sheet-title">Hausaufgabe eintragen</h2>${button('close-modal','Schließen','close')}</div><p class="sheet-sub">Für Dienstag, 13. Oktober</p><div class="form-field"><label for="task-subject">Fach</label><select id="task-subject"><option>Mathematik</option><option>Deutsch</option><option>Biologie</option><option>Englisch</option></select></div><div class="form-field"><label for="task-title">Aufgabe</label><input id="task-title" placeholder="Was ist auf?" maxlength="120"></div><button class="primary full" data-action="save-task">In den Eingang</button>`);break;case 'save-task':{const title=document.querySelector('#task-title').value.trim();if(!title){document.querySelector('#task-title').focus();return;}undoSnapshot=structuredClone(items);const i={id:'task-'+Date.now(),type:'task',subject:document.querySelector('#task-subject').value,title,due:'Morgen',status:'inbox'};items.unshift(i);selected=i.id;filter='inbox';save();closeModal(true);nav('home');notify('Hausaufgabe eingetragen.',true);break;}case 'home':case 'week':case 'archive':nav(a,true);break;case 'select':if(screen==='week'){const i=items.find(x=>x.id===b.dataset.id);if(i.type==='study'){previous='week';nav('exam');}else openDetail(i.id);}else if(selected===b.dataset.id)openDetail(b.dataset.id);else{selected=b.dataset.id;view.querySelectorAll('.row').forEach(el=>{el.classList.toggle('selected',el.dataset.id===selected);el.setAttribute('aria-pressed',String(el.dataset.id===selected));});renderBottom();}break;case 'open-archived':openDetail(b.dataset.id);break;case 'complete':complete();break;case 'detail-complete':complete();nav('home',true);break;case 'archive-item':closeModal(true);changeItem(selected,'archived');if(screen==='detail')nav('home',true);break;case 'plan':plan();break;case 'help':help();break;case 'close-modal':closeModal();break;case 'exam':if(!['study','detail','exam'].includes(screen))previous=screen;nav('exam');break;case 'camera':if(screen!=='preview')previous=screen;nav('camera');break;case 'take-photo':nav('preview');break;case 'save-capture':{const title=document.querySelector('#sheet-name').value.trim();if(!title){document.querySelector('#sheet-name').focus();notify('Gib dem Blatt einen Titel.');return;}undoSnapshot=structuredClone(items);const i={id:'scan-'+Date.now(),type:'sheet',subject:document.querySelector('#sheet-subject').value,title,due:'1 Seite',status:'inbox'};items.unshift(i);selected=i.id;filter='inbox';save();nav('home',true);notify('Blatt im Eingang gespeichert.',true);break;}case 'restore':changeItem(b.dataset.id,'inbox');filter='inbox';selected=b.dataset.id;nav('home',true);break;case 'search':if(screen!=='detail'){previous=screen;searchOrigin=screen;search='';}else previous=searchOrigin;nav('search');break;case 'undo':if(undoSnapshot){items=undoSnapshot;undoSnapshot=null;save();render();notify('Rückgängig gemacht.');}break;case 'reset-demo':items=structuredClone(initial);selected='mathe';filter='inbox';running=false;seconds=1500;save();closeModal(true);nav('home');notify('Beispieldaten zurückgesetzt.');break;case 'study':nav('study');break;case 'reopen-study':changeItem('lernen','inbox');nav('study');break;case 'toggle-timer':if(running){seconds=Math.max(0,Math.ceil((timerEnds-Date.now())/1000));running=false;}else{if(seconds===0)seconds=1500;timerEnds=Date.now()+seconds*1000;running=true;}render();break;case 'finish-study':running=false;changeItem('lernen','done');nav('exam',true);break;case 'recall':openModal(`<div class="sheet-title"><h2 id="sheet-title">Wissen abrufen</h2>${button('close-modal','Schließen','close')}</div><p class="sheet-sub">Wo liegt der Scheitelpunkt?</p><p style="font:27px Georgia,serif;text-align:center;margin:30px 0">f(x) = (x + 2)² − 4</p><button class="primary full" data-action="show-answer">Antwort zeigen</button>`);break;case 'show-answer':sheet.querySelector('.sheet-sub').innerHTML='Der Scheitelpunkt liegt bei <strong>S(−2 | −4)</strong>.';b.outerHTML='<button class="primary full" data-action="close-modal">Weiterlernen</button>';break;}});
document.addEventListener('keydown',e=>{if(modal.classList.contains('open')){if(e.key==='Escape'){e.preventDefault();closeModal();}if(e.key==='Tab'){const f=[...sheet.querySelectorAll('button,input,select')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1)?.focus();}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0]?.focus();}}return;}if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;keyboard=true;app.classList.add('shortcut-mode');if(e.key==='Escape'&&screen!=='home')nav(previous,true);if(screen==='home'){const list=getList();const index=list.findIndex(i=>i.id===selected);const key=e.key.toLowerCase();if(['j','k','e','p','a','/'].includes(key))e.preventDefault();if(key==='j'||key==='k'){selected=list[Math.max(0,Math.min(list.length-1,index+(key==='j'?1:-1)))]?.id;render();}if(key==='e')complete();if(key==='p')plan();if(key==='a'&&selected)changeItem(selected,'archived');if(key==='/'){previous=screen;searchOrigin=screen;search='';nav('search');}}keyboard=false;setTimeout(()=>app.classList.remove('shortcut-mode'),0);});
// Gesture motion follows the pointer. A critically damped spring carries release velocity.
function bindGestures(){if(!['home','week'].includes(screen))return;for(const el of view.querySelectorAll('.row')){let drag=null,x=0,v=0,raf=0,suppress=false;function stop(){cancelAnimationFrame(raf);raf=0;}function spring(target,velocity=0){stop();v=velocity;let last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.025);last=now;v+=(-580*(x-target)-48*v)*dt;x+=v*dt;el.style.transform=`translateX(${x}px)`;if(Math.abs(x-target)>.35||Math.abs(v)>2)raf=requestAnimationFrame(frame);else{x=target;el.style.transform=`translateX(${x}px)`;}}if(matchMedia('(prefers-reduced-motion: reduce)').matches){x=target;el.style.transform=`translateX(${x}px)`;}else raf=requestAnimationFrame(frame);}
 el.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;stop();drag={id:e.pointerId,start:e.clientX-x,sy:e.clientY,last:e.clientX,time:performance.now(),axis:null,origin:e.clientX};});
 el.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.origin,dy=e.clientY-drag.sy;if(!drag.axis&&Math.hypot(dx,dy)>8){drag.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';if(drag.axis==='x')el.setPointerCapture(e.pointerId);}if(drag.axis!=='x')return;const now=performance.now();v=(e.clientX-drag.last)/Math.max(now-drag.time,1)*1000;drag.last=e.clientX;drag.time=now;x=e.clientX-drag.start;if(Math.abs(x)>220)x=Math.sign(x)*(220+(Math.abs(x)-220)*.3);el.style.transform=`translateX(${x}px)`;const right=el.parentElement.querySelector('.right');right.innerHTML=x< -145?`${icon('archive')} Ablegen`:`${icon('clock')} Einplanen`;});
 el.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const didDrag=drag.axis==='x';drag=null;if(!didDrag){spring(0);return;}suppress=true;setTimeout(()=>suppress=false,0);selected=el.dataset.id;const projected=x+v*.075;if(x>55&&projected>85){complete(selected);}else if(x< -145){changeItem(selected,'archived');}else if(x< -40&&projected< -65){spring(0,v);plan();}else spring(0,v);});
 el.addEventListener('pointercancel',()=>{drag=null;spring(0);});el.addEventListener('click',e=>{if(suppress){e.preventDefault();e.stopPropagation();}},true);
}}
render();
</script>
