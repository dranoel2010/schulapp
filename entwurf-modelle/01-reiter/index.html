if(type==='plan')return ['Lernblock',`<h1 tabindex="-1">${id==='2'?'Wiederholung':'Probeklausur'}</h1><p class="detail-sub">${id==='2'?'Mittwoch, 14. Oktober':'Donnerstag, 15. Oktober'}</p><div class="detail-meta">Mathematik · ohne feste Uhrzeit</div><hr class="rule"><h2>Quadratische Funktionen</h2><p class="detail-sub">${id==='2'?'Wiederhole die Scheitelpunktform und prüfe, ob du den Scheitelpunkt ablesen kannst.':'Löse die Aufgaben ohne Hilfe. Vergleiche danach deine Ergebnisse mit deinen Unterlagen.'}</p><button class="secondary" data-action="quiz">Mit einer Frage üben</button>`];
if(type==='lesson'){let l=lessons[Number(id)];return ['Unterricht',`<h1 tabindex="-1">${l.name}</h1><p class="detail-sub">Montag, 12. Oktober<br>${l.start} bis ${l.end}</p><div class="detail-meta">${l.hours} · ${l.room}</div><hr class="rule"><h2>Zum Fach</h2><button class="row" data-action="subject" data-id="${l.name}"><span class="row-title">${l.name} öffnen</span>${icon('chevron','chevron')}</button>${l.name==='Mathematik'?examLink():''}<button class="capture-link" data-action="camera">${icon('camera')}Blatt aufnehmen</button>`]}
if(type==='task'){let t=state.tasks.find(t=>t.id===id);return ['Hausaufgabe',`<h1 tabindex="-1">${esc(t.title)}</h1><p class="detail-sub">${esc(t.subject)}</p><div class="detail-meta">${icon('week')}${t.yesterday?'Gestern erledigt':'Fällig am Dienstag, 13. Oktober'}</div><hr class="rule">${taskRow(t)}<p class="footnote">Tippe auf den Kreis, um den Status zu ändern.</p><button class="row" data-action="subject" data-id="${esc(t.subject)}"><span class="row-title">Zum Fach</span>${icon('chevron','chevron')}</button>`]}
if(type==='subject'){let subject=id;return ['Fach',`<h1 tabindex="-1">${esc(subject)}</h1>${subject==='Mathematik'?`<p class="detail-sub">Raum 208</p><div class="section-head"><h2>Noten</h2><span class="muted">3 Einträge</span></div><div class="notes"><span class="grade">2</span><span class="grade">3+</span><span class="grade">2−</span></div><div class="section-head"><h2>Nächste Klausur</h2></div>${examLink()}`:''}<div class="section-head"><h2>Aufgaben</h2></div>${state.tasks.filter(t=>t.subject===subject).map(taskRow).join('')||'<p class="empty">Keine Aufgaben eingetragen.</p>'}<button class="capture-link" data-action="camera">${icon('camera')}Blatt aufnehmen</button>`]}

if(type==='camera')return ['Blatt aufnehmen',`<div class="camera-area"><p class="camera-caption">Kamera-Vorschau · Demo</p>${paper()}<i class="scan-corner tl"></i><i class="scan-corner tr"></i><i class="scan-corner bl"></i><i class="scan-corner br"></i></div><div class="camera-controls"><h2>Blatt im Rahmen ausrichten</h2><p style="margin-top:9px">Eine Seite, gut beleuchtet.</p><button class="shutter" data-action="capture" aria-label="Demo-Blatt fotografieren"></button></div>`];

if(type==='sheet'){let s=state.sheets[Number(id)];return ['Material',`<h1 tabindex="-1">${esc(s.title)}</h1><p class="detail-sub">${esc(s.subject)} · 12. Oktober</p><div class="section-head"><h2>Abschrift</h2></div><p class="footnote">Beispielabschrift des Demo-Blatts.</p><div class="answer"><strong>Die Scheitelpunktform</strong><div class="formula-large">f(x) = a(x − d)² + e</div>1. Bestimme den Scheitelpunkt.<br>2. Zeichne die Parabel.</div><button class="secondary" data-action="quiz">Wissen dazu abrufen</button>`]}

return ['Detail',''];}
function renderDetail(){if(!detailStack.length)return;const d=detailStack.at(-1),[label,html]=contentFor(d.type,d.id);detail.innerHTML=detailHeader(label)+`<div class="detail-scroll">${html}</div>`;detail.querySelector('.back').focus({preventScroll:true})}
function paintMotion(){const width=app.clientWidth;detail.style.transform=`translateX(${motion.x}px)`;workspace.style.transform=`translateX(${-Math.max(0,width-motion.x)*.2}px)`;workspace.style.opacity=String(.82+.18*Math.min(1,motion.x/width))}
function finishMotion(){if(nestedClosing){nestedClosing=false;detailStack.pop();renderDetail();motion.x=motion.target=0;paintMotion();underlay.classList.remove('visible');underlay.innerHTML='';return}if(motion.target===0){underlay.classList.remove('visible');underlay.innerHTML='';}if(motion.target===app.clientWidth&&!detailStack.length){detail.classList.remove('visible');detail.inert=true;workspace.style.transform='';workspace.style.opacity='';workspace.inert=false;returnFocus?.isConnected&&returnFocus.focus({preventScroll:true})}}
function springTo(target){motion.target=target;if(reduce()||keyboard){cancelAnimationFrame(motion.raf);motion.raf=0;motion.x=target;motion.v=0;paintMotion();finishMotion();return}if(motion.raf)return;motion.last=performance.now();function tick(now){const dt=Math.min((now-motion.last)/1000,.025);motion.last=now;motion.v+=(620*(motion.target-motion.x)-48*motion.v)*dt;motion.x+=motion.v*dt;paintMotion();if(Math.abs(motion.target-motion.x)<.35&&Math.abs(motion.v)<4){motion.x=motion.target;motion.v=0;motion.raf=0;paintMotion();finishMotion()}else motion.raf=requestAnimationFrame(tick)}motion.raf=requestAnimationFrame(tick)}
function openDetail(type,id='',replace=false){hideToast();if(nestedClosing){nestedClosing=false;detailStack.pop()}if(detailStack.length&&!replace){underlay.innerHTML=detail.innerHTML;underlay.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));underlay.classList.add('visible');motion.x=app.clientWidth;motion.v=0;paintMotion()}if(!detailStack.length){returnFocus=document.activeElement;motion.x=app.clientWidth;motion.v=0;detail.classList.add('visible');detail.inert=false;workspace.inert=true;paintMotion()}if(replace)detailStack.pop();detailStack.push({type,id});renderDetail();springTo(0)}
function closeDetail(instant=false){if(!detailStack.length)return;nestedClosing=false;underlay.classList.remove('visible');underlay.innerHTML='';detailStack=[];detail.inert=true;workspace.inert=false;if(instant){cancelAnimationFrame(motion.raf);motion.raf=0;motion.x=motion.target=app.clientWidth;paintMotion();finishMotion()}else springTo(app.clientWidth)}
function prepareParent(){const parent=detailStack.at(-2);if(!parent)return;const [label,html]=contentFor(parent.type,parent.id);underlay.innerHTML=detailHeader(label)+`<div class="detail-scroll">${html}</div>`;underlay.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));underlay.classList.add('visible')}
function back(){if(nestedClosing)return;if(detailStack.length>1){prepareParent();nestedClosing=true;springTo(app.clientWidth)}else closeDetail()}
function timerText(){return `${Math.floor(timerRemaining/60).toString().padStart(2,'0')}:${(timerRemaining%60).toString().padStart(2,'0')}`}
setInterval(()=>{if(!timerRunning)return;timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));let t=detail.querySelector('#timer');if(t)t.textContent=timerText();if(timerRemaining===0){timerRunning=false;notify('25 Minuten geschafft');if(detailStack.at(-1)?.type==='study')renderDetail()}},500);

toast.querySelector('button').addEventListener('click',()=>undoAction?.());
app.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.target),title=String(data.get('title')||'').trim(),subject=String(data.get('subject'));if(!title){const input=e.target.querySelector('input');input.setCustomValidity('Bitte gib einen Titel ein.');input.reportValidity();input.addEventListener('input',()=>input.setCustomValidity(''),{once:true});return}if(e.target.id==='sheet-form'){state.sheets.push({title,subject});persist();switchTab('subjects');notify('Blatt in Material abgelegt')}if(e.target.id==='task-form'){state.tasks.push({id:'task-'+Date.now(),title,subject,done:false});persist();switchTab('tasks');notify('Aufgabe für morgen hinzugefügt')}});
document.addEventListener('keydown',e=>{keyboard=true;app.classList.add('key-input');if(e.key==='Escape'){hideToast();back()}if(e.target.closest('.tabs')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const ids=['today','tasks','week','learn','subjects'];let i=ids.indexOf(activeTab);i=e.key==='Home'?0:e.key==='End'?4:(i+(e.key==='ArrowRight'?1:4))%5;switchTab(ids[i])}});
document.addEventListener('pointerdown',()=>{keyboard=false;app.classList.remove('key-input')},{passive:true});
// The edge gesture follows the finger, then hands its velocity to a damped spring.
detail.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0||gesture||!detailStack.length||reduce())return;const left=detail.getBoundingClientRect().left;if(e.clientX-left>25||e.target.closest('button,input,select'))return;nestedClosing=false;if(detailStack.length>1)prepareParent();cancelAnimationFrame(motion.raf);motion.raf=0;gesture={id:e.pointerId,start:e.clientX,base:motion.x,prev:e.clientX,time:e.timeStamp,v:0,dx:0};detail.setPointerCapture(e.pointerId)});
detail.addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId)return;const dt=Math.max(1,e.timeStamp-gesture.time);gesture.v=(e.clientX-gesture.prev)/dt*1000;gesture.prev=e.clientX;gesture.time=e.timeStamp;gesture.dx=e.clientX-gesture.start;motion.x=Math.max(0,Math.min(app.clientWidth,gesture.base+gesture.dx));paintMotion()});
function endGesture(e,cancel=false){if(!gesture||gesture.id!==e.pointerId)return;const g=gesture;gesture=null;motion.v=g.v;if(!cancel&&g.dx>8&&motion.x+g.v*.12>app.clientWidth*.32){back()}else springTo(0)}
detail.addEventListener('pointerup',e=>endGesture(e));detail.addEventListener('pointercancel',e=>endGesture(e,true));
renderMain();motion.x=motion.target=app.clientWidth;
</script>
</body>
