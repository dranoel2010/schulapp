/* Blattfoto im Entwurf: wörtlich aus dem Handy-Prototyp */
const paperCache = new Map();
function paperImg(id, page = 0) {
  const key = id + ':' + page; if (paperCache.has(key)) return paperCache.get(key);
  const b = db.blaetter.find(x => x.id === id);
  const W = 300, H = 424, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  let seed = 0; for (const ch of key) seed = (seed * 31 + ch.charCodeAt(0)) % 9973;
  const rnd = () => (seed = (seed * 137 + 71) % 9973) / 9973;
  x.fillStyle = '#E7E6E1'; x.fillRect(0, 0, W, H);
  const lg = x.createLinearGradient(0, 0, W, H); lg.addColorStop(0, 'rgba(255,255,255,.35)'); lg.addColorStop(1, 'rgba(0,0,0,.06)');
  x.fillStyle = lg; x.fillRect(0, 0, W, H);
  x.save(); x.translate(W / 2, H / 2); x.rotate((rnd() - .5) * .018); x.translate(-W / 2, -H / 2);
  x.filter = 'blur(.35px)';
  const parts = (b && b.abschrift) || [['h', b ? b.titel || 'Blatt' : 'Blatt'], ['p', '']];
  const per = Math.ceil(parts.length / Math.max(1, b ? b.seiten : 1));
  const mine = page === 0 ? parts : parts.slice(page * per).length ? parts.slice(page * per) : parts.slice(1);
  let y = 40; const L = 26, R0 = W - 26;
  x.fillStyle = '#56565A'; x.font = '600 9px Helvetica, Arial, sans-serif';
  x.fillText(`${b && b.fach ? F(b.fach).name : ''}   Klasse 10   ${b ? dm(b.datum) : ''}`, L, 22);
  for (const [t, txt] of mine) {
    if (y > H - 24) break;
    const head = t === 'h', form = t === 'f';
    x.font = head ? '700 15px Helvetica, Arial, sans-serif' : form ? 'italic 13px Georgia, serif' : '400 10.5px Helvetica, Arial, sans-serif';
    x.fillStyle = head ? '#232326' : '#3A3A3E';
    const words = String(txt).replace(/[{}]/g, '').split(' '); let line = '';
    const lh = head ? 20 : form ? 19 : 14.5;
    if (head && y > 40) y += 8;
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (x.measureText(test).width > R0 - L && line) { x.fillText(line, L, y); y += lh; line = w; if (y > H - 24) break; }
      else line = test;
    }
    if (line && y <= H - 24) { x.fillText(line, L, y); y += lh; }
    y += head ? 2 : 5;
  }
  x.restore();
  const url = c.toDataURL('image/jpeg', .8);
  paperCache.set(key, url); return url;
}

/* Wie die Kamera: jede Datei wird ein Blatt, Jev ordnet ein. Mehrere Bilder auf einmal

  if (!files.length) return;
  const anlegen = gruppen => {
    const neu = gruppen.map(fs => {
      const b = { id: 'n' + (nextId++), fach: null, titel: null, thema: null, datum: heute(), seiten: fs.length, status: 'neu', abschrift: null, bilder: fs.map(f => f.type.startsWith('image/') ? URL.createObjectURL(f) : null) };

    });

    toast(neu.length === 1 ? 'Blatt abgelegt' : `${cap(zahl(neu.length, 'n'))} Blätter abgelegt`, () => go('ablage', { blatt: neu[0].id }), null, 'Ansehen');

    h('button', { class: 'rb', type: 'button', onclick: () => rateQ(false) }, 'Daneben', h('span', { class: 'd-k' }, '1')), h('button', { class: 'rb known', type: 'button', onclick: () => rateQ(true) }, 'Saß', h('span', { class: 'd-k' }, '2')));
  box.append(h('div', { class: 't-head' }, h('p', { class: 't-fach' }, T.uhr ? 'Geschichte · Lernblock' : 'Epoche · Geschichte'), h('p', { class: 't-thema' }, 'Industrialisierung in England')), ticks,
    h('div', { class: 't-meta' }, h('p', { class: 't-count' }, T.i === 0 ? `${T.q.length} Fragen` : `Noch ${T.q.length - T.i} von ${T.q.length}`)), stack, h('div', { class: 't-foot' }, ask, rate));
  tK.replaceChildren(box);
  requestAnimationFrame(() => {
    const front = $('.face.front .c-q', card).scrollHeight + 72 + 12;
    const back = T.flipped ? $('.c-back', card).scrollHeight + 8 : 0;
    stack.style.height = `${Math.max(240, front, back)}px`;
    if (!T.flipped) ta.focus({ preventScroll: true });
  });
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); reveal(ta); } });
}
function reveal(ta) {
  if (T.flipped) return;
  T.mine = ta ? ta.value.trim() : ''; T.flipped = true;
  const sc = $('.d-cards .sc[data-pos="0"]');
  const mine = $('.cb-mine', sc); mine.textContent = T.mine || 'Keine Antwort'; mine.classList.toggle('none', !T.mine);
  sc.classList.add('flipped'); document.activeElement && document.activeElement.blur();
  const st = $('.d-cards .t-stack'), need = $('.c-back', sc).scrollHeight + 8; if (need > st.offsetHeight) st.style.height = `${need}px`;
  $('.d-cards .t-ask').style.visibility = 'hidden'; $('.d-cards .t-rate').style.visibility = 'visible';
}
function rateQ(ok) {
  if (!T.flipped) return;
  T.first[T.q[T.i].id] = ok;
  const sc = $('.d-cards .sc[data-pos="0"]');
  const next = () => { T.i++; T.flipped = false; T.mine = ''; buildKarten(); };
  if (reduce()) { next(); return; }
  sc.animate([{ transform: 'none', opacity: 1 }, { transform: `translateX(${ok ? 120 : -120}px) rotate(${ok ? 4 : -4}deg)`, opacity: 0 }], { duration: 220, easing: E.out, fill: 'forwards' }).finished.then(next);
}

/* ================= Tastatur ================= */
addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (tisch.classList.contains('open')) {
    if (e.key === 'Escape') { e.preventDefault(); closeTisch(); return; }
    if (T.mode === 'karten') {
      if (!T.flipped && e.key === ' ' && !typing) { e.preventDefault(); reveal($('.d-cards textarea')); }
      else if (T.flipped && (e.key === '1' || e.key === 'ArrowLeft')) rateQ(false);
      else if (T.flipped && (e.key === '2' || e.key === 'ArrowRight' || e.key === ' ')) { e.preventDefault(); rateQ(true); }
    } else if (T.mode === 'blatt' && (e.key === 'p' || e.key === 'P') && !e.metaKey && !e.ctrlKey && db.blatt.phase === 'vorschau') drucken();
    return;
  }
  if (typing || $('#dlg').classList.contains('on')) return;
  if (e.key === '/' || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) { e.preventDefault(); field.focus(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = Number(e.key);
  if (n >= 1 && n <= 7) { go(['heute', 'hausaufgaben', 'klausuren', 'woche', 'ablage', 'faecher', 'noten'][n - 1], {}, { key: true }); return; }
  const key = { hausaufgaben: 'hausaufgaben', klausuren: 'klausuren', ablage: 'ablage', faecher: 'faecher', noten: 'noten', einstellungen: 'einstellungen' }[ui.view];
  if (key && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'j' || e.key === 'k')) {
    e.preventDefault();
    const ids = $$(`.view[data-v="${ui.view}"] .d-list [data-id]`).map(x => x.dataset.id).filter(Boolean);
    if (!ids.length) return;
    const at = ids.indexOf(ui.sel[key]); const d = e.key === 'ArrowDown' || e.key === 'j' ? 1 : -1;
    selectIn(key, ids[Math.max(0, Math.min(ids.length - 1, at + d))], { key: true });
    $(`.view[data-v="${ui.view}"] .d-list .sel`)?.scrollIntoView({ block: 'nearest' });
  }
  if (ui.view === 'hausaufgaben' && (e.key === 'x' || e.key === 'X')) { const a = db.aufgaben.find(x => x.id === ui.sel.hausaufgaben) || db.archiv.find(x => x.id === ui.sel.hausaufgaben); if (a) { toggleTask(a, null); render(); } }
});

/* ================= Start ================= */
$('#rWhen').append(h('b', null, voll(heute())));
updateCounts();
go(ui.view, {}, { key: true });
/* Prüfschalter für Bilder: ?tisch=blatt|karten|wertung|ende, ?q=Suchtext */
const tq = QS.get('tisch');
if (tq) {
  if (tq === 'wertung') { db.blatt.phase = 'bewerten'; db.blatt.wertung = { 1: true, 2: true, 3: false }; }
  if (tq === 'ende') { db.blatt.phase = 'fertig'; db.blatt.wertung = { 1: true, 2: true, 3: false, 4: true, 5: true, 6: true }; }
  openTisch(tq === 'karten' || tq === 'aufgedeckt' ? 'karten' : tq === 'lernblock' ? 'lernkarten' : 'blatt', null);
  if (tq === 'aufgedeckt') { const ta = $('.d-cards textarea'); ta.value = 'England, um 1760'; reveal(ta); }
}
if (QS.get('q') != null) { field.focus(); field.value = QS.get('q'); field.dispatchEvent(new Event('input')); }
})();
</script>
