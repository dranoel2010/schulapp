function announce(text){$('#announcer').textContent=text}
function notify(message,undo){clearTimeout(toastTimer);const t=$('#toast');t.innerHTML=`<span>${message}</span>${undo?'<button>Rückgängig</button>':''}`;if(undo)t.querySelector('button').onclick=()=>{undo();t.classList.remove('show')};t.classList.add('show');toastTimer=setTimeout(()=>t.classList.remove('show'),4200)}
function syncTasks(){ $('#learn-status').textContent=state.learned?'Heute gelernt · 25 Min.':'Heute lernen · 25 Min.';$('#learn-link').textContent=state.learned?'Lernplan ansehen':'Lernplan öffnen';$('#material-status').textContent=state.saved?'1 Blatt gespeichert':'Blätter wiederfinden'; $$('[data-task]').forEach(b=>{const checked=!!state.tasks[b.dataset.task];b.classList.toggle('checked',checked);b.setAttribute('aria-pressed',String(checked))});const count=Number(!state.tasks.math)+Number(!state.tasks.german);$('#task-count').textContent=count?`${count} offen`:'Alles erledigt';if($('#remaining'))$('#remaining').textContent=count?`${count} ${count===1?'Aufgabe ist':'Aufgaben sind'} noch offen.`:'Für morgen ist alles erledigt.'}
function toggleTask(id){state.tasks[id]=!state.tasks[id];save();syncTasks();announce(state.tasks[id]?'Aufgabe erledigt':'Aufgabe wieder offen');if(state.tasks[id])notify('Aufgabe erledigt',()=>{state.tasks[id]=false;save();syncTasks()})}
function taskRow(id,subject,title){return `<button class="task-row" data-task="${id}"><span class="tick">${icon('check')}</span><span class="task-copy"><strong>${subject}</strong>${title}</span></button>`}
const views={
tasks:()=>`<h1>Hausaufgaben</h1><p class="page-sub" id="remaining"></p><h2 class="section-title">Morgen, 13. Oktober</h2>${taskRow('math','Mathematik','S. 84, Nr. 3–5')}${taskRow('german','Deutsch','Gedichtanalyse beenden')}<h2 class="section-title">Von gestern</h2>${taskRow('english','Englisch','Vokabeln Unit 3')}<p class="subtle-note">Ein Häkchen lässt sich jederzeit zurücknehmen.</p>`,
schedule:()=>`<h1>Stundenplan</h1><p class="page-sub">12. bis 16. Oktober 2026</p><div class="day-strip">${['Mo','Di','Mi','Do','Fr'].map((d,i)=>`<button class="day ${i===1?'active':''}" data-day="${i}">${d}<strong>${12+i}</strong></button>`).join('')}</div><div id="lessons">${noLessons(1)}</div>`,
exam:()=>`<h1>Mathematik</h1><p class="topic">Quadratische<br>Funktionen</p><div class="exam-intro"><div><p>Freitag, 16. Oktober</p><p class="muted">Klausur</p></div><div><span class="number">4</span><p class="muted">Tage noch</p></div></div><h2 class="section-title">Dein Lernplan</h2><div class="plan-row today"><small>Heute · 25 Minuten</small><h3>Scheitelpunktform</h3><p>${state.learned?'Lernblock erledigt':'Ohne feste Uhrzeit'}</p><button class="primary" data-action="learn">${icon(state.learned?'check':'play')}${state.learned?'Noch einmal ansehen':'Lernblock öffnen'}</button></div><div class="plan-row"><small>Mittwoch, 14. Oktober</small><h3>Wiederholung</h3><p>Quadratische Funktionen</p></div><div class="plan-row"><small>Donnerstag, 15. Oktober</small><h3>Probeklausur</h3><p>Aufgaben selbstständig lösen</p></div>`,
learn:()=>`<h1>Scheitelpunktform</h1><p class="page-sub">Mathematik · Lernblock für heute</p><div class="study-paper"><p>25 Minuten, wann es dir passt.</p><div class="formula">f(x) = a(x − d)² + e</div><p>Der Scheitelpunkt ist S(d | e). Das Vorzeichen von a bestimmt, ob sich die Parabel nach oben oder unten öffnet.</p></div><h2 class="minor-heading">Zum Üben</h2><p class="page-sub">Bestimme den Scheitelpunkt von<br>f(x) = 2(x − 3)² + 1.</p><button class="secondary" data-action="solution">Lösung ansehen</button><p id="solution" class="page-sub" hidden>S(3 | 1). Die Parabel öffnet sich nach oben.</p><button class="primary" data-action="finish-learn">${icon('check')}${state.learned?'Bereits erledigt':'Lernblock als erledigt markieren'}</button>`,
camera:()=>`<h1>Blatt aufnehmen</h1><p class="page-sub">Lege das ganze Blatt in den Rahmen.</p><div class="viewfinder"><div class="sheet-paper" aria-hidden="true"><h3>Quadratische<br>Funktionen</h3><p>Mathematik · Klasse 10</p><div class="formula">f(x) = a(x − d)² + e</div><p>1. Bestimme den Scheitelpunkt.<br>2. Zeichne die Parabel.</p><div class="paper-line"></div><div class="paper-line"></div><div class="paper-line"></div></div><i class="finder-corner c1"></i><i class="finder-corner c2"></i><i class="finder-corner c3"></i><i class="finder-corner c4"></i><div class="flash" id="flash"></div></div><p class="camera-note">Kameravorschau im Entwurf</p><button class="shutter" aria-label="Blatt fotografieren" data-action="capture"></button>`,
review:()=>`<h1>Blatt ablegen</h1><p class="page-sub">Die Aufnahme ist bereit.</p><label class="field">Titel<input id="sheet-title" value="Quadratische Funktionen" maxlength="80"></label><label class="field">Fach<select id="sheet-subject"><option>Mathematik</option><option>Deutsch</option><option>Biologie</option></select></label><label class="field">Thema<input id="sheet-topic" value="Scheitelpunktform" maxlength="80"></label><button class="primary" data-action="save-sheet">${icon('check')}Blatt speichern</button><button class="secondary" data-action="retake">Noch einmal aufnehmen</button>`,
material:()=>`<h1>Material</h1><p class="page-sub">Deine aufgenommenen Blätter</p>${state.saved?`<button class="material-row" data-action="read-sheet">${icon('file')}<span><strong>${escapeHtml(state.sheetTitle||'Quadratische Funktionen')}</strong><small>${escapeHtml(state.sheetSubject||'Mathematik')} · Heute aufgenommen</small></span>${icon('next')}</button>`:'<p class="empty">Hier ist noch kein Blatt.<br>Fotografiere dein erstes Arbeitsblatt.</p>'}<button class="primary" data-action="new-sheet">${icon('camera')}Blatt aufnehmen</button>`,
sheet:()=>`<h1>${escapeHtml(state.sheetTitle||'Quadratische Funktionen')}</h1><p class="page-sub">${escapeHtml(state.sheetSubject||'Mathematik')} · ${escapeHtml(state.sheetTopic||'Scheitelpunktform')}</p><h2 class="section-title">Abschrift der Beispielaufnahme</h2><div class="study-paper"><div class="formula">f(x) = a(x − d)² + e</div><p>1. Bestimme den Scheitelpunkt.<br>2. Zeichne die Parabel.</p></div><p class="subtle-note">Im Entwurf wird eine vorbereitete Beispielaufnahme verwendet.</p>`,
grades:()=>`<h1>Noten</h1><p class="page-sub">Mathematik</p><div class="grade-list"><div class="grade">2</div><div class="grade">3+</div><div class="grade">2−</div></div><p class="subtle-note">Deine drei bisherigen Noten. Für einen gewichteten Schnitt fehlen die Notenarten.</p><button class="primary" data-action="exam">Nächste Matheklausur ${icon('next')}</button>`,
subjects:()=>`<h1>Fächer</h1><p class="page-sub">10. Klasse</p>${['Mathematik','Deutsch','Biologie','Englisch'].map(s=>`<button class="subject-row" data-subject="${s}">${s}${icon('next')}</button>`).join('')}`,
study:()=>`<h1>Wissen abrufen</h1><p class="page-sub">Mathematik · Scheitelpunktform</p><div class="recall"><small class="muted">Übungsfrage</small><h2 class="minor-heading" style="margin-top:18px">Wo liegt der Scheitelpunkt von<br>f(x) = (x − 2)² + 3?</h2><p id="answer" hidden>S(2 | 3)</p></div><button class="primary" data-action="answer">Antwort zeigen</button><div id="recall-actions" hidden><button class="primary" data-action="known">Gewusst ${icon('check')}</button><button class="secondary" data-action="repeat">Noch einmal üben</button></div>`
};
function monday(){return `<div class="lesson"><time>08:00<br>09:30</time><div><h2 class="minor-heading">Deutsch</h2><p>Raum 104</p></div></div><div class="lesson"><time>09:50<br>11:20</time><div><h2 class="minor-heading">Mathematik</h2><p>Raum 208</p></div></div><div class="lesson"><time>11:40<br>13:10</time><div><h2 class="minor-heading">Biologie</h2><p>Bio 1</p></div></div><p class="free">${icon('check')}Unterricht heute um 13:10 beendet</p>`}
function noLessons(day){return `<p class="empty">${day===1?'Morgen, Dienstag':'Für diesen Tag'} sind im Entwurf noch keine Stunden hinterlegt.</p><p class="subtle-note">Die Beispielstunden findest du unter Montag.</p>`}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const titles={tasks:'Für morgen',schedule:'Diese Woche',exam:'Klausur',learn:'Lernplan',camera:'Aufnehmen',review:'Aufnahme',material:'Ablage',sheet:'Material',grades:'10. Klasse',subjects:'10. Klasse',study:'Üben'};
let stack=[];
function render(name){current=name;content.innerHTML=views[name]();content.scrollTop=0;page.classList.toggle('camera-page',name==='camera');$('#nav-label').textContent=titles[name]||'';$('#back').innerHTML=icon('back')+(stack.length?({exam:'Lernplan',camera:'Aufnahme',material:'Material',subjects:'Fächer'}[stack.at(-1)]||'Zurück'):'Heute');syncTasks();page.setAttribute('aria-label',content.querySelector('h1')?.textContent||'Bereich')}
function widgetTransform(){const a=origin.getBoundingClientRect(),b=phone.getBoundingClientRect();return `translate(${a.left-b.left}px,${a.top-b.top-page.offsetTop}px) scale(${a.width/page.offsetWidth},${a.height/page.offsetHeight})`}
function openPage(name,from,keyboard=false){if(editing)return;origin=from;stack=[];render(name);page.inert=false;page.classList.add('visible');home.inert=true;const transform=widgetTransform();pageAnimation?.cancel();if(!reduced.matches&&!keyboard){pageAnimation=page.animate([{transform,opacity:.5},{transform:'none',opacity:1}],{duration:300,easing:'cubic-bezier(.32,.72,0,1)'});home.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.97)',opacity:.6}],{duration:280,easing:'cubic-bezier(.23,1,.32,1)'});}$('#back').focus({preventScroll:true})}
function navigate(name){stack.push(current);render(name);if(!reduced.matches)content.animate([{opacity:.25,transform:'translateX(12px)'},{opacity:1,transform:'none'}],{duration:200,easing:'cubic-bezier(.23,1,.32,1)'});$('#back').focus({preventScroll:true})}
function closePage(keyboard=false){if(stack.length){render(stack.pop());return}const live=getComputedStyle(page).transform;pageAnimation?.cancel();home.inert=false;const finish=()=>{page.classList.remove('visible');page.inert=true;current=null;origin?.focus({preventScroll:true})};if(reduced.matches||keyboard){finish();return}pageAnimation=page.animate([{transform:live,opacity:1},{transform:widgetTransform(),opacity:0}],{duration:250,easing:'cubic-bezier(.32,.72,0,1)'});pageAnimation.onfinish=finish}
$('#back').onclick=e=>closePage(e.detail===0);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(current)closePage(true);else if(editing)setEditing(false)}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.task){if(!editing)toggleTask(b.dataset.task);return}if(b.dataset.open){openPage(b.dataset.open,b,e.detail===0);return}if(b.dataset.day){$$('.day').forEach(x=>x.classList.toggle('active',x===b));$('#lessons').innerHTML=b.dataset.day==='0'?monday():noLessons(Number(b.dataset.day));return}if(b.dataset.subject){const s=b.dataset.subject;navigate(s==='Mathematik'?'exam':'subject');return}const action=b.dataset.action;if(!action)return;switch(action){case'learn':navigate('learn');break;case'solution':$('#solution').hidden=false;b.hidden=true;break;case'finish-learn':state.learned=true;save();render('learn');notify('Lernblock erledigt');break;case'capture':if(!reduced.matches)$('#flash').animate([{opacity:.85},{opacity:0}],{duration:180});navigate('review');break;case'retake':render('camera');stack=stack.filter(s=>s!=='camera');break;case'save-sheet':{const title=$('#sheet-title').value.trim();if(!title){$('#sheet-title').focus();notify('Gib dem Blatt einen Titel.');break}state.saved=true;state.sheetTitle=title;state.sheetSubject=$('#sheet-subject').value;state.sheetTopic=$('#sheet-topic').value;save();stack=[];render('material');notify('Blatt in Material gespeichert');break}case'new-sheet':navigate('camera');break;case'read-sheet':navigate('sheet');break;case'exam':navigate('exam');break;case'answer':$('#answer').hidden=false;b.hidden=true;$('#recall-actions').hidden=false;break;case'known':content.innerHTML='<h1>Richtig.</h1><p class="page-sub">Der Scheitelpunkt liegt bei S(2 | 3).</p><div class="study-paper"><p>Die Übungsfrage ist abgeschlossen.</p></div><button class="primary" data-action="repeat">Noch einmal üben</button>';announce('Übungsfrage abgeschlossen');break;case'repeat':render('study');break}});
// Subject pages remain deliberately factual: only supplied example data is shown.
views.subject=()=>`<h1>${escapeHtml(subjectName)}</h1><p class="page-sub">10. Klasse</p>${subjectName==='Deutsch'?'<h2 class="section-title">Hausaufgabe für Dienstag</h2>'+taskRow('german','Deutsch','Gedichtanalyse beenden'):subjectName==='Englisch'?'<h2 class="section-title">Hausaufgabe von gestern</h2>'+taskRow('english','Englisch','Vokabeln Unit 3'):'<h2 class="section-title">Heute</h2><p class="page-sub">11:40 bis 13:10 · Bio 1</p>'}`;
let subjectName='Deutsch';document.addEventListener('click',e=>{const b=e.target.closest('[data-subject]');if(b)subjectName=b.dataset.subject},true);
function setEditing(value){editing=value;home.classList.toggle('editing',value);$('#edit').classList.toggle('done',value);$('#edit').innerHTML=value?'Fertig':icon('grid');$('#edit').setAttribute('aria-label',value?'Anordnung speichern':'Widgets anordnen');$('#hint').textContent=value?'Widget ziehen oder antippen und verschieben':'Gedrückt halten zum Anordnen';if(value){selected=selected||grid.firstElementChild;selectWidget(selected)}else{selected?.classList.remove('selected');state.order=[...grid.children].map(w=>w.dataset.id);save();announce('Anordnung gespeichert')}}
function selectWidget(w){selected?.classList.remove('selected');selected=w;w.classList.add('selected');announce(`${w.getAttribute('aria-label')?.replace(' öffnen','')||'Hausaufgaben'} ausgewählt`)}
$('#edit').onclick=()=>setEditing(!editing);
function rects(){return new Map([...grid.children].map(w=>[w,w.getBoundingClientRect()]))}
// Four widgets occupy exactly six cells. The wide widget snaps above or below
// the two-row group, so no reorder can leave an unreachable fourth row.
function layoutGrid(){const all=[...grid.children],wide=all.find(w=>w.classList.contains('wide')),tall=all.find(w=>w.classList.contains('tall')),small=all.filter(w=>w!==wide&&w!==tall);const top=all.indexOf(wide)<2,start=top?2:1,tallCol=all.indexOf(tall)<all.indexOf(small[0])?1:2;wide.style.gridColumn='1 / span 2';wide.style.gridRow=String(top?1:3);tall.style.gridColumn=String(tallCol);tall.style.gridRow=`${start} / span 2`;small.forEach((w,i)=>{w.style.gridColumn=String(3-tallCol);w.style.gridRow=String(start+i)})}
function flip(before){layoutGrid();if(reduced.matches)return;[...grid.children].forEach(w=>{if(w.classList.contains('dragged'))return;const a=before.get(w),b=w.getBoundingClientRect();if(a&&(a.left!==b.left||a.top!==b.top))w.animate([{transform:`translate(${a.left-b.left}px,${a.top-b.top}px)`},{transform:'none'}],{duration:250,easing:'cubic-bezier(.23,1,.32,1)'})})}
function moveSelected(direction){if(!selected)return;const all=[...grid.children],i=all.indexOf(selected),to=i+direction;if(to<0||to>=all.length)return;const before=rects();grid.insertBefore(selected,direction<0?all[to]:all[to].nextSibling);flip(before);state.order=[...grid.children].map(w=>w.dataset.id);save();announce('Widget verschoben')}
$('#move-prev').onclick=()=>moveSelected(-1);$('#move-next').onclick=()=>moveSelected(1);
let gesture=null,suppressClick=false;
grid.addEventListener('contextmenu',e=>e.preventDefault());
grid.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0||gesture||e.target.closest('[data-task]')&&!editing)return;const w=e.target.closest('.widget');if(!w)return;gesture={w,id:e.pointerId,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,lastTime:performance.now(),vx:0,vy:0,started:false};gesture.timer=setTimeout(()=>startDrag(e),420);if(editing){clearTimeout(gesture.timer);startDrag(e)}});
function startDrag(e){if(!gesture)return;const g=gesture;setEditing(true);selectWidget(g.w);g.started=true;suppressClick=true;const r=g.w.getBoundingClientRect(),p=phone.getBoundingClientRect();g.rect=r;g.left=r.left-p.left;g.top=r.top-p.top;g.ghost=g.w.cloneNode(true);g.ghost.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));g.ghost.removeAttribute('id');g.ghost.setAttribute('aria-hidden','true');g.ghost.className='widget ghost';Object.assign(g.ghost.style,{left:g.left+'px',top:g.top+'px',width:r.width+'px',height:r.height+'px'});phone.append(g.ghost);g.w.classList.add('dragged');grid.setPointerCapture(g.id);announce('Widget kann jetzt verschoben werden')}
grid.addEventListener('pointermove',e=>{const g=gesture;if(!g||e.pointerId!==g.id)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;if(!g.started){if(Math.hypot(dx,dy)>9){clearTimeout(g.timer);gesture=null}return}const now=performance.now(),dt=Math.max(now-g.lastTime,1);g.vx=(e.clientX-g.lastX)/dt*1000;g.vy=(e.clientY-g.lastY)/dt*1000;g.lastX=e.clientX;g.lastY=e.clientY;g.lastTime=now;g.dx=dx;g.dy=dy;g.ghost.style.transform=`translate(${dx}px,${dy}px) scale(1.04)`;const target=[...grid.children].find(w=>{if(w===g.w)return false;const r=w.getBoundingClientRect();return e.clientX>r.left+12&&e.clientX<r.right-12&&e.clientY>r.top+12&&e.clientY<r.bottom-12});if(target&&target!==g.lastTarget){const before=rects(),all=[...grid.children],forward=all.indexOf(target)>all.indexOf(g.w);grid.insertBefore(g.w,forward?target.nextSibling:target);g.lastTarget=target;flip(before)}else if(!target)g.lastTarget=null});
// Independent physical springs retain release velocity while the widget settles.
function settle(ghost,x,y,tx,ty,vx,vy,finish){if(reduced.matches){finish();return}let last=performance.now(),elapsed=0;const response=.3,damping=.8,omega=2*Math.PI/response;function frame(now){const dt=Math.min((now-last)/1000,.025);last=now;elapsed+=dt;vx+=(-omega*omega*(x-tx)-2*damping*omega*vx)*dt;vy+=(-omega*omega*(y-ty)-2*damping*omega*vy)*dt;x+=vx*dt;y+=vy*dt;const scale=1+.04*Math.max(0,1-elapsed/.18);ghost.style.transform=`translate(${x}px,${y}px) scale(${scale})`;if(elapsed>.6||Math.hypot(x-tx,y-ty)<.3&&Math.hypot(vx,vy)<2)finish();else requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function endDrag(e){const g=gesture;if(!g||e.pointerId!==g.id)return;clearTimeout(g.timer);gesture=null;if(!g.started)return;grid.releasePointerCapture(g.id);const target=g.w.getBoundingClientRect(),p=phone.getBoundingClientRect();settle(g.ghost,g.dx||0,g.dy||0,target.left-p.left-g.left,target.top-p.top-g.top,g.vx,g.vy,()=>{g.ghost.remove();g.w.classList.remove('dragged')});state.order=[...grid.children].map(w=>w.dataset.id);save();setTimeout(()=>suppressClick=false,0);announce('Widget eingerastet')}
grid.addEventListener('pointerup',endDrag);grid.addEventListener('pointercancel',endDrag);window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
grid.addEventListener('click',e=>{if(suppressClick||e.target.closest('[data-task]'))return;const w=e.target.closest('.widget');if(!w)return;if(editing){selectWidget(w);return}openPage(w.dataset.page,w,e.detail===0)});
grid.addEventListener('keydown',e=>{const w=e.target.closest('.widget');if(!w||e.target.closest('button'))return;if(editing&&(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='ArrowRight'||e.key==='ArrowDown')){e.preventDefault();selectWidget(w);moveSelected(e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(editing)selectWidget(w);else openPage(w.dataset.page,w,true)}});
syncTasks();
</script>
</body>
