<body>
<div class="app" id="app">
<main class="screen" id="screen" tabindex="-1"></main>
<div class="dock-wrap" id="dockWrap">
<nav class="suggestions" id="suggestions" aria-label="Vorschläge"></nav>
<div class="dock"><button class="search-trigger" id="searchTrigger" aria-haspopup="dialog" aria-controls="palette"><span id="searchIcon"></span><span>Suchen oder öffnen …</span></button><button class="camera-trigger" data-go="camera" aria-label="Blatt aufnehmen" id="cameraButton"></button></div>
</div>
<div class="toast" id="toast" inert role="status" aria-live="polite"><span id="toastText"></span><button id="undoButton">Rückgängig</button></div>
</div>
<dialog id="palette" aria-label="Suchen und öffnen">

<div class="results" id="results" role="listbox" aria-label="Suchergebnisse"></div>
<form class="search-form" id="searchForm"><span id="paletteIcon"></span><input id="query" placeholder="Fach, Aufgabe, Thema …" aria-label="Suche" role="combobox" aria-controls="results" aria-expanded="true" aria-autocomplete="list" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go"><button type="button" class="clear-search" id="clearSearch" aria-label="Suche leeren"></button></form>
</dialog>
<script>
'use strict';
const paths={search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/>',camera:'<path d="M4 6h4l2-2h4l2 2h4v14H4z"/><circle cx="12" cy="13" r="4"/>',arrow:'<path d="m9 5 7 7-7 7"/>',back:'<path d="m14 5-7 7 7 7"/>',check:'<path d="m5 12 4 4L19 6"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',calendar:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 10h16m-11 4h2m3 0h1m-6 3h2"/>',task:'<circle cx="12" cy="12" r="8"/><path d="m8 12 3 3 5-6"/>',book:'<path d="M4 4h6l2 2 2-2h6v15h-6l-2 2-2-2H4zM12 6v15"/>',home:'<path d="m4 10 8-7 8 7v11h-6v-7h-4v7H4z"/>',file:'<path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6m-6 4h6"/>',grade:'<path d="M5 20h14M7 16V9m5 7V4m5 12v-5"/>',play:'<path d="m9 5 10 7-10 7z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',subjects:'<path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/>',return:'<path d="M19 5v9H5m5-5-5 5 5 5"/>'};
const icon=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.arrow}</svg>`;
const $=s=>document.querySelector(s);
const screen=$('#screen'),palette=$('#palette'),query=$('#query');
let current='home',historyStack=[],keyboard=false,activeResult=0,visibleCommands=[],toastTimer,undoAction=null,weekDay=0,answerVisible=false;
const state={tasks:[false,false,true],learned:false,sheets:[],remaining:25*60,running:false};
try{const saved=JSON.parse(localStorage.getItem('schulapp-03-demo'));if(saved){if(Array.isArray(saved.tasks)&&saved.tasks.length===3)state.tasks=saved.tasks.map(Boolean);state.learned=!!saved.learned;if(Array.isArray(saved.sheets))state.sheets=saved.sheets;}}catch(e){}
function save(){try{localStorage.setItem('schulapp-03-demo',JSON.stringify({tasks:state.tasks,learned:state.learned,sheets:state.sheets}));}catch(e){}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function header(label='Heute'){return `<header class="top">${current==='home'?`<div class="brand">${icon('book')}<span>Heute</span></div><div class="date"><strong>Montag, 12. Oktober</strong>16:40 Uhr · zu Hause</div>`:`<button class="back" data-action="back">${icon('back')}<span>Zurück</span></button><span class="top-end">${label}</span>`}</header>`;}
function home(){return `${header()}<section class="home-now"><h1>Für morgen.</h1><p id="taskCount" aria-live="polite">${taskSummary()}</p><ul class="tasks">${taskRow(0)}${taskRow(1)}</ul></section><section class="home-study"><h2 class="section-label">Heute lernen<span>${state.learned?'Erledigt':'25 Minuten'}</span></h2><h3>Scheitelpunktform</h3><p>Mathematik · Klausur am Freitag, 16.10.</p><div class="home-study-actions"><button class="inline-button" data-go="learn">${icon(state.learned?'check':'play')}${state.learned?'Noch einmal ansehen':'Lernblock öffnen'}</button><button class="text-button" data-go="exam">Lernplan ${icon('arrow')}</button></div></section><button class="home-lookup" data-go="week" data-week-day="1">${icon('calendar')}Stundenplan nachsehen ${icon('arrow')}</button>`;}

const taskNames=['S. 84, Nr. 3–5','Gedichtanalyse beenden','Vokabeln Unit 3'];const taskSubjects=['Mathematik','Deutsch','Englisch'];
function taskRow(i){return `<li class="task ${state.tasks[i]?'checked':''}" data-task-row="${i}"><button class="check" data-toggle="${i}" role="checkbox" aria-checked="${state.tasks[i]}" aria-label="${taskNames[i]}"><span class="check-circle">${icon('check')}</span></button><div><span class="task-title">${taskNames[i]}</span><p class="task-sub"><span class="subject">${taskSubjects[i]}</span>${i<2?' · für Dienstag':''}</p></div></li>`;}
function tasks(){return `${header('Hausaufgaben')}<h1>Hausaufgaben</h1><p class="page-meta" id="taskCount">${taskSummary()}</p><h2 class="section-label">Morgen<span>Dienstag, 13.10.</span></h2><ul class="tasks">${taskRow(0)}${taskRow(1)}</ul><h2 class="section-label">Von gestern<span>Sonntag, 11.10.</span></h2><ul class="tasks">${taskRow(2)}</ul><p class="hint">Abhaken, wenn du fertig bist.<br>Ein zweites Tippen öffnet die Aufgabe wieder.</p>`;}
function taskSummary(){let n=state.tasks.slice(0,2).filter(x=>!x).length;return n?`${n} ${n===1?'Aufgabe':'Aufgaben'} für morgen offen`:'Alles für morgen erledigt';}
function week(){return `${header('Stundenplan')}<h1>Diese Woche</h1><p class="page-meta">12. bis 16. Oktober</p><div class="week-strip" role="tablist" aria-label="Wochentag">${['Mo','Di','Mi','Do','Fr'].map((d,i)=>`<button class="day ${weekDay===i?'selected':''}" data-day="${i}" role="tab" tabindex="${weekDay===i?0:-1}" aria-selected="${weekDay===i}">${d}<strong>${12+i}</strong></button>`).join('')}</div><div role="tabpanel" aria-label="${['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'][weekDay]}">${weekDay===0?`<ol class="schedule"><li class="slot past"><div class="time">08:00<span>09:30</span></div><div><h2>Deutsch</h2><p>Raum 104</p></div></li><li class="slot past"><div class="time">09:50<span>11:20</span></div><div><h2>Mathematik</h2><p>Raum 208</p></div></li><li class="slot past"><div class="time">11:40<span>13:10</span></div><div><h2>Biologie</h2><p>Bio 1</p></div></li></ol><p class="free">Danach frei.</p>`:`<div class="empty">Keine Stunden hinterlegt.<p>Im Entwurf ist der Stundenplan für Montag enthalten.</p></div>${weekDay===4?`<button class="simple-row" data-go="exam">${icon('calendar')}<span><strong>Mathematik-Klausur</strong><small>Quadratische Funktionen</small></span>${icon('arrow')}</button>`:weekDay===1?`<button class="simple-row" data-go="tasks">${icon('task')}<span><strong>Hausaufgaben für Dienstag</strong><small>${taskSummary()}</small></span>${icon('arrow')}</button>`:`<button class="simple-row" data-go="exam">${icon('book')}<span><strong>${weekDay===2?'Wiederholung':'Probeklausur'}</strong><small>Lernplan Mathematik</small></span>${icon('arrow')}</button>`}`}</div>`;}
function exam(){return `${header('Klausur')}<h1>Mathematik</h1><p class="page-meta">Klausur in 4 Tagen</p><p class="exam-title">Quadratische<br>Funktionen</p><div class="exam-date">${icon('calendar')}Freitag, 16. Oktober</div><h2 class="section-label">Dein Lernplan<span>Ohne feste Uhrzeit</span></h2><ol class="study-list"><li class="study-item current"><span class="study-node">${state.learned?icon('check'):'Mo'}</span><div><p class="study-day">Heute, 12.10.</p><h3>Scheitelpunktform</h3><small>25 Minuten${state.learned?' · erledigt':''}</small><button class="inline-button" data-go="learn">${icon(state.learned?'check':'play')}${state.learned?'Noch einmal ansehen':'Lernblock öffnen'}</button></div></li><li class="study-item"><span class="study-node">Mi</span><div><p class="study-day">Mittwoch, 14.10.</p><h3>Wiederholung</h3><small>Quadratische Funktionen</small></div></li><li class="study-item"><span class="study-node">Do</span><div><p class="study-day">Donnerstag, 15.10.</p><h3>Probeklausur</h3><small>Mit Aufgaben selbst prüfen</small></div></li></ol><button class="text-button" data-go="grades">Bisherige Mathenoten ${icon('arrow')}</button>`;}
function sheetPreview(){return `<div class="paper-sheet" aria-hidden="true"><p class="paper-title">Quadratische Funktionen</p><p>Die Scheitelpunktform</p><div class="formula">f(x) = a(x − d)² + e</div><p>Der Scheitelpunkt liegt bei S(d | e).</p><div class="paper-line"></div><p>1. Bestimme den Scheitelpunkt.</p><p>f(x) = (x − 3)² + 2</p><div class="paper-line"></div><div class="paper-line"></div><p>2. Zeichne die Parabel.</p><div class="paper-line"></div></div>`;}
function camera(){return `${header('Material')}<h1>Blatt aufnehmen</h1><p class="page-meta">Kameravorschau im Entwurf</p><div class="camera-view">${sheetPreview()}<div class="scan-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div><div class="capture-row"><small>Ganzes Blatt<br>im Rahmen</small><button class="shutter" data-action="capture" aria-label="Beispielblatt aufnehmen"></button><small class="right-label">Demo<br>ohne Kamera</small></div>`;}
function review(){return `${header('Aufnahme')}<h1>Passt so?</h1><div class="review-thumbnail"><div class="mini-paper">${icon('file')}</div><div><p>Eine Seite aufgenommen</p><small>Beispielblatt aus der Vorschau</small></div></div><form id="sheetForm"><label class="form-field">Titel<input name="title" required maxlength="90" value="Scheitelpunktform"></label><label class="form-field">Fach<select name="subject"><option>Mathematik</option><option>Deutsch</option><option>Biologie</option><option>Englisch</option></select></label><button class="inline-button wide" type="submit">${icon('check')}Blatt ablegen</button></form><button class="text-button" data-go="camera">Neu aufnehmen</button>`;}
function material(){return `${header('Material')}<h1>Deine Blätter</h1><p class="page-meta">Fotos und Abschriften</p>${state.sheets.length?state.sheets.map((s,i)=>`<button class="simple-row" data-sheet="${i}">${icon('file')}<span><strong>${escapeHtml(s.title)}</strong><small>${escapeHtml(s.subject)} · 12.10.2026</small></span>${icon('arrow')}</button>`).join(''):`<div class="empty">Noch kein Blatt abgelegt.<p>Nimm das Beispielblatt auf. Es erscheint anschließend hier.</p></div>`}<button class="inline-button wide" data-go="camera">${icon('camera')}Blatt aufnehmen</button>`;}
let sheetIndex=0;
function sheet(){const s=state.sheets[sheetIndex];return `${header('Blatt')}<h1>${escapeHtml(s?.title||'Scheitelpunktform')}</h1><p class="page-meta">${escapeHtml(s?.subject||'Mathematik')} · 12.10.2026</p><div class="camera-view">${sheetPreview()}</div><h2 class="section-label">Abschrift<span>Beispieltext</span></h2><p>f(x) = a(x − d)² + e</p><p class="hint">Der Scheitelpunkt liegt bei S(d | e).</p>`;}
function grades(){return `${header('Noten')}<h1>Mathematik</h1><p class="page-meta">Bisherige Noten</p><div class="grades" aria-label="Noten: 2, 3 plus, 2 minus"><span class="grade">2</span><span class="grade">3+</span><span class="grade">2−</span></div><p class="hint">Drei eingetragene Noten. Für einen Fachschnitt fehlen hier Art und Gewichtung.</p><button class="simple-row" data-go="exam">${icon('calendar')}<span><strong>Nächste Klausur</strong><small>Freitag, 16. Oktober</small></span>${icon('arrow')}</button>`;}
function subjects(){return `${header('Fächer')}<h1>Fächer</h1><p class="page-meta">Unterricht, Aufgaben und Material</p>${['Mathematik','Deutsch','Biologie','Englisch'].map((s,i)=>`<button class="simple-row" data-subject="${i}"><span class="subject-letter">${s[0]}</span><span><strong>${s}</strong><small>${['Klausur am Freitag','Raum 104','Bio 1','Vokabeln Unit 3'][i]}</small></span>${icon('arrow')}</button>`).join('')}`;}
let selectedSubject=0;
function subject(){const name=['Mathematik','Deutsch','Biologie','Englisch'][selectedSubject];return `${header('Fach')}<h1>${name}</h1><p class="page-meta">${['Raum 208','Raum 104','Bio 1','Hausaufgaben'][selectedSubject]}</p>${selectedSubject===0?`<button class="simple-row" data-go="exam">${icon('calendar')}<span><strong>Quadratische Funktionen</strong><small>Klausur am 16.10.</small></span>${icon('arrow')}</button><button class="simple-row" data-go="grades">${icon('grade')}<span><strong>Noten</strong><small>2, 3+, 2−</small></span>${icon('arrow')}</button>`:''}${selectedSubject!==2?`<button class="simple-row" data-go="tasks">${icon('task')}<span><strong>${taskNames[selectedSubject===0?0:selectedSubject===1?1:2]}</strong><small>Hausaufgabe</small></span>${icon('arrow')}</button>`:`<p class="hint">Heute von 11:40 bis 13:10.</p>`}<button class="simple-row" data-go="material">${icon('file')}<span><strong>Material</strong><small>Blätter und Abschriften öffnen</small></span>${icon('arrow')}</button>`;}
function learn(){return `${header('Lernblock')}<h1>Scheitelpunktform</h1><p class="page-meta">Mathematik · heute</p><div class="timer" id="timer">${timerText()}</div><p class="timer-label">Minuten für diesen Lernblock</p><div class="study-actions"><button class="inline-button secondary" id="timerToggle" data-action="timer">${state.running?'Pausieren':state.remaining===1500?'Timer starten':'Weiterlernen'}</button><button class="inline-button" data-action="complete-study">${icon('check')}Erledigt</button></div><h2 class="section-label">Zum Üben</h2><button class="simple-row" data-go="recall">${icon('book')}<span><strong>Wissen abrufen</strong><small>Den Scheitelpunkt erkennen</small></span>${icon('arrow')}</button><p class="hint">Du kannst den Block jederzeit beginnen. Der Timer ist freiwillig.</p>`;}
function recall(){return `${header('Wissen abrufen')}<h1>Kurz abfragen</h1><p class="page-meta">Mathematik · Scheitelpunktform</p><section class="recall"><h2>Wo liegt der Scheitelpunkt?</h2><p class="formula" style="font-size:24px;margin-top:24px">f(x) = (x − 3)² + 2</p><div class="answer" id="answer" tabindex="-1" ${answerVisible?'':'hidden'}><strong>S(3 | 2)</strong><p>In f(x) = a(x − d)² + e liest du den Scheitelpunkt als S(d | e) ab.</p></div></section>${answerVisible?`<button class="inline-button wide" data-action="understood">Verstanden</button><button class="text-button" data-action="again">Noch einmal abfragen</button>`:`<button class="inline-button wide" data-action="answer">Antwort zeigen</button>`}`;}
const screens={home,tasks,week,exam,camera,review,material,sheet,grades,subjects,subject,learn,recall};
function render(animate=true,back=false){screen.getAnimations().forEach(a=>a.cancel());screen.innerHTML=screens[current]();screen.scrollTop=0;document.title=`${({home:'Heute',tasks:'Hausaufgaben',week:'Stundenplan',exam:'Klausur',camera:'Blatt aufnehmen',review:'Aufnahme',material:'Material',grades:'Noten',subjects:'Fächer',subject:'Fach',learn:'Lernblock',recall:'Wissen abrufen',sheet:'Blatt'})[current]} · 03 Befehlszeile`;$('#suggestions').innerHTML=current==='home'?`<button class="suggestion" data-go="tasks">${icon('task')}Aufgaben</button><button class="suggestion" data-go="material">${icon('file')}Blätter</button>`:'';$('#suggestions').hidden=current!=='home';if(animate&&!keyboard&&!matchMedia('(prefers-reduced-motion: reduce)').matches)screen.animate([{opacity:0,transform:`translateX(${back?-12:12}px)`},{opacity:1,transform:'translateX(0)'}],{duration:220,easing:'cubic-bezier(.23,1,.32,1)'});}
function go(target,back=false){if(!screens[target])return;if(palette.open)palette.close();if(current!==target&&!back)historyStack.push(current);current=target;render(true,back);screen.focus({preventScroll:true});}
function back(){go(historyStack.pop()||'home',true);}
function toast(message,undo){clearTimeout(toastTimer);$('#toastText').textContent=message;undoAction=undo;$('#undoButton').hidden=!undo;$('#toast').inert=false;$('#toast').classList.add('visible');toastTimer=setTimeout(hideToast,5500);}
function hideToast(){if($('#toast').contains(document.activeElement))$('#searchTrigger').focus({preventScroll:true});$('#toast').inert=true;$('#toast').classList.remove('visible');}
function toggleTask(i){state.tasks[i]=!state.tasks[i];save();const row=document.querySelector(`[data-task-row="${i}"]`);row?.classList.toggle('checked',state.tasks[i]);row?.querySelector('button').setAttribute('aria-checked',state.tasks[i]);if($('#taskCount'))$('#taskCount').textContent=taskSummary();toast(state.tasks[i]?'Aufgabe erledigt':'Aufgabe wieder offen',()=>{state.tasks[i]=!state.tasks[i];save();render(false);});}
function timerText(){return `${Math.floor(state.remaining/60).toString().padStart(2,'0')}:${(state.remaining%60).toString().padStart(2,'0')}`;}
let deadline=0;setInterval(()=>{if(!state.running)return;state.remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if($('#timer'))$('#timer').textContent=timerText();if(state.remaining===0){state.running=false;if($('#timerToggle'))$('#timerToggle').textContent='Neu starten';toast('25 Minuten sind vorbei. Lernblock erledigt?');}},250);
const commands=[
{title:'Hausaufgaben',sub:'Aufgaben für Dienstag',icon:'task',to:'tasks',terms:'hausaufgabe aufgaben morgen deutsch gedichtanalyse englisch vokabeln s. 84 nr. 3 5'},
{title:'Blatt aufnehmen',sub:'Ein Foto zu deinen Materialien legen',icon:'camera',to:'camera',terms:'kamera foto scan fotografieren hinzufügen'},
{title:'Mathematik-Klausur',sub:'16. Oktober · Quadratische Funktionen',icon:'book',to:'exam',terms:'mathe klausuren prüfung lernplan lernen scheitelpunktform freitag'},
{title:'Wissen abrufen',sub:'Scheitelpunktform abfragen',icon:'book',to:'recall',terms:'lernen karteikarten üben quiz wiederholen'},
{title:'Stundenplan',sub:'Stunden und Räume nachsehen',icon:'calendar',to:'week',terms:'stunden woche unterricht raum morgen dienstag montag biologie'},
{title:'Noten',sub:'Mathematik: 2, 3+, 2−',icon:'grade',to:'grades',terms:'mathe zensuren leistung'},
{title:'Material',sub:'Deine Blätter und Abschriften',icon:'file',to:'material',terms:'materialien dokumente blatt ablage'},
{title:'Fächer',sub:'Mathe, Deutsch, Biologie, Englisch',icon:'subjects',to:'subjects',terms:'fach unterricht'},
{title:'Heute',sub:'16:40 zu Hause · Aufgaben und Lernen',icon:'home',to:'home',terms:'start zuhause jetzt'}];
function normalize(t){return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function results(){const q=normalize(query.value.trim());visibleCommands=commands.filter(c=>!q||q.split(/\s+/).every(w=>normalize(`${c.title} ${c.sub} ${c.terms}`).includes(w)));if(q==='mathe'||q==='mathematik')visibleCommands.sort((a,b)=>(a.to==='exam'?-1:b.to==='exam'?1:0));activeResult=0;$('#resultLabel').textContent=q?`${visibleCommands.length} ${visibleCommands.length===1?'Treffer':'Treffer'}`:'Wohin möchtest du?';$('#results').innerHTML=visibleCommands.length?visibleCommands.map((c,i)=>`<button class="result" role="option" id="result-${i}" aria-selected="${i===activeResult}" data-go="${c.to}" tabindex="-1">${icon(c.icon)}<span><strong>${c.title}</strong><small>${c.sub}</small></span>${icon('return')}</button>`).join(''):`<div class="no-results">Nichts gefunden.<small>Versuch es mit „Mathe“, „Aufgaben“ oder „Kamera“.</small></div>`;syncActive();}
function syncActive(){document.querySelectorAll('.result').forEach((el,i)=>el.setAttribute('aria-selected',i===activeResult));if(visibleCommands.length)query.setAttribute('aria-activedescendant',`result-${activeResult}`);else query.removeAttribute('aria-activedescendant');}
function openSearch(){query.value='';results();if(!palette.open)palette.showModal();query.focus();}
$('#searchIcon').innerHTML=icon('search');$('#paletteIcon').innerHTML=icon('search');$('#cameraButton').innerHTML=icon('camera');$('#clearSearch').innerHTML=icon('close');$('#searchTrigger').addEventListener('click',openSearch);$('#closeSearch').addEventListener('click',()=>palette.close());$('#clearSearch').addEventListener('click',()=>{query.value='';results();query.focus();});query.addEventListener('input',results);$('#searchForm').addEventListener('submit',e=>{e.preventDefault();if(visibleCommands[activeResult])go(visibleCommands[activeResult].to);});query.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();if(!visibleCommands.length)return;activeResult=(activeResult+(e.key==='ArrowDown'?1:-1)+visibleCommands.length)%visibleCommands.length;syncActive();$(`#result-${activeResult}`)?.scrollIntoView({block:'nearest'});}});palette.addEventListener('click',e=>{if(e.target===palette){const r=palette.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)palette.close();}});palette.addEventListener('close',()=>$('#searchTrigger').focus({preventScroll:true}));
$('#undoButton').addEventListener('click',()=>{undoAction?.();hideToast();undoAction=null;});
document.addEventListener('pointerdown',()=>keyboard=false);document.addEventListener('keydown',e=>{keyboard=true;if(e.target.matches('[data-day]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();weekDay=e.key==='Home'?0:e.key==='End'?4:(weekDay+(e.key==='ArrowRight'?1:-1)+5)%5;render(false);document.querySelector(`[data-day="${weekDay}"]`).focus();return;}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette.open?palette.close():openSearch();}if(e.key==='Escape'&&!palette.open&&current!=='home')back();});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){if(b.dataset.weekDay!==undefined)weekDay=Number(b.dataset.weekDay);if(b.dataset.go==='recall')answerVisible=false;go(b.dataset.go);return;}if(b.dataset.toggle!==undefined){toggleTask(Number(b.dataset.toggle));return;}if(b.dataset.day!==undefined){weekDay=Number(b.dataset.day);render(false);document.querySelector(`[data-day="${weekDay}"]`).focus();return;}if(b.dataset.subject!==undefined){selectedSubject=Number(b.dataset.subject);go('subject');return;}if(b.dataset.sheet!==undefined){sheetIndex=Number(b.dataset.sheet);go('sheet');return;}switch(b.dataset.action){case'back':back();break;case'capture':go('review');break;case'timer':if(!state.remaining)state.remaining=1500;state.running=!state.running;if(state.running)deadline=Date.now()+state.remaining*1000;b.textContent=state.running?'Pausieren':'Weiterlernen';break;case'complete-study':state.learned=true;state.running=false;save();go('exam');toast('Lernblock erledigt',()=>{state.learned=false;save();render(false);});break;case'answer':answerVisible=true;render(false);$('#answer').focus({preventScroll:true});break;case'again':answerVisible=false;render(false);document.querySelector('[data-action="answer"]').focus({preventScroll:true});break;case'understood':go('learn');toast('Antwort geprüft');break;}});
document.addEventListener('submit',e=>{if(e.target.id!=='sheetForm')return;e.preventDefault();const data=new FormData(e.target);const title=String(data.get('title')).trim();if(!title){e.target.elements.title.setCustomValidity('Gib dem Blatt einen Titel.');e.target.elements.title.reportValidity();return;}state.sheets.unshift({title,subject:String(data.get('subject'))});save();go('material');toast('Blatt abgelegt');});document.addEventListener('input',e=>{if(e.target.name==='title')e.target.setCustomValidity('');});
if(window.visualViewport){const resize=()=>{const inset=Math.max(0,innerHeight-visualViewport.height-visualViewport.offsetTop);palette.style.bottom=inset>100?`${inset+10}px`:'';};visualViewport.addEventListener('resize',resize);visualViewport.addEventListener('scroll',resize);}
render(false);
</script>
</body>
</html>
