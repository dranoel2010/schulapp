<main class="app" id="app" aria-label="Fokus Schulapp">
  <div class="statusbar" aria-label="16:40 Uhr"><span>16:40</span><span class="status-icons" aria-hidden="true"><svg viewBox="0 0 18 16" fill="currentColor"><rect x="1" y="10" width="3" height="5" rx=".7"/><rect x="6" y="6" width="3" height="9" rx=".7"/><rect x="11" y="2" width="3" height="13" rx=".7"/></svg><svg viewBox="0 0 20 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 5q8-7 16 0M5 8q5-4 10 0m-7 3q2-2 4 0"/><circle cx="10" cy="14" r=".7" fill="currentColor"/></svg><span class="battery"></span></span></div>
  <section class="home" id="home" aria-label="Heute">
    <header class="home-head"><div><p class="date">Montag, 12. Oktober · zu Hause</p><h1>Heute.</h1></div><button class="camera-shortcut" data-go="capture" aria-label="Blatt aufnehmen"><svg class="icon"><use href="#i-camera"/></svg><span>Blatt<br>aufnehmen</span></button></header>

    <div class="stack-heading"><span>Für deinen Nachmittag</span><span id="stack-count">3 Dinge im Stapel</span></div>
    <div class="deck" id="deck" aria-live="polite"></div>
    <div class="actions"><button class="action" id="later" data-action="later"><svg class="icon"><use href="#i-left"/></svg>Später</button><button class="action primary" id="done" data-action="done"><svg class="icon"><use href="#i-check"/></svg>Erledigt</button></div>

  </section>
  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <section class="sheet" id="sheet" aria-label="Übersicht">
    <button class="sheet-handle" id="handle" aria-label="Übersicht aufziehen" aria-expanded="false"></button>
    <button class="sheet-peek" id="peek" aria-expanded="false"><span><span class="peek-label">Übersicht</span><span class="peek-description" style="display:block">Hausaufgaben, Lernen und Blätter</span></span><svg class="icon"><use href="#i-up"/></svg></button>

  </section>
  <div class="toast" id="toast"><span id="toast-text" role="status"></span><button id="undo" data-action="undo" tabindex="-1">Rückgängig</button></div>
  <div class="home-indicator" aria-hidden="true"></div>
  <div class="sr-only" id="announce" role="status"></div>
</main>
<script>
'use strict';
const $=s=>document.querySelector(s), icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const app=$('#app'),home=$('#home'),sheet=$('#sheet'),panel=$('#panel'),deck=$('#deck'),scrim=$('#scrim');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let keyboard=false,queue=['math','german','study'],completed=new Set(['english']),deferred=new Set(),history=[],screen='overview',opened=false,lastFocus=null,toastTimer,cardMotion=null,captureSaved=false,recallShown=false;
const tasks={math:{subject:'Mathematik',title:'S. 84,<br>Nr. 3–5',plain:'S. 84, Nr. 3–5',due:'Für morgen',type:'Hausaufgabe',date:'Di, 13.10.',icon:'book'},german:{subject:'Deutsch',title:'Gedichtanalyse<br>beenden',plain:'Gedichtanalyse beenden',due:'Für morgen',type:'Hausaufgabe',date:'Di, 13.10.',icon:'book'},study:{subject:'Mathematik',title:'Scheitelpunkt&shy;form',plain:'Scheitelpunktform',due:'Heute',type:'Lernblock · 25 Minuten',date:'',icon:'clock'},english:{subject:'Englisch',plain:'Vokabeln Unit 3'}};
// Native Pointer Events keep both gestures attached to the finger. Springs can be grabbed again.
function spring(state,target,paint,finish,velocity=state.v||0,response=.3,damping=1){
  if(state.frame)cancelAnimationFrame(state.frame);state.v=velocity;state.target=target;state.finish=finish;
  if(reduced.matches||keyboard){state.x=target;state.v=0;paint();finish?.();return}
  const omega=2*Math.PI/response;let last=performance.now();
  function frame(now){let remaining=Math.min((now-last)/1000,.035);last=now;while(remaining>0){const dt=Math.min(remaining,1/120);state.v+=(-omega*omega*(state.x-state.target)-2*damping*omega*state.v)*dt;state.x+=state.v*dt;remaining-=dt}paint();if(Math.abs(state.x-state.target)<.3&&Math.abs(state.v)<3){state.x=state.target;state.v=0;state.frame=0;paint();state.finish?.()}else state.frame=requestAnimationFrame(frame)}
  state.frame=requestAnimationFrame(frame);
}
function escapeText(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function announce(text){$('#announce').textContent=text}
function renderDeck(){
  if(cardMotion?.frame)cancelAnimationFrame(cardMotion.frame);
  $('#study-status').textContent=completed.has('study')?'Lernblock heute erledigt':'Heute 25 Minuten lernen';
  const id=queue[0],task=tasks[id];$('#stack-count').textContent=queue.length?`${queue.length} ${queue.length===1?'Sache':'Dinge'} im Stapel`:'Alles erledigt';
  $('#later').disabled=!task;$('#done').disabled=!task;
  if(!task){deck.innerHTML=`<div class="empty-stack">${icon('check')}<h2>Für heute<br>abgehakt.</h2><p>Deine erledigten Aufgaben findest du in der Übersicht.</p><button class="text-button" data-go="homework" style="margin-top:18px">Hausaufgaben ansehen ${icon('right')}</button></div>`;return}
  deck.innerHTML=`${queue.length>2?'<div class="paper-under"></div>':''}${queue.length>1?'<div class="paper-under second"></div>':''}<article class="task-card" id="task-card" aria-label="${task.subject}: ${task.plain}. Nach rechts erledigen, nach links verschieben."><div class="card-top"><span class="subject">${icon(task.icon)}${task.subject}</span><span class="due">${deferred.has(id)?'Nach hinten gelegt':task.due}</span></div><h2 class="${id!=='math'?'small':''}">${task.title}</h2>${id==='study'?`<p class="card-note">Für die Klausur am Freitag</p><button class="text-button" data-go="recall" style="margin-bottom:12px">Wissen abrufen ${icon('right')}</button>`:''}<div class="card-foot"><span>${task.type}</span>${id==='study'?`<button class="text-button" data-go="exam">Lernplan ${icon('right')}</button>`:`<span>${task.date}</span>`}</div><div class="swipe-stamp" id="stamp-done">Erledigt</div><div class="swipe-stamp later" id="stamp-later">Später</div></article>`;
  wireCard($('#task-card'),id);
}
function remember(){history.push({queue:[...queue],completed:[...completed],deferred:[...deferred]});if(history.length>20)history.shift()}
function notify(text,undo=true){clearTimeout(toastTimer);$('#toast-text').textContent=text;$('#undo').hidden=!undo;$('#undo').tabIndex=undo?0:-1;$('#toast').classList.add('show');toastTimer=setTimeout(hideToast,6500)}
function hideToast(){if($('#toast').contains(document.activeElement)){(opened?$('#handle'):$('#done')).focus({preventScroll:true})}$('#toast').classList.remove('show');$('#undo').tabIndex=-1}
function commitCard(id,direction){remember();if(direction>0){completed.add(id);deferred.delete(id);queue=queue.filter(x=>x!==id)}else{queue=queue.filter(x=>x!==id);queue.push(id);deferred.add(id)}renderDeck();notify(direction>0?`${tasks[id].subject}: erledigt`:'Ans Ende des Stapels gelegt');if(opened)renderPanel(screen,false)}
function wireCard(el,id){
  const state={x:0,v:0,frame:0};cardMotion=state;let drag=null;
  function paint(){el.style.transform=reduced.matches?'none':`translateX(${state.x}px) rotate(${state.x/23}deg)`;$('#stamp-done').style.opacity=Math.max(0,Math.min(1,state.x/90));$('#stamp-later').style.opacity=Math.max(0,Math.min(1,-state.x/90));el.style.opacity=reduced.matches?1:Math.max(.15,1-Math.max(0,Math.abs(state.x)-180)/380)}
  state.go=direction=>{state.direction=direction;spring(state,direction*(app.clientWidth+70),paint,()=>commitCard(id,direction),state.v,.3,1)};
  el.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0||e.target.closest('button'))return;if(state.frame)cancelAnimationFrame(state.frame);state.frame=0;state.finish=null;drag={id:e.pointerId,x:e.clientX,y:e.clientY,base:state.x,last:e.clientX,time:e.timeStamp,v:0,moved:false};el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.abs(dx)<8)return;if(!drag.moved&&Math.abs(dy)>Math.abs(dx)){drag=null;spring(state,0,paint);return}drag.moved=true;const dt=e.timeStamp-drag.time;if(dt>0)drag.v=(e.clientX-drag.last)/dt*1000;drag.last=e.clientX;drag.time=e.timeStamp;state.x=drag.base+dx;state.v=drag.v;paint()});
  function release(e,cancel=false){if(!drag||drag.id!==e.pointerId)return;const active=drag;drag=null;const velocity=e.timeStamp-active.time>90?0:active.v;const projected=state.x+velocity*.12;if(!cancel&&active.moved&&Math.abs(projected)>95){state.v=velocity;state.go(Math.sign(projected))}else spring(state,0,paint,null,velocity,.3,1)}
  el.addEventListener('pointerup',e=>release(e));el.addEventListener('pointercancel',e=>release(e,true));
}
function toggleTask(id){remember();if(completed.has(id)){completed.delete(id);if(!queue.includes(id)&&id!=='english')queue.push(id);notify(`${tasks[id].subject}: wieder offen`)}else{completed.add(id);queue=queue.filter(x=>x!==id);notify(`${tasks[id].subject}: erledigt`)}renderDeck();const focusId=`check-${id}`;renderPanel(screen,false);document.getElementById(focusId)?.focus({preventScroll:true})}
function undo(){const prev=history.pop();if(!prev)return;queue=prev.queue;completed=new Set(prev.completed);deferred=new Set(prev.deferred);renderDeck();if(opened)renderPanel(screen,false);notify('Zurückgenommen',false)}
const drawer={x:0,v:0,frame:0};const closedY=()=>sheet.clientHeight-104-Math.max(0,parseFloat(getComputedStyle(app).getPropertyValue('--safe-bottom'))||0);
function paintDrawer(){sheet.style.transform=`translateY(${drawer.x}px)`;const p=1-Math.max(0,Math.min(1,drawer.x/closedY()));scrim.style.opacity=p*.15;home.style.transform=reduced.matches?'none':`scale(${1-p*.035}) translateY(${-p*5}px)`}
function drawerState(open){opened=open;sheet.classList.toggle('is-open',open);app.classList.toggle('panel-open',open);home.inert=open;panel.inert=!open;$('#handle').setAttribute('aria-expanded',String(open));$('#peek').setAttribute('aria-expanded',String(open));$('#handle').setAttribute('aria-label',open?'Übersicht schließen':'Übersicht aufziehen');scrim.style.pointerEvents=open?'auto':'none';if(open){sheet.setAttribute('role','dialog');sheet.setAttribute('aria-modal','true')}else{sheet.removeAttribute('role');sheet.removeAttribute('aria-modal')}}
function openPanel(to='overview'){lastFocus=document.activeElement;renderPanel(to);drawerState(true);spring(drawer,0,paintDrawer);$('#panel-heading')?.focus({preventScroll:true})}
function closePanel(){drawerState(false);spring(drawer,closedY(),paintDrawer);(lastFocus&&lastFocus.isConnected?lastFocus:$('#peek')).focus({preventScroll:true});hideToast()}
function panelHeader(back=true){return `<div class="panel-header"><button ${back?'data-go="overview"':'data-action="close"'}>${icon('left')}${back?'Übersicht':'Zum Stapel'}</button><button class="close" data-action="close" aria-label="Schließen">${icon('close')}</button></div>`}
function heading(title,sub=''){return `<h2 class="panel-title" id="panel-heading" tabindex="-1">${title}</h2>${sub?`<p class="panel-sub">${sub}</p>`:''}`}
function row(go,symbol,title,desc,count=''){return `<button class="overview-row" data-go="${go}"><span class="nav-symbol">${icon(symbol)}</span><span class="row-copy"><strong>${escapeText(title)}</strong><small>${escapeText(desc)}</small></span>${count?`<span class="count">${count}</span>`:icon('chevron')}</button>`}
function check(id,label){return `<button class="check" id="check-${id}" data-check="${id}" aria-label="${label}" aria-pressed="${completed.has(id)}">${completed.has(id)?icon('check'):''}</button>`}
function homeworkRow(id){return `<div class="task-row ${completed.has(id)?'done':''}">${check(id,`${tasks[id].subject}: ${tasks[id].plain}`)}<div class="row-copy"><strong>${tasks[id].plain}</strong><small>${tasks[id].subject}${id==='english'?(completed.has(id)?' · gestern erledigt':' · wieder offen'):''}</small></div></div>`}
function renderPanel(to,animate=true){
  screen=to;panel.scrollTop=0;let html=panelHeader(to!=='overview');
  if(to==='overview'){const n=['math','german'].filter(id=>!completed.has(id)).length;html+=`<div class="overview-intro">${heading('Übersicht','Montag, 12. Oktober 2026')}</div>`+row('homework','list','Hausaufgaben',n?`${n} für Dienstag`:'Alles erledigt',String(n))+row('exam','clock','Klausur & Lernplan','Mathematik am Freitag')+row('material','file','Material',captureSaved?'1 Blatt abgelegt':'Blätter aufnehmen und nachlesen')+row('recall','stack','Wissen abrufen','Quadratische Funktionen')+`<p class="section-label">Nachschlagen</p>`+row('schedule','calendar','Stundenplan','Unterricht und Räume ansehen')+row('grades','bars','Fächer & Noten','Mathematik, Deutsch, Biologie, Englisch');}
  else if(to==='homework'){html+=heading('Hausaufgaben','Für Dienstag, 13. Oktober')+homeworkRow('math')+homeworkRow('german')+`<button class="open-in-stack" data-action="homework-stack">Einzeln durchgehen ${icon('right')}</button><p class="section-label">Von gestern</p>`+homeworkRow('english');}
  else if(to==='schedule'){html+=heading('Stundenplan','Montag, 12. Oktober · Unterricht beendet')+`<div class="date-strip" aria-label="Schulwoche"><div class="day selected" aria-current="date">Mo<strong>12</strong></div><div class="day">Di<strong>13</strong></div><div class="day">Mi<strong>14</strong></div><div class="day">Do<strong>15</strong></div><div class="day">Fr<strong>16</strong></div></div><div class="schedule-row"><div class="schedule-time">08:00<small>09:30</small></div><div class="lesson"><h3>Deutsch</h3><p>Raum 104</p></div></div><div class="schedule-row"><div class="schedule-time">09:50<small>11:20</small></div><div class="lesson"><h3>Mathematik</h3><p>Raum 208</p></div></div><div class="schedule-row"><div class="schedule-time">11:40<small>13:10</small></div><div class="lesson"><h3>Biologie</h3><p>Bio 1</p></div></div><div class="school-end">Schulschluss war um 13:10.<small>Beispielplan für Montag</small></div>`;}
  else if(to==='exam'){html+=heading('Mathematik','Klausur')+`<div class="exam-date"><span>Freitag, 16. Oktober</span><span>In 4 Tagen</span></div><h3 class="exam-topic">Quadratische<br>Funktionen</h3><p class="section-label">Dein Lernplan</p><div class="plan-row ${completed.has('study')?'complete':''}"><div class="plan-date">Heute<br>12.10.</div><div class="plan-copy"><h3>Scheitelpunktform</h3><p>25 Minuten</p></div>${check('study','Lernblock Scheitelpunktform erledigt')}</div><div class="plan-row"><div class="plan-date">Mi<br>14.10.</div><div class="plan-copy"><h3>Wiederholung</h3><p>Quadratische Funktionen</p></div></div><div class="plan-row"><div class="plan-date">Do<br>15.10.</div><div class="plan-copy"><h3>Probeklausur</h3><p>Aufgaben selbstständig lösen</p></div></div><button class="wide-button" data-action="study-stack">${icon('stack')}Lernblock in den Fokus</button><p class="quiet-note">Die Uhrzeit bestimmst du.</p>`;}
  else if(to==='capture'){html+=heading('Blatt aufnehmen','Das ganze Blatt in den Rahmen legen.')+`<div class="camera-view" role="img" aria-label="Angedeutete Kamera mit einem Mathe-Arbeitsblatt"><div class="sample-sheet" aria-hidden="true"><h3>Quadratische Funktionen</h3><p>Mathematik · Klasse 10<br>Die Scheitelpunktform</p><div class="formula">f(x) = a(x − d)² + e</div><p>Der Scheitelpunkt liegt bei S(d | e).</p><div class="rule"></div><div class="rule"></div><div class="rule"></div></div><span class="camera-caption">Kameravorschau im Entwurf</span></div><div class="shutter-row"><span class="shutter-label">Eine Seite<br>aufnehmen</span><button class="shutter" data-go="capture-review" aria-label="Beispielblatt fotografieren"></button><button class="icon-button" data-go="material" aria-label="Material öffnen">${icon('file')}</button></div>`;}
  else if(to==='capture-review'){html=panelHeader()+heading('Aufnahme prüfen','Beispielaufnahme · 1 Seite')+`<div class="capture-preview"><h3>Quadratische Funktionen</h3><p>f(x) = a(x − d)² + e</p><p>Der Scheitelpunkt liegt bei S(d | e).</p></div><form id="capture-form"><div class="field"><label for="sheet-title">Titel</label><input id="sheet-title" required maxlength="100" value="Quadratische Funktionen"></div><div class="field"><label for="sheet-subject">Fach</label><select id="sheet-subject"><option>Mathematik</option><option>Deutsch</option><option>Biologie</option><option>Englisch</option></select></div><button class="wide-button" type="submit">Blatt ablegen ${icon('check')}</button></form><button class="wide-button secondary" data-go="capture">Neu aufnehmen</button>`;}
  else if(to==='material'){html+=heading('Material',captureSaved?'1 Blatt in deiner Ablage':'Noch keine Blätter abgelegt.')+(captureSaved?row('transcript','file',savedTitle,`${savedSubject} · 1 Seite`):`<p class="quiet-note" style="margin-top:34px">Fotografiere ein Arbeitsblatt. Danach kannst du es einem Fach zuordnen.</p>`)+`<button class="wide-button" data-go="capture">${icon('camera')}Blatt aufnehmen</button>`;}
  else if(to==='transcript'){html=panelHeader()+heading(escapeText(savedTitle),`${escapeText(savedSubject)} · 12. Oktober`)+`<p class="section-label">Abschrift der Beispielaufnahme</p><div class="capture-preview"><h3>Die Scheitelpunktform</h3><p>f(x) = a(x − d)² + e</p><p>Der Scheitelpunkt liegt bei S(d | e). Der Faktor a bestimmt die Öffnung der Parabel.</p></div><button class="wide-button secondary" data-go="material">Zur Ablage</button>`;}
  else if(to==='grades'){html+=heading('Fächer & Noten','10. Klasse')+`<p class="section-label">Mathematik</p><div class="grade-list"><span>2<small>Note</small></span><span>3+<small>Note</small></span><span>2−<small>Note</small></span></div>`+row('exam','clock','Nächste Klausur','Freitag, 16. Oktober')+`<p class="section-label">Weitere Fächer</p><div class="task-row"><div class="row-copy"><strong>Deutsch</strong><small>Keine Noten eingetragen</small></div></div><div class="task-row"><div class="row-copy"><strong>Biologie</strong><small>Keine Noten eingetragen</small></div></div><div class="task-row"><div class="row-copy"><strong>Englisch</strong><small>Keine Noten eingetragen</small></div></div>`;}
  else if(to==='recall'){html+=heading('Wissen abrufen','Mathematik · Beispielkarte')+`<p class="recall-question">Wo liegt der Scheitelpunkt von<br>f(x) = (x − 3)² + 2?</p>${recallShown?`<div class="recall-answer">S(3 | 2)<p class="quiet-note">In der Form f(x) = a(x − d)² + e liegt der Scheitel bei S(d | e).</p></div><button class="wide-button" data-action="recall-done">${icon('check')}Gewusst</button><button class="wide-button secondary" data-action="recall-again">Noch einmal üben</button>`:`<button class="wide-button" data-action="recall-reveal">Antwort zeigen</button>`}`;}
  panel.innerHTML=html;
  if(animate&&!reduced.matches&&!keyboard)panel.animate([{opacity:.4,transform:'translateY(9px)'},{opacity:1,transform:'translateY(0)'}],{duration:180,easing:'cubic-bezier(.23,1,.32,1)'});
  sheet.setAttribute('aria-label',$('#panel-heading')?.textContent||'Übersicht');
}
let savedTitle='Quadratische Funktionen',savedSubject='Mathematik';
app.addEventListener('submit',e=>{if(e.target.id!=='capture-form')return;e.preventDefault();const title=$('#sheet-title').value.trim();if(!title){$('#sheet-title').setCustomValidity('Gib einen Titel ein.');$('#sheet-title').reportValidity();return}savedTitle=title;savedSubject=$('#sheet-subject').value;captureSaved=true;renderPanel('material');$('#panel-heading').focus({preventScroll:true});notify('Blatt abgelegt',false)});
app.addEventListener('input',e=>{if(e.target.id==='sheet-title')e.target.setCustomValidity('')});
app.addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button)return;
  if(button.dataset.go){if(opened){renderPanel(button.dataset.go);$('#panel-heading')?.focus({preventScroll:true})}else openPanel(button.dataset.go);return}
  if(button.dataset.check){toggleTask(button.dataset.check);return}
  const action=button.dataset.action;
  if(action==='done'||action==='later'){if(queue[0])cardMotion.go(action==='done'?1:-1)}
  if(action==='undo')undo();
  if(action==='close')closePanel();
  if(action==='homework-stack'){const first=['math','german'].find(id=>!completed.has(id));if(first){queue=[first,...queue.filter(x=>x!==first)];renderDeck()}closePanel()}
  if(action==='study-stack'){if(completed.has('study')){notify('Lernblock bereits erledigt',false);return}queue=['study',...queue.filter(x=>x!=='study')];renderDeck();closePanel()}
  if(action==='recall-reveal'){recallShown=true;renderPanel('recall');$('#panel-heading').focus({preventScroll:true})}
  if(action==='recall-again'){recallShown=false;renderPanel('recall');$('#panel-heading').focus({preventScroll:true})}
  if(action==='recall-done'){recallShown=false;renderPanel('overview');$('#panel-heading').focus({preventScroll:true});notify('Beispielkarte beantwortet',false)}
});
let drawerDrag=null,suppressClick=false;
for(const handle of [$('#handle'),$('#peek')]){
  handle.addEventListener('click',()=>{if(suppressClick){suppressClick=false;return}opened?closePanel():openPanel()});
  handle.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;if(drawer.frame)cancelAnimationFrame(drawer.frame);drawer.finish=null;drawerDrag={id:e.pointerId,y:e.clientY,base:drawer.x,last:e.clientY,time:e.timeStamp,v:0,moved:false,wasOpen:opened};handle.setPointerCapture(e.pointerId)});
  handle.addEventListener('pointermove',e=>{if(!drawerDrag||e.pointerId!==drawerDrag.id)return;const d=drawerDrag,dy=e.clientY-d.y;if(Math.abs(dy)<6&&!d.moved)return;if(!d.moved&&!opened){lastFocus=handle;renderPanel('overview',false);drawerState(true)}d.moved=true;const dt=e.timeStamp-d.time;if(dt>0)d.v=(e.clientY-d.last)/dt*1000;d.last=e.clientY;d.time=e.timeStamp;let y=d.base+dy;drawer.x=y<0?y*.18:y>closedY()?closedY()+(y-closedY())*.18:y;paintDrawer()});
  function release(e,cancel){if(!drawerDrag||e.pointerId!==drawerDrag.id)return;const d=drawerDrag;drawerDrag=null;if(!d.moved){spring(drawer,opened?0:closedY(),paintDrawer);return}suppressClick=true;setTimeout(()=>suppressClick=false,0);const velocity=e.timeStamp-d.time>90?0:d.v;const shouldOpen=cancel?d.wasOpen:drawer.x+velocity*.15<closedY()*.65;drawerState(shouldOpen);spring(drawer,shouldOpen?0:closedY(),paintDrawer,null,velocity,.3,1);if(shouldOpen)$('#panel-heading')?.focus({preventScroll:true});else $('#peek').focus({preventScroll:true})}
  handle.addEventListener('pointerup',e=>release(e,false));handle.addEventListener('pointercancel',e=>release(e,true));
}
scrim.addEventListener('click',closePanel);
document.addEventListener('pointerdown',()=>{keyboard=false;app.classList.remove('keyboard')},{capture:true});
document.addEventListener('keydown',e=>{keyboard=true;app.classList.add('keyboard');if(e.key==='Escape'&&opened){e.preventDefault();closePanel()}if(e.key==='Tab'&&opened){const list=[...sheet.querySelectorAll('button,input,select,[tabindex="0"]')].filter(el=>!el.disabled&&el.getClientRects().length);if($('#toast').classList.contains('show')&&!$('#undo').hidden)list.push($('#undo'));const first=list[0],last=list.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#panel-heading'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
new ResizeObserver(()=>{if(!drawerDrag){if(drawer.frame)cancelAnimationFrame(drawer.frame);drawer.x=opened?0:closedY();paintDrawer()}}).observe(app);
renderDeck();drawer.x=closedY();paintDrawer();
</script>
</body>
</html>
