<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111113">
<meta name="color-scheme" content="light dark">
<title>Schreibtisch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --group:#efeff1; --press:#e7e7ea; --line:#e2e2e6; --line-2:#d3d3d9;
  --text:#17171a; --text-2:#55555d; --text-3:#72727b;
  --accent:#c8174f; --accent-soft:rgba(200,23,79,.08); --accent-ink:#ffffff;
  --done:#5d5d66; --done-ink:#ffffff; --danger:#d93636;
  --toast-bg:#1d1d21; --toast-fg:#f4f4f6;
  --scrim:rgba(18,18,22,.18); --dimc:rgba(30,30,40,.10);
  --shadow:0 1px 0 rgba(20,20,30,.04), 0 8px 24px -6px rgba(20,20,40,.18), 0 0 0 1px rgba(20,20,40,.06);
  --ma:#4f6bed; --de:#d08a22; --bi:#2f9466; --en:#8466e8; --ge:#9a6b3f; --ph:#2a8fb0; --sp:#6f8f2c;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --sat:max(env(safe-area-inset-top,0px),47px);
  --sab:max(env(safe-area-inset-bottom,0px),22px);
  --sans:"Archivo",system-ui,sans-serif;
  --math:"STIX Two Text",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111113; --panel:#1b1b1e; --group:#1f1f23; --press:#222226; --line:#26262b; --line-2:#34343a;
    --text:#ececef; --text-2:#a2a2ab; --text-3:#83838c;
    --accent:#e8457a; --accent-soft:rgba(232,69,122,.10); --accent-ink:#1a0710;
    --done:#9a9aa3; --done-ink:#141416; --danger:#ef5f5f;
    --toast-bg:#2a2a2f; --toast-fg:#ececef;
    --scrim:rgba(0,0,0,.45); --dimc:rgba(0,0,0,.45);
    --shadow:0 0 0 1px rgba(255,255,255,.07), 0 12px 32px -8px rgba(0,0,0,.7);
    --ma:#7d93ff; --de:#e5a64a; --bi:#4cb985; --en:#a58cff; --ge:#c8956a; --ph:#4fb6d6; --sp:#98b84f;
  }
}
:root[data-theme="dark"]{
  --bg:#111113; --panel:#1b1b1e; --group:#1f1f23; --press:#222226; --line:#26262b; --line-2:#34343a;
  --text:#ececef; --text-2:#a2a2ab; --text-3:#83838c;
  --accent:#e8457a; --accent-soft:rgba(232,69,122,.10); --accent-ink:#1a0710;
  --done:#9a9aa3; --done-ink:#141416; --danger:#ef5f5f;
  --toast-bg:#2a2a2f; --toast-fg:#ececef;
  --scrim:rgba(0,0,0,.45); --dimc:rgba(0,0,0,.45);
  --shadow:0 0 0 1px rgba(255,255,255,.07), 0 12px 32px -8px rgba(0,0,0,.7);
  --ma:#7d93ff; --de:#e5a64a; --bi:#4cb985; --en:#a58cff; --ge:#c8956a; --ph:#4fb6d6; --sp:#98b84f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.35;overscroll-behavior:none;height:100dvh;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;text-align:left}
input,textarea{font:inherit;font-size:16px;color:var(--text)}
:focus-visible{outline:2px solid var(--text-3);outline-offset:2px;border-radius:6px}

#app{position:relative;width:100%;max-width:430px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.statusbar{height:var(--sat);flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 9px 34px;font-weight:600;font-size:15px}
.statusbar .sb-r{display:flex;gap:6px;align-items:center}
.statusbar svg{display:block}

#main{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.view[hidden]{display:none}
.dim{position:absolute;inset:0;background:var(--dimc);opacity:0;pointer-events:none;z-index:8}
.vhead{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.vhead h1{font-size:19px;font-weight:620;letter-spacing:-.012em;font-stretch:96%}
.vhead .meta{margin-left:auto;font-size:13px;color:var(--text-2)}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:28px}

/* section heads: no band, hairline below */
.sec{display:flex;align-items:baseline;gap:7px;margin:0 16px;padding:28px 0 8px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--text-2)}
.scroll > .sec:first-child,.dayc > .sec:first-child,#bl-list > .sec:first-child{padding-top:16px}
.n{font-weight:500;color:var(--text-3);display:inline-block;overflow:hidden;height:17px;line-height:17px;vertical-align:bottom}
.n span{display:block}
.sec.foldw{border-bottom:0;padding:18px 0 0}
.fold{min-height:44px;display:inline-flex;align-items:center;gap:5px;margin-left:-8px;padding:0 8px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-2);transition:background-color 80ms ease}
.fold:active{background:var(--press)}
.fold .chev{color:var(--text-3);transition:transform 180ms var(--ease-out)}
.fold[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.grp-body[hidden]{display:none}

/* rows */
.row{position:relative;min-height:46px;display:flex;align-items:center;gap:12px;padding:0 16px 0 2px;width:100%;text-align:left;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;transition:transform 200ms var(--ease-out),background-color 80ms ease}
.row.pressing{transform:scale(.98);transition-duration:120ms,80ms}
.row:active,.row.pressing,.row.held{background:var(--press)}
.row.sw{padding:0;overflow:hidden}
.row.sw:active,.row.sw.pressing,.row.sw.held{background:transparent}
.rin{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 16px 0 2px;background:var(--bg);position:relative;z-index:1;transition:background-color 80ms ease}
.row.sw:active .rin,.row.sw.pressing .rin,.row.sw.held .rin{background:var(--press)}
.act{position:absolute;inset:0;display:none;align-items:center;gap:8px;padding:0 22px;font-size:13px;font-weight:600;background:var(--group);color:var(--text-2);transition:background-color 120ms ease,color 120ms ease}
.act svg{transition:transform 160ms var(--ease-out)}
.act-r{justify-content:flex-start}
.act-l{justify-content:flex-end}
.row[data-swipe="r"] .act-r,.row[data-swipe="l"] .act-l{display:flex}
.row.armed .act-r{background:var(--done);color:var(--done-ink)}
.row.armed .act-l{background:var(--text);color:var(--bg)}
.row.armed .act svg{transform:scale(1.15)}
.row .t{flex:1;min-width:0;position:relative;font-size:15px;font-weight:460;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color 220ms ease}
.row .t .tx{position:relative}
.row .t .strike{position:absolute;left:-1px;right:-1px;top:54%;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:left center;transition:transform 260ms var(--ease-out)}
.row[data-done="true"] .t{color:var(--text-3)}
.row[data-done="true"] .t .strike{transform:scaleX(1)}
.row .t.t2{display:flex;flex-direction:column;gap:2px;white-space:normal}
.row .t.t2 > b,.row .t.t2 > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{font-size:12.5px;color:var(--text-2);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.row .r{display:flex;align-items:center;gap:8px;flex:none;color:var(--text-2);font-size:13px}
.lead{width:40px;height:44px;flex:none;display:flex;align-items:center;justify-content:flex-start;padding-left:14px;color:var(--text-2)}
.lead:active .sc{transform:scale(.82)}
.ic{width:44px;height:44px;flex:none;display:grid;place-items:center;color:var(--text-2);margin-right:-12px;border-radius:10px;transition:transform 120ms var(--ease-out),background-color 80ms ease}
.ic:active{transform:scale(.92);background:var(--press)}
.ic.play{color:var(--accent)}
.row.ex{min-height:62px}
.row.ex .t b{font-size:16px;font-weight:620;letter-spacing:-.006em}
.row.ex .lead{color:var(--accent)}
.row.add .t{color:var(--text-2)}
.top{padding:4px 0 0}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);font-weight:500;white-space:nowrap}
.sq{width:8px;height:8px;border-radius:2px;flex:none;background:var(--c,var(--text-3))}

/* status circle: only for tasks and study blocks */
.sc{width:16px;height:16px;position:relative;display:block;flex:none;transition:transform 140ms var(--ease-out)}
.sc svg{position:absolute;inset:0;overflow:visible}
.sc .ring{fill:none;stroke:var(--text-3);stroke-width:1.5}
.sc.plan .ring{stroke-dasharray:2.4 2.6}
.sc.today .ring{stroke:var(--accent);stroke-width:1.7}
.sc.half .ring{stroke:var(--de)}
.sc .half{fill:var(--de)}
.sc .fill{position:absolute;inset:0;border-radius:50%;background:var(--done);transform:scale(.4);opacity:0;transition:transform 260ms var(--ease-out),opacity 160ms ease}
.sc .chk{position:absolute;inset:0;color:var(--done-ink);clip-path:inset(0 100% 0 0);transition:clip-path 220ms var(--ease-out) 60ms}
[data-done="true"] .sc .fill{transform:scale(1);opacity:1}
[data-done="true"] .sc .chk{clip-path:inset(0 0 0 0)}
[data-done="true"] .sc .ring{stroke:var(--done)}
.sc.bump{animation:bump 320ms var(--ease-out)}
@keyframes bump{0%{transform:scale(.8)}55%{transform:scale(1.12)}100%{transform:scale(1)}}

/* key caps: only where a keyboard exists */
kbd{display:none;font-family:var(--sans);font-size:10.5px;font-weight:600;line-height:1;min-width:18px;height:18px;padding:0 5px;place-items:center;border-radius:4px;color:var(--text-2);background:var(--bg);border:1px solid var(--line-2);border-bottom-width:2px}
@media (hover:hover) and (pointer:fine){ kbd{display:inline-grid} }
kbd svg{display:block}

/* bottom bar */
.bar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px calc(var(--sab) + 4px);border-top:1px solid var(--line);background:var(--bg);position:relative;z-index:5}
.tabs{position:relative;display:grid;grid-template-columns:repeat(4,56px)}
.tab{position:relative;z-index:1;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:560;color:var(--text-3);transition:color 160ms ease,transform 120ms var(--ease-out)}
.tab:active{transform:scale(.94)}
.tab[aria-selected="true"]{color:var(--text)}
.tab-ind{position:absolute;left:0;top:0;width:56px;height:48px;border-radius:10px;background:var(--group);transition:transform 240ms var(--ease-out)}
.btn{height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border-radius:10px;font-size:14px;font-weight:560;transition:transform 120ms var(--ease-out),background-color 80ms ease}
.btn:active{transform:scale(.96)}
.btn.ghost{color:var(--text)}
.btn.ghost:active{background:var(--press)}
.btn.line{border:1px solid var(--line-2);background:var(--panel)}
.btn.line:active{background:var(--press)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary kbd{background:transparent;color:inherit;border-color:rgba(255,255,255,.4)}
.btn.icon{width:44px;padding:0;justify-content:center}
.btn.dangert{color:var(--danger);padding:0 8px;margin-left:-8px}
.btn.dangert:active{background:var(--press)}
.bar .sp{flex:1}
.bar .btn{flex:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .btn.primary{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(232,69,122,.42)}
}
:root[data-theme="dark"] .btn.primary{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(232,69,122,.42)}

/* overlays */
#scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity 180ms ease;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#pickscrim{position:absolute;inset:0;z-index:59;display:none}
#pickscrim.on{display:block}
.pop{position:absolute;z-index:30;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:5px;width:248px;opacity:0;transform:scale(.96);pointer-events:none;transition:opacity 150ms ease,transform 180ms var(--ease-out)}
#pick{z-index:60}
.pop.on{opacity:1;transform:scale(1);pointer-events:auto}
.pop:not(.on) *{pointer-events:none!important}
.pop .mi{width:100%;height:44px;display:flex;align-items:center;gap:11px;padding:0 10px;border-radius:8px;font-size:14.5px;font-weight:480;text-align:left;transition:background-color 80ms ease}
.pop .mi:active{background:var(--group)}
.pop .mi .k{margin-left:auto;display:flex;gap:3px;align-items:center}
.pop .mi .rt{margin-left:auto;font-size:13px;color:var(--text-2)}
.pop .mi .tk{width:16px;flex:none;display:grid;place-items:center;color:var(--text)}
.pop .mi svg{color:var(--text-2);flex:none}
.pop .mi .tk svg{color:var(--text)}
.pop .mi.danger,.pop .mi.danger svg{color:var(--danger)}
.pop hr{border:0;height:1px;background:var(--line);margin:5px 6px}
.pop .mh{padding:8px 10px 6px;font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.pop .mh b{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis}
.pane{transition:transform 220ms var(--ease-out),opacity 160ms ease}
.panes{display:grid;overflow:hidden}
.panes .pane{grid-area:1/1}
.panes .pane.sub{transform:translateX(30%);opacity:0;pointer-events:none;max-height:0}
.panes.sub-on .pane.sub{max-height:none;transform:none;opacity:1;pointer-events:auto}
.panes.sub-on .pane.main{max-height:0;transform:translateX(-30%);opacity:0;pointer-events:none}

/* toast: sits under the scrim, never over an open menu */
#toast{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 66px);z-index:19;display:flex;align-items:center;gap:10px;height:52px;padding:0 4px 0 14px;border-radius:12px;background:var(--toast-bg);color:var(--toast-fg);font-size:14px;font-weight:500;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity 160ms ease,transform 240ms var(--ease-out),bottom 0ms}
#app.in-detail #toast{bottom:calc(var(--sab) + 12px)}
#toast.on{opacity:1;transform:none;pointer-events:auto}
#toastmsg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast .undo{margin-left:auto;min-height:44px;padding:0 12px;border-radius:8px;display:flex;gap:8px;align-items:center;font-weight:600}
#toast .undo:active{background:rgba(127,127,127,.25)}
#toast kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.6}

/* detail push: covers the bar, like a pushed screen */
.detail{position:absolute;left:0;right:0;top:var(--sat);bottom:0;z-index:10;display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);box-shadow:-1px 0 0 var(--line);visibility:hidden}
.detail.in{visibility:visible}
.detail .scroll{padding-bottom:calc(var(--sab) + 28px)}
.back{height:44px;display:inline-flex;align-items:center;gap:2px;margin-left:-8px;padding:0 8px;border-radius:8px;color:var(--text-2);font-size:14px;font-weight:520}
.back:active{background:var(--press)}
.crumb{color:var(--text-3);font-size:14px;margin-left:-6px}
.crumb b{color:var(--text);font-weight:600}

/* klausur */
.ktitle{padding:18px 16px 6px;font-size:22px;font-weight:640;letter-spacing:-.018em;line-height:1.15;font-stretch:94%}
.props{padding:4px 16px 0;display:grid;grid-template-columns:86px 1fr;font-size:14px}
.props dt{color:var(--text-2);height:40px;display:flex;align-items:center;font-size:13px}
.props dd{min-height:40px;display:flex;align-items:center;gap:8px}
.props .mut{color:var(--text-2);font-size:13px}
.grade{font-size:13px;font-weight:560;height:26px;min-width:32px;padding:0 7px;border:1px solid var(--line-2);border-radius:6px;display:inline-grid;place-items:center}
.pv{min-height:44px;display:inline-flex;align-items:center;gap:6px;margin-left:-8px;padding:0 8px;border-radius:8px;font-size:14px;font-weight:520;transition:background-color 80ms ease}
.pv:active{background:var(--press)}
.pv .tag{font-size:14px;color:var(--text)}
.pv .cv{color:var(--text-3)}

/* hausaufgabe detail */
.dtop{display:flex;align-items:flex-start;gap:12px;padding:12px 16px 4px 2px}
.dtop .lead{margin-top:2px}
.dtop textarea{flex:1;border:0;background:none;outline:none;resize:none;font-size:20px;font-weight:620;letter-spacing:-.012em;line-height:1.3;padding:11px 0 0;min-height:64px;transition:color 220ms ease}
.dtop[data-done="true"] textarea{color:var(--text-3)}
.dfoot{padding:24px 16px 0;border-top:1px solid var(--line);margin:18px 16px 0;padding-left:0}

/* abschrift */
.abs{padding:10px 16px 0;max-width:60ch}
.abs p{font-size:16px;line-height:1.55;margin-bottom:12px}
.abs .math{font-size:1.05em}
.absmeta{display:flex;gap:10px;align-items:center;padding:0 16px 14px;font-size:13px;color:var(--text-2);border-bottom:1px solid var(--line);margin-bottom:6px}

/* woche */
.days{flex:none;display:grid;grid-template-columns:repeat(5,1fr);position:relative;border-bottom:1px solid var(--line)}
.day{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--text-3);font-size:12px;font-weight:520;transition:color 160ms ease}
.day .d{font-size:16px;font-weight:560;color:var(--text-2);transition:color 160ms ease}
.day[aria-selected="true"]{color:var(--text-2)}
.day[aria-selected="true"] .d{color:var(--text);font-weight:640}
.day .today{width:4px;height:4px;border-radius:50%;background:var(--text-3);margin-top:1px}
.day .today.no{background:transparent}
.days .ind{position:absolute;left:0;bottom:-1px;height:2px;width:20%;transition:transform 260ms var(--ease-out)}
.days .ind::after{content:"";position:absolute;left:30%;right:30%;top:0;bottom:0;background:var(--text);border-radius:2px}
.dayc{transition:transform 220ms var(--ease-out),opacity 180ms ease}
.lesson{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:12px;min-height:54px;padding:0 16px}
.lesson .tm{font-size:13px;font-weight:560;line-height:1.35;color:var(--text)}
.lesson .tm i{display:block;font-style:normal;font-weight:450;color:var(--text-3)}
.lesson .su{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:480}
.lesson .rm{font-size:13px;color:var(--text-2)}
.empty{padding:16px 16px 18px;color:var(--text-2);font-size:14px;line-height:1.45;max-width:34ch}
.empty.sm{padding:8px 16px 4px;font-size:13px;color:var(--text-3)}

/* blätter */
.search{margin:10px 16px 4px;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:10px;background:var(--group);color:var(--text-3)}
.search input{border:0;background:none;outline:none;flex:1;height:100%}
.search input::placeholder{color:var(--text-3)}
.thumb{width:30px;height:38px;flex:none;border-radius:3px;background:#fbfbfa;border:1px solid var(--line-2);position:relative;overflow:hidden}
.brow{gap:12px;padding-left:16px;min-height:58px}
.ab{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3)}
.ab svg{flex:none}
.ab.prog{color:var(--text-2)}
.spin{animation:spin 1.1s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.row.newin{animation:newin 360ms var(--ease-out) both}
@keyframes newin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* lernblock */
.lbhead{padding:18px 16px 0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.timer{padding:4px 16px 0;font-family:var(--sans);font-weight:500;font-size:64px;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.tline{margin:12px 16px 0;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.tline i{display:block;height:100%;border-radius:2px;background:var(--text-2);transform-origin:left;transform:scaleX(0)}
.lbbtns{display:flex;gap:8px;padding:16px 16px 4px}
.lbbtns .btn{flex:1;justify-content:center}
.qcard{margin:12px 16px 0;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);overflow:hidden}
.qtop{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 0;font-size:12.5px;color:var(--text-2)}
.qbody{position:relative;min-height:150px}
.q{padding:10px 14px 14px;transition:transform 240ms var(--ease-out),opacity 180ms ease}
.q p{font-size:16.5px;line-height:1.45;font-weight:500;letter-spacing:-.005em}
.math{font-family:var(--math);font-weight:400;font-size:1.06em;letter-spacing:0}
.math i{font-style:italic}
.q .ans{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-2);font-size:15.5px;line-height:1.45;clip-path:inset(0 0 100% 0);opacity:0;transform:translateY(-4px);transition:clip-path 260ms var(--ease-out),opacity 160ms ease,transform 260ms var(--ease-out)}
.q.open .ans{clip-path:inset(0 0 0 0);opacity:1;transform:none}
.qfoot{display:flex;gap:8px;padding:0 14px 14px}
.qfoot .btn{flex:1;justify-content:center}

/* composer sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-radius:14px 14px 0 0;box-shadow:var(--shadow);padding:6px 0 calc(var(--sab) + 6px);transform:translateY(105%);transition:transform 340ms var(--ease-drawer);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:4px auto 6px}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:4px 16px 0;font-size:13px;color:var(--text-2)}
.sheet .sh b{color:var(--text);font-weight:600}
.sheet textarea{display:block;width:100%;border:0;background:none;outline:none;resize:none;padding:12px 16px 8px;font-size:17px;font-weight:500;line-height:1.35;height:64px}
.sheet textarea::placeholder{color:var(--text-3)}
.chips{display:flex;gap:6px;padding:4px 16px 12px;flex-wrap:wrap}
.chip{min-height:44px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;font-size:13px;font-weight:520;color:var(--text);transition:transform 120ms var(--ease-out),background-color 80ms ease}
.chip:active{transform:scale(.96);background:var(--group)}
.chip .lb{color:var(--text-2);font-weight:450}
.chip .cv{color:var(--text-3);margin-right:-3px}
.chip .val{display:inline-block}
.chip .val.swap{animation:swap 200ms var(--ease-out)}
@keyframes swap{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.sheet .sf{display:flex;align-items:center;gap:8px;padding:10px 12px 0;border-top:1px solid var(--line)}
.sheet .err{padding:0 16px 8px;font-size:12.5px;color:var(--danger);height:0;overflow:hidden;opacity:0;transition:opacity 150ms}
.sheet .err.on{height:auto;opacity:1}

/* camera */
#cam{position:absolute;inset:0;z-index:50;background:#0d0d0e;color:#f2f2f3;display:flex;flex-direction:column;transform:translateY(100%);transition:transform 360ms var(--ease-drawer);visibility:hidden}
#cam.on{transform:none;visibility:visible}
.camtop{padding:calc(var(--sat) + 4px) 12px 8px;display:flex;align-items:center;justify-content:space-between}
.camtop .btn{color:#f2f2f3}
.camtop .btn:active{background:rgba(255,255,255,.1)}
.camtop .btn[aria-pressed="true"]{color:#ffd45a}
.finder{position:relative;flex:1;margin:0 12px;border-radius:14px;overflow:hidden;background:#1c1c1f}
.desk{position:absolute;inset:0;background:#2a2622}
.desk::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 40%,transparent 40%,rgba(0,0,0,.45))}
.paper{position:absolute;left:50%;top:47%;width:62%;aspect-ratio:1/1.414;transform:translate(-50%,-50%) rotate(-3deg);background:#f4f3ef;border-radius:2px;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:9% 8%;transition:transform 420ms var(--ease-out),opacity 300ms ease}
.paper .pl{height:5px;border-radius:2px;background:#cfcdc6;margin-bottom:9px}
.paper .pl.h{width:55%;height:8px;background:#9a988f;margin-bottom:14px}
.paper .pl.hw{background:#8b93c7;height:3px;margin-bottom:11px}
.corners{position:absolute;left:50%;top:47%;width:66%;aspect-ratio:1/1.43;transform:translate(-50%,-50%) rotate(-3deg);pointer-events:none;transition:opacity 160ms ease}
.corners i{position:absolute;width:22px;height:22px;border:2.5px solid #f2f2f3}
.corners i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.corners i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.corners i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 6px}
.corners i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 6px 0}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12.5px;color:#d8d8dc}
.hint span{background:rgba(0,0,0,.5);padding:6px 10px;border-radius:7px}
.camfoot{height:132px;flex:none;display:flex;align-items:center;justify-content:center;padding-bottom:var(--sab);position:relative}
.shutter{width:70px;height:70px;border-radius:50%;border:3px solid #f2f2f3;display:grid;place-items:center;transition:transform 120ms var(--ease-out)}
.shutter i{width:56px;height:56px;border-radius:50%;background:#f2f2f3;display:block;transition:transform 120ms var(--ease-out)}
.shutter:active i{transform:scale(.9)}
.camfoot .cnt{position:absolute;left:28px;font-size:12.5px;color:#a6a6ad}
.review{position:absolute;left:0;right:0;bottom:0;background:var(--panel);color:var(--text);border-radius:14px 14px 0 0;padding:14px 0 calc(var(--sab) + 8px);transform:translateY(102%);transition:transform 340ms var(--ease-drawer)}
.review.on{transform:none}
.review .rh{display:flex;gap:12px;align-items:center;padding:0 16px 12px}
.review .rh .thumb{width:40px;height:52px}
.review .rh b{font-weight:600;font-size:15.5px;display:block}
.review .rh small{font-size:12.5px;color:var(--text-2)}
.review .chips{padding-bottom:14px}
.review .sf{display:flex;gap:8px;padding:10px 12px 0;border-top:1px solid var(--line)}

@media (hover:hover) and (pointer:fine){
  .row:not(.sw):hover{background:var(--group)}
  .row.sw:hover .rin{background:var(--group)}
  .btn.ghost:hover,.back:hover,.fold:hover,.pv:hover{background:var(--group)}
  .pop .mi:hover{background:var(--group)}
  .tab:hover{color:var(--text-2)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important}
  .row,.pop,#toast,.sheet,#cam,.review,.dayc,.q,.pane,.days .ind,.paper,.tab-ind{transition-property:opacity,background-color,color!important}
  .spin{animation:none}
}
</style>
</head>

/* ---------- FLIP ---------- */
function flip(scope, mutate) {
  const before = new Map();
  $$('[data-key]', scope).forEach(el => before.set(el.dataset.key, el.getBoundingClientRect()));
  const grpN = new Map();
  $$('[data-grp]', scope).forEach(g => { const s = g.querySelector('.n span'); if (s) grpN.set(g.dataset.grp, s.textContent); });
  mutate();
  if (reduce) return;
  $$('[data-key]', scope).forEach(el => {
    const b = before.get(el.dataset.key), a = el.getBoundingClientRect();
    if (!a.height) return;
    if (!b || !b.height) { el.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], { duration: 280, easing: EASE }); return; }
    const dy = b.top - a.top;
    if (Math.abs(dy) > 1) el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 360, easing: 'cubic-bezier(0.77,0,0.175,1)' });
  });
  $$('[data-grp]', scope).forEach(g => {
    const old = grpN.get(g.dataset.grp), sp = g.querySelector('.n span');
    if (sp && old !== undefined && old !== sp.textContent) {
      const up = (+sp.textContent || 0) > (+old || 0);
      sp.animate([{ transform: `translateY(${up ? 100 : -100}%)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 240, easing: EASE });
    }
  });
}

function activeScroll() {

}

/* ---------- toggle ---------- */
let lastUndo = null;
function toggleTask(id, viaKey) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  const was = t.done;
  $$(`[data-id="${id}"][data-done]`).forEach(r => {
    r.dataset.done = String(!was);
    const sc = r.querySelector('.sc');
    if (!was && sc && !viaKey) { sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump'); }
  });
  if (!was && navigator.vibrate) navigator.vibrate(8);
  t.done = !was; t.doneOn = t.done ? 'mo' : null;
  clearTimeout(t._tm); clearTimeout(t._fade);
  if (!reduce && !viaKey && t.done) {
    t._fade = setTimeout(() => {
      [['#v-heute', 'h-done'], ['#v-aufgaben', 'a-done']].forEach(([v, k]) => {
        if (S.collapsed[k] === false) return;
        $$(`${v} .row[data-id="${id}"]`).forEach(r => r.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, easing: 'ease', fill: 'forwards' }));
      });
    }, 440);
  }
  t._tm = setTimeout(rerenderFlip, viaKey ? 0 : 600);
  toast(t.done ? `Erledigt: ${t.t}` : `Wieder offen: ${t.t}`, () => { t.done = was; t.doneOn = was ? 'so' : null; clearTimeout(t._tm); clearTimeout(t._fade); rerenderFlip(); if (S.details.includes('aufgabe')) renderAufgabe(); });
}
function togglePlan(id) {
  const p = S.plan.find(x => x.id === id); if (!p) return;
  const was = p.done; p.done = !was;
  $$(`.row[data-id="${id}"]`).forEach(r => { r.dataset.done = String(!was); });
  setTimeout(() => { rerenderFlip(); if (S.details.includes('lernblock')) renderLernblock(); }, 500);
  toast(p.done ? `Lernblock „${p.t}“ erledigt` : `Lernblock wieder offen`, () => { p.done = was; rerenderFlip(); if (S.details.includes('lernblock')) renderLernblock(); });
}

/* edge swipe back, follows the finger */
$$('.detail').forEach(el => {
  let sx = 0, sy = 0, drag = false, x = 0, hist = [];
  el.addEventListener('pointerdown', e => {
    if (e.clientX - el.getBoundingClientRect().left > 28) return;
    sx = e.clientX; sy = e.clientY; drag = 'maybe'; x = 0; hist = [[e.clientX, e.timeStamp]];
  });
  el.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - sx;
    if (drag === 'maybe') { if (Math.abs(e.clientY - sy) > 10) { drag = false; return; } if (dx > 10) { drag = true; el.setPointerCapture(e.pointerId); el.getAnimations().forEach(a => a.cancel()); } else return; }

    drag = false;

    const below = belowEl(S.details.length - 1);

/* ---------- gestures on rows: tap, hold, swipe ---------- */
const TH = 76;
let press = null, suppressUntil = 0;

  if (e.clientX - $('#app').getBoundingClientRect().left < 20 && row.closest('.detail')) return;
  press = { row, x: e.clientX, y: e.clientY, fired: false, mode: null, dx: 0 };
  row.classList.add('pressing');

});
document.addEventListener('pointermove', e => {
  if (!press) return;
  const dx = e.clientX - press.x, dy = e.clientY - press.y;
  if (!press.mode) {

    clearTimeout(press.tm); press.row.classList.remove('pressing');
    if (!press.fired && press.row.classList.contains('sw') && Math.abs(dx) > Math.abs(dy) * 1.2) {
      press.mode = 'swipe'; press.rin = press.row.querySelector('.rin');
      press.rin.getAnimations().forEach(a => a.cancel());

  let x = dx; if (Math.abs(x) > lim) x = Math.sign(x) * (lim + (Math.abs(x) - lim) * 0.25);

  press.rin.style.transform = `translateX(${x}px)`;
  press.row.dataset.swipe = x > 0 ? 'r' : 'l';
  const armed = Math.abs(x) >= TH;

  if (p.mode !== 'swipe') return;

$('#chip-fach').addEventListener('click', e => openPick(e.currentTarget, 'Fach', fachItems(NEW.f), it => { NEW.f = it.v; paintChips(); bump($('#cf-v')); }));
$('#chip-due').addEventListener('click', e => openPick(e.currentTarget, 'Fällig am', dueItems(NEW.due), it => { NEW.due = it.v; paintChips(); bump($('#cd-v')); }));
function openSheet() {
  closeAll(); hideToast(); NEW.f = nextLessonFach(); NEW.due = 'di'; paintChips();
  $('#nt').value = ''; $('#nterr').classList.remove('on');
  $('#sheet').classList.add('on'); scrim(true);
  setTimeout(() => $('#nt').focus({ preventScroll: true }), reduce ? 0 : 200);
}
function closeSheet() { $('#sheet').classList.remove('on'); $('#nt').blur(); closePick(); scrim(false); }
$('#newbtn').addEventListener('click', openSheet);
$('[data-close]').addEventListener('click', closeSheet);
function saveNew() {
  const v = $('#nt').value.trim();
  if (!v) { $('#nterr').classList.add('on'); if (!reduce) $('#nt').animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }], { duration: 220, easing: 'ease-out' }); return; }
  const t = { id: 't' + Date.now(), f: NEW.f, t: v, due: NEW.due, done: false };
  closeSheet();
  if (S.view !== 'aufgaben' && S.view !== 'heute') goView('aufgaben', true);
  flip(activeScroll(), () => { S.tasks.push(t); renderAll(); });
  toast(`Angelegt für ${dueOf(t.due).s}`, () => { S.tasks.splice(S.tasks.indexOf(t), 1); rerenderFlip(); });
}
$('#save').addEventListener('click', saveNew);
$('#nt').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveNew(); } });
$('#nt').addEventListener('input', () => $('#nterr').classList.remove('on'));

/* ---------- camera ---------- */
const CAM = { f: 'MA' };
function resetCam() { $('#review').classList.remove('on'); $('#paper').style.transform = ''; $('#corners').style.opacity = ''; $('#camcnt').textContent = ''; }
function openCam() { closeAll(); closeSheet(); hideToast(); resetCam(); $('#cam').classList.add('on'); }
function closeCam() { $('#cam').classList.remove('on'); closePick(); }
$('#cambtn').addEventListener('click', openCam);
$('#camclose').addEventListener('click', closeCam);
$('#camflash').addEventListener('click', e => { const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on)); b.querySelector('.off').style.display = on ? 'none' : ''; });
$('#shutter').addEventListener('click', () => {
  if (navigator.vibrate) navigator.vibrate(12);
  if (!reduce) $('#flash').animate([{ opacity: .85 }, { opacity: 0 }], { duration: 260, easing: 'ease-out' });
  $('#corners').style.opacity = '0';
  $('#paper').style.transform = 'translate(-50%,-62%) rotate(0deg) scale(.86)';
  $('#camcnt').textContent = '1 Seite';
  setTimeout(() => $('#review').classList.add('on'), reduce ? 0 : 120);
});
$('#retake').addEventListener('click', resetCam);
$('#rv-more').addEventListener('click', resetCam);
$('#rv-fach').addEventListener('click', e => openPick(e.currentTarget, 'Fach', fachItems(CAM.f), it => { CAM.f = it.v; $('#rf-sq').style.setProperty('--c', F[CAM.f].c); $('#rf-v').textContent = F[CAM.f].n; bump($('#rf-v')); }));
$('#rf-sq').style.setProperty('--c', F.MA.c);
$('#file').addEventListener('click', () => {
  const s = { id: 's' + Date.now(), f: CAM.f, t: 'Blatt vom 12.10.', d: '12.10.', ab: 'prog', hand: true, text: '', fresh: true };
  S.sheets.unshift(s);
  closeCam();
  goView('blaetter', true);
  renderBlaetter();
  toast('Blatt abgelegt', () => { S.sheets.splice(S.sheets.indexOf(s), 1); renderBlaetter(); });
  setTimeout(() => {
    s.ab = 'done';
    const r = $(`#bl-list .row[data-id="${s.id}"] .ab`);
    if (r) { r.classList.remove('prog'); r.innerHTML = I.doc + '<span>Abschrift</span>'; if (!reduce) r.animate([{ opacity: 0, transform: 'translateY(3px)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: EASE }); }
  }, 2600);
});

/* ---------- lernblock ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('#tgo')) { LB.run ? pauseT() : startT(); return; }
  if (e.target.closest('#tend')) { pauseT(); const p = S.plan[0]; p.done = true; renderLernblock(); renderAll(); toast('Lernblock erledigt', () => { p.done = false; renderLernblock(); renderAll(); }); return; }
  const qb = e.target.closest('[data-q]'); if (!qb) return;
  const q = $('#qbody .q');
  if (qb.dataset.q === 'show') { q.classList.add('open'); $('#qfoot').innerHTML = qFoot(true); return; }
  const dir = qb.dataset.q === 'ok' ? -1 : 1;
  LB.qi = (LB.qi + 1) % QS.length;
  const old = q; const box = $('#qbody');
  box.insertAdjacentHTML('beforeend', qHtml(LB.qi));
  const nw = box.lastElementChild;
  old.style.position = 'absolute'; old.style.inset = '0';
  if (!reduce) {
    old.animate([{ transform: 'none', opacity: 1 }, { transform: `translateX(${dir * 40}px)`, opacity: 0 }], { duration: 200, easing: EASE, fill: 'forwards' }).onfinish = () => old.remove();
    nw.animate([{ transform: `translateX(${-dir * 40}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 260, easing: EASE });
  } else old.remove();
  $('#qn').textContent = LB.qi + 1;
  $('#qfoot').innerHTML = qFoot(false);
});
function curLeft() { return LB.run ? Math.max(0, LB.left - Math.floor((performance.now() - LB.t0) / 1000)) : LB.left; }
function tick() { const el = $('#tm'); if (el) el.textContent = fmt(curLeft()); }
function startT() {
  const tl = $('#tl'); if (!tl) return;
  LB.run = true; LB.t0 = performance.now();
  const frac = 1 - LB.left / 1500;
  tl.getAnimations().forEach(a => a.cancel());
  LB.anim = tl.animate([{ transform: `scaleX(${frac})` }, { transform: 'scaleX(1)' }], { duration: LB.left * 1000, easing: 'linear', fill: 'forwards' });
  LB.timer = setInterval(tick, 250);
  const b = $('#tgo'); if (b) b.innerHTML = I.pause + 'Pause';
  renderHeute(); renderKlausur(); renderDay();
}
function pauseT() {
  if (!LB.run) return;
  LB.left = curLeft(); LB.run = false; clearInterval(LB.timer);
  if (LB.anim) LB.anim.pause();
  const b = $('#tgo'); if (b) b.innerHTML = I.play + 'Weiter';
  renderHeute(); renderKlausur(); renderDay();
}

/* ---------- keyboard: only for people who have one ---------- */
let gPending = false;
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) { if (e.key === 'Escape') { closeSheet(); e.target.blur(); } return; }
  const k = e.key.toLowerCase();
  if (k === 'escape') { if ($('#pick.on')) closePick(); else if ($('#cam').classList.contains('on')) closeCam(); else if ($('#ctx.on')) closeAll(); else if ($('#sheet.on')) closeSheet(); else popDetail(); return; }
  if ($('#ctx.on')) { const map = { e: 'done', d: 'due', b: 'sheet', backspace: 'del', l: 'lernblock', k: 'klausur', enter: 'open', r: 'abruf' }; const a = map[k]; const b = a && $(`#ctx [data-act="${a}"]`); if (b) b.click(); return; }
  if (gPending) { gPending = false; const m = { h: 'heute', a: 'aufgaben', w: 'woche', b: 'blaetter' }[k]; if (m) goView(m, true); else if (k === 'k') { popAll(); pushDetail('klausur'); } return; }
  if (k === 'g') { gPending = true; setTimeout(() => gPending = false, 900); return; }
  if (k === 'n') { e.preventDefault(); openSheet(); }
  if (k === 'b') openCam();
  if (k === 'z' && lastUndo) $('#undo').click();
  if (k === ' ' && S.details.includes('lernblock')) { e.preventDefault(); const b = $('#tgo'); b && b.click(); }
});

/* init */
setTabs(); renderAll(); renderDays(); renderBlaetter();
let seen = false; try { seen = localStorage.getItem('sd-hint') === '1'; localStorage.setItem('sd-hint', '1'); } catch (_) {}
if (!seen) setTimeout(() => toast('Wischen hakt ab, Halten zeigt Aktionen.'), 700);
window.__S = S; window.__api = { goView, pushDetail, popDetail, openCtx, openSheet, openCam, setDay, toggleTask, hideToast };
})();
</script>
</body>
</html>
