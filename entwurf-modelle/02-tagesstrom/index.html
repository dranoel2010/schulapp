<script>
'use strict';
const $=s=>document.querySelector(s), icon=n=>`<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
const tasks=[{id:'math',subject:'Mathematik',title:'S. 84, Nr. 3–5',done:false},{id:'german',subject:'Deutsch',title:'Gedichtanalyse beenden',done:false},{id:'english',subject:'Englisch',title:'Vokabeln Unit 3',done:true}];
let savedSheet=false,studyDone=false,seconds=1500,running=false,ticker=null,weekDay=0,lesson='Mathematik',stack=[],lastFocus=null,toastTimer,undoAction=null,toastReturnTask=null;
try{const saved=JSON.parse(localStorage.getItem('tagesstrom-02')||'null');if(saved){tasks.forEach(t=>{if(typeof saved[t.id]==='boolean')t.done=saved[t.id]});savedSheet=!!saved.sheet;studyDone=!!saved.study}}catch{}
function persist(){try{localStorage.setItem('tagesstrom-02',JSON.stringify(Object.fromEntries([...tasks.map(t=>[t.id,t.done]),['sheet',savedSheet],['study',studyDone]])))}catch{}}
function taskHTML(t,compact=false){return `<button class="task" role="checkbox" aria-checked="${t.done}" data-task="${t.id}" aria-label="${t.subject}: ${t.title}"><span class="check">${icon('check')}</span><span class="task-copy"><strong>${compact?t.subject:t.title}</strong><small>${compact?t.title:t.subject}</small></span></button>`}
function syncTasks(){const focusId=document.activeElement?.dataset.task;$('#home-tasks').innerHTML=tasks.slice(0,2).map(t=>taskHTML(t)).join('');if(stack.at(-1)==='tasks'){$('#task-list').innerHTML=tasks.slice(0,2).map(t=>taskHTML(t)).join('');$('#yesterday').innerHTML=taskHTML(tasks[2]);$('#task-count').textContent=`${tasks.slice(0,2).filter(t=>!t.done).length} offen`;if(focusId)$('#sheet-body').querySelector(`[data-task="${focusId}"]`)?.focus({preventScroll:true})}$('#home-duration').textContent=studyDone?'Erledigt':'25 Min.';$('#home-study-label').textContent=studyDone?'Lernblock ansehen':running?'Weiterlernen':'Lernen beginnen'}
function hideToast(){const el=$('#toast');if(el.contains(document.activeElement)){if(stack.length)sheet.focus({preventScroll:true});else{const homeTask=toastReturnTask?$('#home').querySelector('[data-task="'+toastReturnTask+'"]'):null;(homeTask||(lastFocus?.isConnected?lastFocus:null)||$('#home').querySelector('button')).focus({preventScroll:true})}}el.classList.remove('show');el.inert=true}
function toast(msg,action){clearTimeout(toastTimer);toastReturnTask=document.activeElement?.dataset.task||null;$('#toast-text').textContent=msg;undoAction=action;$('#undo').hidden=!action;const el=$('#toast');(stack.length?sheet:$('#app')).append(el);el.inert=false;el.classList.add('show');toastTimer=setTimeout(hideToast,4200)}
$('#undo').onclick=()=>{undoAction?.();hideToast()};
function toggleTask(id){const t=tasks.find(t=>t.id===id);t.done=!t.done;persist();document.querySelectorAll(`[data-task="${id}"]`).forEach(b=>b.setAttribute('aria-checked',String(t.done)));if($('#task-count'))$('#task-count').textContent=`${tasks.slice(0,2).filter(t=>!t.done).length} offen`;if(t.done)toast(`${t.subject} erledigt`,()=>{t.done=false;persist();syncTasks()});else toast(`${t.subject} wieder offen`)}

if(view==='exam')body.innerHTML=`<div class="exam-date"><div class="date-tile">Fr<strong>16</strong></div><div><p>16. Oktober 2026</p><small class="muted">In 4 Tagen</small></div></div><h3 class="exam-title" style="font-size:30px;margin:0">Quadratische<br>Funktionen</h3><p class="exam-meta">Klausur in Mathematik</p><h3>Dein Lernplan</h3><div class="plan"><div class="plan-row today"><span class="plan-dot"></span><button data-open="study"><time>Heute · 25 Minuten</time><strong>Scheitelpunktform</strong><p>${studyDone?'Erledigt':running?'Lernblock läuft':'Ohne feste Uhrzeit'}</p></button></div><div class="plan-row"><span class="plan-dot"></span><time>Mittwoch, 14. Oktober</time><strong>Wiederholung</strong><p>Quadratische Funktionen</p></div><div class="plan-row"><span class="plan-dot"></span><time>Donnerstag, 15. Oktober</time><strong>Probeklausur</strong><p>Vorbereitung auf Freitag</p></div></div><button class="primary" data-open="study">${icon('play')}${studyDone?'Lernblock ansehen':running?'Weiterlernen':'Lernblock beginnen'}</button>`;

if(view==='saved')body.innerHTML=`<div class="saved-icon">${icon('check')}</div><h3 style="font-size:28px;margin-top:0">In deinem Material.</h3><p class="muted" style="font-size:15px;margin:14px 0 28px">${escapeHTML(sheetName)} liegt jetzt unter ${escapeHTML(sheetSubject)}.</p><button class="primary" data-open="sheetDetail">Blatt ansehen</button><button class="secondary" data-action="close">Zurück zum Tag</button>`;
if(view==='material')body.innerHTML=savedSheet?`<p class="intro">Deine aufgenommenen Blätter.</p>${menuRow(escapeHTML(sheetName),'sheetDetail','file')}<p class="muted" style="font-size:13px;margin-top:12px">${escapeHTML(sheetSubject)} · Heute aufgenommen</p><button class="secondary" data-open="camera">${icon('camera')} Beispielblatt ersetzen</button>`:`<p class="empty">Hier liegen deine aufgenommenen Blätter.<br>Du hast noch kein Blatt gespeichert.</p><button class="primary" data-open="camera">${icon('camera')} Blatt aufnehmen</button>`;
if(view==='sheetDetail'){ $('#sheet-title').textContent=sheetName;body.innerHTML=`<p class="intro">${escapeHTML(sheetSubject)} · 12. Oktober 2026</p><div class="preview-paper"><h3>Quadratische Funktionen</h3><p>Die Scheitelpunktform</p><div class="formula">f(x) = a(x − d)² + e</div><p>Der Scheitelpunkt liegt bei S(d | e).</p></div><h3>Abschrift</h3><p class="muted" style="font-size:13px;margin-bottom:14px">Beispieltext zur Kameravorschau</p><p>Die Scheitelpunktform einer quadratischen Funktion lautet f(x) = a(x − d)² + e. Der Scheitelpunkt ist S(d | e).</p><button class="text-action" data-open="recall">Wissen dazu abrufen</button>`}

if(view==='recall')body.innerHTML=`<p class="intro">Mathematik · Scheitelpunktform</p><p class="recall-question">Wo liegt der Scheitelpunkt von<br>f(x) = (x − 3)² + 2?</p><div class="answer" id="answer"></div><button class="primary" data-action="reveal" id="reveal">Antwort zeigen</button>`;
if(view==='lesson'){const detail={Deutsch:['08:00 bis 09:30','R. 104'],Mathematik:['09:50 bis 11:20','R. 208'],Biologie:['11:40 bis 13:10','Bio 1']}[lesson];body.innerHTML=`<p class="intro">Heute · ${detail[0]}</p><h3 style="font-size:32px;margin-top:7px">${detail[1]}</h3>${lesson==='Mathematik'?menuRow('Klausur am Freitag','exam','file'):''}${lesson!=='Biologie'?menuRow('Hausaufgaben','tasks','tasks'):''}${menuRow('Blatt aufnehmen','camera','camera')}${menuRow('Stundenplan','week','calendar')}`}

let sheetName='Scheitelpunktform',sheetSubject='Mathematik';try{const saved=JSON.parse(localStorage.getItem('tagesstrom-02-sheet')||'null');if(saved){sheetName=saved.name;sheetSubject=saved.subject}}catch{}
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderDay(){const content=$('#week-content');if(weekDay===0)content.innerHTML=`${[['08:00','09:30','Deutsch','R. 104'],['09:50','11:20','Mathematik','R. 208'],['11:40','13:10','Biologie','Bio 1']].map(r=>`<div class="week-row"><time>${r[0]}<br>${r[1]}</time><button data-lesson="${r[2]}"><strong>${r[2]}</strong><p>${r[3]}</p></button></div>`).join('')}<p class="muted" style="font-size:13px;margin-top:20px">Ab 13:10 frei.</p>`;else{const data=[null,['Für Dienstag','Hausaufgaben','Mathematik und Deutsch','tasks'],['Mittwoch','Wiederholung','Quadratische Funktionen','exam'],['Donnerstag','Probeklausur','Vorbereitung auf Freitag','exam'],['Freitag, 16. Oktober','Mathematik-Klausur','Quadratische Funktionen','exam']][weekDay];content.innerHTML=`<div class="week-row"><time>${data[0]}</time><button data-open="${data[3]}"><strong>${data[1]}</strong><p>${data[2]}</p></button></div><p class="empty">Für diesen Tag sind im Entwurf keine Unterrichtsstunden hinterlegt.</p>`}}
const sheet=$('#sheet'),reduced=matchMedia('(prefers-reduced-motion: reduce)');let position=900,velocity=0,target=0,raf=null,previousTime=0,closing=false,drag=null;
function paint(){sheet.style.transform=reduced.matches?'none':`translateY(${position}px)`;sheet.style.opacity=reduced.matches?(closing?'0':'1'):'1'}
function settle(){cancelAnimationFrame(raf);if(reduced.matches){position=target;paint();if(closing)finishClose();return}previousTime=performance.now();raf=requestAnimationFrame(frame)}
function frame(now){const dt=Math.min((now-previousTime)/1000,.025);previousTime=now;const omega=2*Math.PI/.3;velocity+=(-omega*omega*(position-target)-2*omega*velocity)*dt;position+=velocity*dt;paint();if(Math.abs(position-target)<.5&&Math.abs(velocity)<5){position=target;velocity=0;paint();raf=null;if(closing)finishClose()}else raf=requestAnimationFrame(frame)}
function open(view){if(!stack.length){lastFocus=document.activeElement;stack.push(view);render(view);sheet.append($('#toast'));sheet.inert=false;sheet.classList.add('visible');$('#home').inert=true;$('#app').classList.add('layer-open');closing=false;position=sheet.getBoundingClientRect().height+24;velocity=0;target=0;paint();settle()}else{stack.push(view);render(view);if(!reduced.matches)$('#sheet-body').animate([{opacity:.35,transform:'translateY(7px)'},{opacity:1,transform:'none'}],{duration:180,easing:'cubic-bezier(.23,1,.32,1)'})}sheet.focus({preventScroll:true})}
function close(){closing=true;target=sheet.offsetHeight+24;$('#app').classList.remove('layer-open');settle()}
function finishClose(){stack=[];$('#app').append($('#toast'));sheet.inert=true;sheet.classList.remove('visible');$('#home').inert=false;lastFocus?.focus({preventScroll:true});syncTasks()}
function back(){if(stack.length>1){stack.pop();render(stack.at(-1));sheet.focus({preventScroll:true})}else close()}
$('#close').onclick=close;$('#back').onclick=back;$('#scrim').onclick=close;
const zone=$('#drag-zone');zone.onpointerdown=e=>{if(drag||!e.isPrimary||e.button!==0)return;cancelAnimationFrame(raf);zone.setPointerCapture(e.pointerId);drag={id:e.pointerId,start:e.clientY,base:position,last:e.clientY,time:e.timeStamp};velocity=0};zone.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;const delta=e.clientY-drag.start;position=drag.base+delta;if(position<0)position=position/(1+Math.abs(position)/60);const dt=e.timeStamp-drag.time;if(dt>0)velocity=(e.clientY-drag.last)/dt*1000;drag.last=e.clientY;drag.time=e.timeStamp;paint()};function endDrag(e,cancelled=false){if(!drag||e.pointerId!==drag.id)return;if(e.timeStamp-drag.time>80)velocity=0;drag=null;closing=!cancelled&&(position+velocity*.15>110);target=closing?sheet.offsetHeight+24:0;$('#app').classList.toggle('layer-open',!closing);settle()}zone.onpointerup=e=>endDrag(e);zone.onpointercancel=e=>endDrag(e,true);
document.addEventListener('keydown',e=>{if(!stack.length)return;if(e.key==='Escape'){e.preventDefault();back()}if(e.key==='Tab'){const elements=[...sheet.querySelectorAll('button:not([hidden]),input,select')].filter(el=>el.getClientRects().length&&!el.closest('[inert]'));const first=elements[0],last=elements.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===sheet)){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===sheet)){e.preventDefault();first.focus()}}});
function formatTime(){return `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`}
let timerEnd=0;function updateClock(){if(running)seconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if($('#timer'))$('#timer').textContent=formatTime();if(running&&seconds===0){running=false;clearInterval(ticker);if(stack.at(-1)==='study')render('study');toast('25 Minuten geschafft. Lernblock abhaken?');syncTasks()}}
function toggleTimer(){running=!running;if(running){timerEnd=Date.now()+seconds*1000;ticker=setInterval(updateClock,250)}else clearInterval(ticker);render('study');syncTasks()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open){open(b.dataset.open);return}if(b.dataset.task){toggleTask(b.dataset.task);return}if(b.dataset.lesson){lesson=b.dataset.lesson;open('lesson');return}if(b.dataset.day!==undefined){weekDay=Number(b.dataset.day);render('week');return}switch(b.dataset.action){case 'close':close();break;case 'timer':toggleTimer();break;case 'finish-study':running=false;clearInterval(ticker);studyDone=true;persist();render('study');syncTasks();toast('Lernblock erledigt',()=>{studyDone=false;persist();if(stack.at(-1)==='study')render('study');syncTasks()});break;case 'restart-study':studyDone=false;seconds=1500;persist();render('study');syncTasks();break;case 'retake':back();break;case 'save-sheet':{const name=$('#sheet-name').value.trim();if(!name){$('#save-error').textContent='Gib dem Blatt einen Titel.';$('#sheet-name').focus();return}sheetName=name;sheetSubject=$('#sheet-subject').value;savedSheet=true;persist();try{localStorage.setItem('tagesstrom-02-sheet',JSON.stringify({name:sheetName,subject:sheetSubject}))}catch{}stack[stack.length-1]='saved';render('saved');break}case 'reveal':$('#answer').innerHTML='<strong>S(3 | 2)</strong><p class="muted" style="font-size:15px;margin-top:12px">Lies d und e aus der Scheitelpunktform ab.</p>';b.textContent='Verstanden';b.dataset.action='understood';break;case 'understood':$('#answer').innerHTML='<p>Für heute abgefragt.</p>';b.textContent='Zurück zum Lernblock';b.dataset.action='recall-back';break;case 'recall-back':if(stack.includes('study'))back();else open('study');break}});
syncTasks();
