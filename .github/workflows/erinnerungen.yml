# Stündlicher Auslöser für die Erinnerungs-Route.
#
# Warum nicht der Cron in vercel.json: Auf dem Hobby-Tarif erlaubt Vercel
# höchstens einen Lauf pro Tag; ein stündlicher Ausdruck lässt das Deployment
# scheitern ("Hobby accounts are limited to daily cron jobs"). Die Route
# entscheidet aber selbst anhand der Berliner Uhrzeit, wer gerade dran ist —
# einmal am Tag geht die Rechnung also nicht auf.
#
# EIN Wert muss im Repo unter Settings → Secrets and variables → Actions
# hinterlegt sein:
#   CRON_SECRET  dasselbe Geheimnis wie in der Umgebung der App
#
# Die Adresse steht dagegen unten im Klartext. Sie war einmal ein Secret, und
# genau daran ist der Lauf am 23.8.2026 gescheitert: war sie nicht gesetzt,
# rief curl "/api/cron/reminders" ohne Host auf und brach mit Exit 3 ab — eine
# Fehlermeldung, die nach einem kaputten Workflow aussieht und keine ist. Ein
# Geheimnis war sie ohnehin nie: die Adresse steht auf jedem Handy in der
# Adressleiste. Wer die App woanders betreibt, überschreibt sie mit einem
# Secret oder einer Variablen gleichen Namens, ohne diese Datei anzufassen.
name: Erinnerungen

on:
  schedule:
    # Fünf nach voll, damit der Lauf nicht mit der vollen Stunde konkurriert.
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  ausloesen:
    runs-on: ubuntu-latest
    steps:
      - name: Erinnerungs-Route aufrufen
        env:
          # Secret und Variable dürfen sie überschreiben; unten wird der Wert
          # geprüft und, wenn er keine Adresse ist, verworfen.
          APP_URL_ROH: ${{ secrets.APP_URL || vars.APP_URL || '' }}
          APP_URL_VORGABE: https://schulapp-teal.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          # Die Adresse wird geprüft, statt ihr zu glauben.
          #
          # Am 23.8.2026 stand in APP_URL etwas, das keine Adresse war. Der Lauf
          # starb mit "Process completed with exit code 3" — curls Code für
          # "URL fehlerhaft" —, und weil ein Secret im Protokoll maskiert wird,
          # war nicht zu sehen, woran es lag. Ein Rückfallwert allein half
          # nicht: ein gesetztes, aber kaputtes Secret ist nicht leer und
          # gewinnt gegen jede Vorgabe.
          #
          # Deshalb: Leerzeichen und Zeilenumbrüche weg, Schrägstriche am Ende
          # weg, und wer danach nicht wie "https://…" aussieht, wird verworfen.
          # Ein falsch gefülltes Secret kann die Erinnerung damit nicht mehr
          # stilllegen — es kostet höchstens eine Warnung.
          APP_URL=$(printf '%s' "${APP_URL_ROH}" | tr -d '[:space:]' | sed 's:/*$::')

          if [ -n "${APP_URL}" ] && ! printf '%s' "${APP_URL}" | grep -qE '^https?://[A-Za-z0-9.-]+'; then
            echo "::warning::APP_URL ist gesetzt, sieht aber nicht wie eine Adresse aus (erwartet: https://…). Der Wert wird ignoriert."
            APP_URL=""
          fi

          if [ -z "${APP_URL}" ]; then
            APP_URL="${APP_URL_VORGABE}"
          fi

          echo "Rufe auf: ${APP_URL}/api/cron/reminders"

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET ist leer. Es gehört unter Settings → Secrets and variables → Actions als *Repository secret* — nicht als Environment secret."
            exit 1
          fi

          antwort=$(mktemp)
          code=$(curl -sS --max-time 60 -o "$antwort" -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/reminders")
          cat "$antwort"
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Die Route hat ${code} geantwortet."
            exit 1
          fi
