# Stündlicher Auslöser für die Erinnerungs-Route.
#
# Warum nicht der Cron in vercel.json: Auf dem Hobby-Tarif erlaubt Vercel
# höchstens einen Lauf pro Tag; ein stündlicher Ausdruck lässt das Deployment
# scheitern ("Hobby accounts are limited to daily cron jobs"). Die Route
# entscheidet aber selbst anhand der Berliner Uhrzeit, wer gerade dran ist —
# einmal am Tag geht die Rechnung also nicht auf.
#
# (Vercel ist seit dem 30.8.2026 Geschichte — siehe weiter unten. Der Absatz
# bleibt trotzdem stehen, weil er die Frage beantwortet, die sich sonst jeder
# neu stellt: warum der Auslöser überhaupt bei GitHub liegt und nicht bei dem,
# der die App betreibt.)
#
# EIN Wert muss im Repo unter Settings → Secrets and variables → Actions
# hinterlegt sein:
#   CRON_SECRET  dasselbe Geheimnis wie in der Umgebung der App
#
# Achtung — das ist der Absatz, wegen dem diese Datei gerade wahrscheinlich
# nichts bewirkt: Beim Umzug auf das NAS am 30.8.2026 wurden die VAPID-
# Schlüssel und das CRON_SECRET neu erzeugt. Die gültigen Werte stehen
# ausschließlich in der `.env` auf dem NAS; das Secret hier im Repo ist
# höchstwahrscheinlich noch das alte aus der Vercel-Zeit. Von hier aus ist das
# nicht zu reparieren: Der Workflow bekommt das Secret zwar zu sehen, kann aber
# nicht wissen, ob es das richtige ist — die Prüfung unten fragt nur, ob
# überhaupt etwas drinsteht —, und ändern kann er es schon gar nicht.
#
# So sieht es aus, wenn es zutrifft: Die Route antwortet mit 401 und dem Satz
# "Nicht erlaubt." (src/app/api/cron/reminders/route.ts). Beides steht im
# Protokoll dieses Laufs, die Antwort der Route über der Zeile „Die Route hat
# 401 geantwortet" — man muss nur wissen, dass 401 hier nichts über den
# Workflow sagt, sondern über ein Textfeld in den Repo-Einstellungen. Bis das
# Secret nachgezogen ist, kommt keine einzige Erinnerung an, und weder die App
# noch das Handy merken etwas davon, weil beide gar nicht gefragt werden. Die
# Reparatur ist reines Abschreiben: CRON_SECRET aus der `.env` auf dem NAS
# holen und unter Settings → Secrets and variables → Actions neu hinterlegen.
#
# Die Adresse steht dagegen unten im Klartext. Sie war einmal ein Secret, und
# genau daran ist der Lauf am 23.8.2026 gescheitert: war sie nicht gesetzt,
# rief curl "/api/cron/reminders" ohne Host auf und brach mit Exit 3 ab — eine
# Fehlermeldung, die nach einem kaputten Workflow aussieht und keine ist. Ein
# Geheimnis war sie ohnehin nie: die Adresse steht auf jedem Handy in der
# Adressleiste. Wer die App woanders betreibt, überschreibt sie mit einem
# Secret oder einer Variablen gleichen Namens, ohne diese Datei anzufassen.
#
# Wohin sie zeigt, hat sich am 30.8.2026 geändert. Bis dahin lief die App auf
# Vercel unter https://schulapp-teal.vercel.app mit einer Neon-Datenbank;
# seitdem läuft sie in Docker auf einem Synology-NAS im Heimnetz und ist über
# Tailscale Funnel unter https://treskownas.tail3a40b0.ts.net öffentlich
# erreichbar. Die Vercel-Adresse ist abgeschaltet, und das ist der unangenehme
# Teil: Ein Aufruf dorthin ist kein Fehler, den jemand bemerkt, sondern eine
# Erinnerung, die niemanden erreicht. Deshalb steht unten jetzt die
# Funnel-Adresse als Vorgabe. Am Überschreiben ändert das nichts: ein Secret
# oder eine Variable APP_URL gewinnt weiterhin gegen die Vorgabe, und wer die
# App noch einmal woandershin trägt, fasst diese Datei nicht an.
#
# Was dieser Auslöser nicht kann: warten. curl bricht nach 60 Sekunden ab
# (--max-time unten), der Lauf gilt dann als gescheitert, und ob die Route im
# NAS trotzdem zu Ende gelaufen ist und ihre Nachrichten verschickt hat, steht
# nirgends. Auf Vercel war das kein Thema; im Heimnetz schon, denn hier hängt
# eine Antwort an einem Gerät, das seine Platten erst hochfahren kann, und an
# einem Funnel, der die Verbindung erst aufbauen muss. Wenn das je regelmäßig
# passiert, gehört der Auslöser nicht hierher, sondern in den Aufgabenplaner
# von DSM: Der sitzt neben der App auf demselben Gerät, erreicht sie direkt
# über den Port, den der Funnel nach außen gibt — ohne Funnel, ohne offenes
# Netz, ohne GitHub —, und er darf so lange laufen, wie er will. Das Geheimnis
# läge dann auch dort, wo die App es ohnehin hat, und die Falle mit dem alten
# Secret weiter oben wäre gleich mit erledigt.
name: Erinnerungen

on:
  schedule:
    # Fünf nach voll, damit der Lauf nicht mit der vollen Stunde konkurriert.
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  ausloesen:
    runs-on: ubuntu-latest
    steps:
      - name: Erinnerungs-Route aufrufen
        env:
          # Secret und Variable dürfen sie überschreiben; unten wird der Wert
          # geprüft und, wenn er keine Adresse ist, verworfen.
          APP_URL_ROH: ${{ secrets.APP_URL || vars.APP_URL || '' }}
          # Seit dem 30.8.2026 das NAS hinter Tailscale Funnel, nicht mehr
          # Vercel. Siehe den Kopf dieser Datei.
          APP_URL_VORGABE: https://treskownas.tail3a40b0.ts.net
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          # Die Adresse wird geprüft, statt ihr zu glauben.
          #
          # Am 23.8.2026 stand in APP_URL etwas, das keine Adresse war. Der Lauf
          # starb mit "Process completed with exit code 3" — curls Code für
          # "URL fehlerhaft" —, und weil ein Secret im Protokoll maskiert wird,
          # war nicht zu sehen, woran es lag. Ein Rückfallwert allein half
          # nicht: ein gesetztes, aber kaputtes Secret ist nicht leer und
          # gewinnt gegen jede Vorgabe.
          #
          # Deshalb: Leerzeichen und Zeilenumbrüche weg, Schrägstriche am Ende
          # weg, und wer danach nicht wie "https://…" aussieht, wird verworfen.
          # Ein falsch gefülltes Secret kann die Erinnerung damit nicht mehr
          # stilllegen — es kostet höchstens eine Warnung.
          APP_URL=$(printf '%s' "${APP_URL_ROH}" | tr -d '[:space:]' | sed 's:/*$::')

          if [ -n "${APP_URL}" ] && ! printf '%s' "${APP_URL}" | grep -qE '^https?://[A-Za-z0-9.-]+'; then
            echo "::warning::APP_URL ist gesetzt, sieht aber nicht wie eine Adresse aus (erwartet: https://…). Der Wert wird ignoriert."
            APP_URL=""
          fi

          if [ -z "${APP_URL}" ]; then
            APP_URL="${APP_URL_VORGABE}"
          fi

          echo "Rufe auf: ${APP_URL}/api/cron/reminders"

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET ist leer. Es gehört unter Settings → Secrets and variables → Actions als *Repository secret* — nicht als Environment secret."
            exit 1
          fi

          antwort=$(mktemp)
          code=$(curl -sS --max-time 60 -o "$antwort" -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/reminders")
          cat "$antwort"
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Die Route hat ${code} geantwortet."
            exit 1
          fi
